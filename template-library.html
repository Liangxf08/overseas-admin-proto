<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模板库 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="template-library.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
        <div class="content-card">
          <div class="filter-panel">
            <div class="page-tabs" id="typeTabs" role="tablist" aria-label="模板类型">
              <button class="page-tabs__item is-active" type="button" data-type="" role="tab" aria-selected="true">全部</button>
              <button class="page-tabs__item" type="button" data-type="钩子" role="tab" aria-selected="false">钩子</button>
              <button class="page-tabs__item" type="button" data-type="边框" role="tab" aria-selected="false">边框</button>
              <button class="page-tabs__item" type="button" data-type="口播" role="tab" aria-selected="false">口播</button>
              <button class="page-tabs__item" type="button" data-type="贴纸" role="tab" aria-selected="false">贴纸</button>
            </div>

            <div class="filter-bar" id="filterBar">
              <div class="filter-item filter-item--date" id="dateRangeWrap">
                <button class="date-range-trigger" type="button" id="dateRangeTrigger">
                  <span class="date-range-trigger__text" id="dateRangeLabel">上传时间：-</span>
                </button>
                <div class="date-panel" id="datePanel">
                  <div class="date-panel__shortcuts" id="dateShortcuts">
                    <button class="date-shortcut" type="button" data-shortcut="today">今天</button>
                    <button class="date-shortcut" type="button" data-shortcut="yesterday">昨天</button>
                    <button class="date-shortcut is-active" type="button" data-shortcut="last7">近7天</button>
                    <button class="date-shortcut" type="button" data-shortcut="last30">近30天</button>
                    <button class="date-shortcut" type="button" data-shortcut="thisWeek">本周</button>
                    <button class="date-shortcut" type="button" data-shortcut="lastWeek">上周</button>
                    <button class="date-shortcut" type="button" data-shortcut="thisMonth">本月</button>
                    <button class="date-shortcut" type="button" data-shortcut="lastMonth">上月</button>
                  </div>
                  <div class="date-panel__calendars">
                    <div class="date-cal" id="dateCalLeft"></div>
                    <div class="date-cal" id="dateCalRight"></div>
                  </div>
                </div>
              </div>

              <div class="filter-item" id="uploaderWrap">
                <button class="select-trigger" type="button" id="uploaderTrigger">
                  <span class="select-trigger__text" id="uploaderLabel">上传人：<span class="muted">请选择</span></span>
                  <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                </button>
                <button class="select-clear" type="button" id="uploaderClear" aria-label="清除">
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                </button>
                <div class="search-select-panel" id="uploaderPanel">
                  <div class="search-select-panel__search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                    <input type="text" id="uploaderSearch" placeholder="搜索" autocomplete="off" />
                  </div>
                  <div class="search-select-panel__list" id="uploaderList"></div>
                </div>
              </div>

              <div class="filter-item">
                <input class="input" id="filterName" type="text" placeholder="模板名称" autocomplete="off" />
              </div>

              <div class="filter-actions">
                <button class="btn btn--default" type="button" id="resetBtn">重置</button>
                <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
                <button class="btn btn--primary" type="button" id="uploadBtn">上传</button>
              </div>
            </div>
          </div>

          <div class="data-panel" id="dataPanel">
            <div class="type-hint" id="typeHint">
              <span class="type-hint__label">用法说明</span>
              <span class="type-hint__text" id="typeHintText">钩子用于片头/片尾拼接；边框、贴纸盖在原视频上；口播叠加音轨。</span>
            </div>
            <div class="table-shell">
              <div class="table-wrap" id="tableWrap">
                <table class="data-table" id="dataTable">
                  <colgroup>
                    <col style="width:88px" />
                    <col style="width:200px" />
                    <col style="width:100px" />
                    <col style="width:140px" />
                    <col style="width:140px" />
                    <col style="width:112px" />
                    <col style="width:180px" />
                    <col style="width:140px" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>预览</th>
                      <th>模板名称</th>
                      <th>类型</th>
                      <th>用法</th>
                      <th>规格</th>
                      <th>上传人</th>
                      <th>上传时间</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
  </div>

  <!-- 上传模板 -->
  <div class="modal-mask modal-mask--dropdown" id="uploadModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="uploadModalTitle">上传模板</h2>
        <button class="modal__close" type="button" data-close="uploadModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item" id="upTypeItem">
          <label class="form-item__label is-required">模板类型</label>
          <div class="form-item__control">
            <div class="seg" id="upTypeSeg" role="group" aria-label="模板类型">
              <button type="button" class="seg__item is-active" data-value="钩子">钩子</button>
              <button type="button" class="seg__item" data-value="边框">边框</button>
              <button type="button" class="seg__item" data-value="口播">口播</button>
              <button type="button" class="seg__item" data-value="贴纸">贴纸</button>
            </div>
            <div class="form-tip" id="upTypeTip">主要用于在原视频的片头或片尾拼接</div>
            <div class="form-item__error">请选择模板类型</div>
          </div>
        </div>

        <div class="form-item" id="upHookPosItem">
          <label class="form-item__label is-required">拼接位置</label>
          <div class="form-item__control">
            <div class="seg" id="upHookPosSeg" role="group" aria-label="拼接位置">
              <button type="button" class="seg__item is-active" data-value="片头">片头</button>
              <button type="button" class="seg__item" data-value="片尾">片尾</button>
            </div>
            <div class="form-item__error">请选择拼接位置</div>
          </div>
        </div>

        <div class="form-item" id="upNameItem">
          <label class="form-item__label is-required">模板名称</label>
          <div class="form-item__control">
            <input class="input" id="upNameInput" type="text" placeholder="请输入" autocomplete="off" />
            <div class="form-item__error">请输入模板名称</div>
          </div>
        </div>

        <div class="form-item" id="upFileItem">
          <label class="form-item__label is-required">上传文件</label>
          <div class="form-item__control">
            <div class="upload-zone" id="upFileZone" tabindex="0" role="button" aria-label="选择文件">
              <input class="upload-zone__input" id="upFileInput" type="file" />
              <div class="upload-zone__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>
              </div>
              <div class="upload-zone__title">点击或拖拽文件到此处</div>
              <div class="upload-zone__desc" id="upFileDesc">支持 mp4 / mov</div>
              <div class="upload-zone__file" id="upFileName" hidden></div>
            </div>
            <div class="form-item__error">请上传文件</div>
          </div>
        </div>

        <div class="form-item">
          <label class="form-item__label">备注</label>
          <div class="form-item__control">
            <input class="input" id="upRemarkInput" type="text" placeholder="选填" autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="uploadModal">取消</button>
        <button class="btn btn--primary" type="button" id="upSubmit">提交</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-mask" id="deleteModal" aria-hidden="true">
    <div class="modal modal--small confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="deleteTitle">删除模板</h2>
        <button class="modal__close" type="button" data-close="deleteModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="confirm-modal__content">
          <span class="confirm-modal__icon confirm-modal__icon--info" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2zm0 14a1.25 1.25 0 1 1 0 2.5A1.25 1.25 0 0 1 12 16zm0-9a1.2 1.2 0 0 1 1.2 1.2v5.1a1.2 1.2 0 1 1-2.4 0v-5.1A1.2 1.2 0 0 1 12 7z"/></svg>
          </span>
          <div class="confirm-modal__text">确定删除该模板？删除后不可恢复。</div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="deleteModal">取消</button>
        <button class="btn btn--primary" type="button" id="deleteOk">确定</button>
      </div>
    </div>
  </div>

  <!-- 预览 -->
  <div class="modal-mask" id="previewModal" aria-hidden="true">
    <div class="modal modal--preview" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="previewTitle">预览</h2>
        <button class="modal__close" type="button" data-close="previewModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="preview-stage" id="previewStage">
          <div class="preview-stage__placeholder" id="previewPlaceholder">暂无预览</div>
        </div>
        <div class="preview-meta" id="previewMeta"></div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="previewModal">关闭</button>
      </div>
    </div>
  </div>

  <script src="product-common.js"></script>
  <script src="material-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script>MaterialShell.mount('template-library');</script>
  <script src="template-library.js"></script>
</body>
</html>
