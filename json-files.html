<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON文件 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="json-files.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar" id="filterBar">
          <div class="filter-item">
            <input class="input" id="filterKeyword" type="text" placeholder="产品名称/ID" autocomplete="off" />
          </div>
          <div class="filter-item">
            <input class="input" id="filterPackage" type="text" placeholder="包名" autocomplete="off" />
          </div>
          <div class="filter-item" id="platformWrap">
            <button class="select-trigger" type="button" id="platformTrigger">
              <span class="select-trigger__text" id="platformLabel">平台：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="platformClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="platformPanel">
              <div class="single-option" data-value="Android">Android</div>
              <div class="single-option" data-value="iOS">iOS</div>
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
            <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
          </div>
        </div>

        <div class="data-panel" id="dataPanel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="jsonTable">
                <colgroup>
                  <col class="col-name" data-col-width="200" />
                  <col class="col-platform" data-col-width="100" />
                  <col class="col-id" data-col-width="160" />
                  <col class="col-package" data-col-width="200" />
                  <col class="col-ver" data-col-width="112" />
                  <col class="col-ver" data-col-width="112" />
                  <col class="col-owner" data-col-width="100" />
                  <col class="col-time" data-col-width="180" />
                  <col class="col-action" data-col-width="120" />
                </colgroup>
                <thead>
                  <tr>
                    <th>产品名称</th>
                    <th>平台</th>
                    <th>产品ID</th>
                    <th>包名</th>
                    <th>SDK版本</th>
                    <th>APP版本</th>
                    <th>创建人</th>
                    <th>创建时间</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-mask" id="viewModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="viewModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="viewModalTitle">查看JSON</div>
        <button class="modal__close" type="button" data-close="viewModal" aria-label="关闭">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l10 10M12 2L2 12"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="code-panel" id="codePanel">
          <div class="code-panel__bar">
            <span class="code-panel__title">代码块</span>
            <button class="code-panel__btn" type="button" id="codeCopyBtn">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1.5"/><path d="M4 10H3.5A1.5 1.5 0 012 8.5v-5A1.5 1.5 0 013.5 2h5A1.5 1.5 0 0110 3.5V4"/></svg>
              复制
            </button>
          </div>
          <div class="code-panel__scroll" id="codeScroll">
            <div class="code-panel__gutter" id="codeGutter" aria-hidden="true"></div>
            <pre class="code-panel__code" id="jsonView"></pre>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="viewModal">关闭</button>
      </div>
    </div>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="menu.js"></script>
  <script src="product-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script src="json-files-data.js"></script>
  <script src="json-files.js"></script>
</body>
</html>
