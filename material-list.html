<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>采集素材 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="material-list.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
        <div class="content-card">
          <div class="filter-bar" id="filterBar">
            <div class="filter-item filter-item--date" id="dateRangeWrap">
              <button class="date-range-trigger" type="button" id="dateRangeTrigger">
                <span class="date-range-trigger__text" id="dateRangeLabel">创建时间：-</span>
              </button>
              <div class="date-panel" id="datePanel">
                <div class="date-panel__shortcuts" id="dateShortcuts">
                  <button class="date-shortcut" type="button" data-shortcut="today">今天</button>
                  <button class="date-shortcut" type="button" data-shortcut="yesterday">昨天</button>
                  <button class="date-shortcut is-active" type="button" data-shortcut="last7">近7天</button>
                  <button class="date-shortcut" type="button" data-shortcut="last30">近30天</button>
                  <button class="date-shortcut" type="button" data-shortcut="thisWeek">本周</button>
                  <button class="date-shortcut" type="button" data-shortcut="lastWeek">上周</button>
                  <button class="date-shortcut" type="button" data-shortcut="thisMonth">本月</button>
                  <button class="date-shortcut" type="button" data-shortcut="lastMonth">上月</button>
                </div>
                <div class="date-panel__calendars">
                  <div class="date-cal" id="dateCalLeft"></div>
                  <div class="date-cal" id="dateCalRight"></div>
                </div>
              </div>
            </div>

            <div class="filter-item" id="creativeWrap">
              <button class="select-trigger" type="button" id="creativeTrigger">
                <span class="select-trigger__text" id="creativeLabel">创意人：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="creativeClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="search-select-panel" id="creativePanel">
                <div class="search-select-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input type="text" id="creativeSearch" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="search-select-panel__list" id="creativeList"></div>
              </div>
            </div>

            <div class="filter-item" id="xmpWrap">
              <button class="select-trigger" type="button" id="xmpTrigger">
                <span class="select-trigger__text" id="xmpLabel">上传XMP：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="xmpClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="single-panel" id="xmpPanel">
                <button class="single-option" type="button" data-value="">全部</button>
                <button class="single-option" type="button" data-value="是">是</button>
                <button class="single-option" type="button" data-value="否">否</button>
              </div>
            </div>

            <div class="filter-item">
              <input class="input" id="filterName" type="text" placeholder="素材名称" autocomplete="off" />
            </div>

            <div class="filter-actions">
              <button class="btn btn--default" type="button" id="resetBtn">重置</button>
              <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
              <div class="batch-wrap" id="batchWrap">
                <button class="btn btn--default btn--dropdown" type="button" id="batchBtn" disabled>
                  批量操作
                  <svg class="btn__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                </button>
                <div class="batch-menu" id="batchMenu" role="menu">
                  <button class="batch-menu__item" type="button" role="menuitem" data-batch="download">批量下载</button>
                  <button class="batch-menu__item" type="button" role="menuitem" data-batch="xmp">上传XMP</button>
                </div>
              </div>
            </div>
          </div>

          <div class="data-panel" id="dataPanel">
            <div class="table-shell">
              <div class="table-wrap">
                <table class="data-table" id="materialTable">
                  <colgroup>
                    <col class="col-check" />
                    <col data-col-width="88" />
                    <col data-col-width="280" />
                    <col data-col-width="88" />
                    <col data-col-width="88" />
                    <col data-col-width="112" />
                    <col data-col-width="100" />
                    <col data-col-width="112" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                    <col data-col-width="88" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th class="col-check"><span class="cell-check"><input type="checkbox" id="checkAll" aria-label="全选" /></span></th>
                      <th>ID</th>
                      <th>素材</th>
                      <th>类型</th>
                      <th>格式</th>
                      <th>尺寸</th>
                      <th>时长 (秒)</th>
                      <th>创意人</th>
                      <th>上传XMP</th>
                      <th>
                        <span class="th-sort" id="createdSort" data-key="createdAt">
                          创建时间
                          <span class="th-sort__icons">
                            <button type="button" class="th-sort__dir asc" data-sort-dir="asc" aria-label="升序"><svg viewBox="0 0 10 8" aria-hidden="true"><path d="M5 1L9 7H1Z" fill="currentColor"/></svg></button>
                            <button type="button" class="th-sort__dir desc" data-sort-dir="desc" aria-label="降序"><svg viewBox="0 0 10 8" aria-hidden="true"><path d="M5 7L1 1h8Z" fill="currentColor"/></svg></button>
                          </span>
                        </span>
                      </th>
                      <th class="col-action">操作</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
  </div>

  <div class="preview-pop" id="previewPop" aria-hidden="true">
    <div class="preview-pop__media" id="previewMedia">视频预览</div>
  </div>

  <!-- 批量上传 XMP -->
  <div class="modal-mask modal-mask--dropdown" id="xmpModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="xmpModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="xmpModalTitle">批量上传 XMP</div>
        <button class="modal__close" type="button" data-close="xmpModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <label class="form-item__label">过滤重复素材</label>
          <div class="form-item__control">
            <button class="switch is-on" type="button" id="batchDupSwitch" aria-label="过滤重复素材" aria-pressed="true"></button>
          </div>
        </div>
        <div class="xmp-block" id="batchXmpBlock">
          <div class="form-item">
            <label class="form-item__label">存储位置</label>
            <div class="form-item__control">
              <div class="seg" id="batchFolderSeg" role="group" aria-label="存储位置">
                <button type="button" class="seg__item is-active" data-value="已有文件夹">已有文件夹</button>
                <button type="button" class="seg__item" data-value="创建文件夹">创建文件夹</button>
              </div>
            </div>
          </div>
          <div class="form-item folder-existing" id="batchTargetItem">
            <label class="form-item__label is-required">目标文件夹</label>
            <div class="form-item__control" id="batchTargetWrap">
              <button class="select-trigger" type="button" id="batchTargetTrigger">
                <span class="select-trigger__text" id="batchTargetLabel"><span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="batchTargetClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="search-select-panel" id="batchTargetPanel">
                <div class="search-select-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input type="text" id="batchTargetSearch" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="search-select-panel__list" id="batchTargetList"></div>
              </div>
              <div class="form-item__error">请选择目标文件夹</div>
            </div>
          </div>
          <div class="folder-create is-hidden" id="batchCreateBlock">
            <div class="form-item">
              <label class="form-item__label">父级文件夹</label>
              <div class="form-item__control" id="batchParentWrap">
                <button class="select-trigger" type="button" id="batchParentTrigger">
                  <span class="select-trigger__text" id="batchParentLabel"><span class="muted">请选择</span></span>
                  <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                </button>
                <button class="select-clear" type="button" id="batchParentClear" aria-label="清除">
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                </button>
                <div class="search-select-panel" id="batchParentPanel">
                  <div class="search-select-panel__search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                    <input type="text" id="batchParentSearch" placeholder="搜索" autocomplete="off" />
                  </div>
                  <div class="search-select-panel__list" id="batchParentList"></div>
                </div>
              </div>
            </div>
            <div class="form-item" id="batchFolderNameItem">
              <label class="form-item__label is-required">文件夹名称</label>
              <div class="form-item__control">
                <input class="input" id="batchFolderNameInput" type="text" value="{创意人}_{YYYYMMDD}" autocomplete="off" />
                <div class="meta-tags" data-target="batchFolderNameInput">
                  <button class="meta-tag" type="button" data-token="_" data-repeat="1">下划线</button>
                  <button class="meta-tag" type="button" data-token="{编号}">编号</button>
                  <button class="meta-tag" type="button" data-token="{创意人}">创意人</button>
                  <button class="meta-tag" type="button" data-token="{YYYYMMDD}">YYYYMMDD</button>
                </div>
                <div class="form-item__error">请输入文件夹名称</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="xmpModal">取消</button>
        <button class="btn btn--primary" type="button" id="xmpSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="material-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script>MaterialShell.mount('material-list');</script>
  <script src="material-list.js"></script>
</body>
</html>
