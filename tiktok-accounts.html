<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiktok账户 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="tiktok-accounts.css" />
  <link rel="stylesheet" href="col-resize.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
        <div class="content-card">
          <div class="filter-bar">
            <div class="filter-item">
              <input class="input" id="accountKeyword" type="text" placeholder="账户名称/ID" autocomplete="off" />
            </div>
            <div class="filter-item" id="optimizerWrap">
              <button class="select-trigger" type="button" id="optimizerTrigger">
                <span class="select-trigger__text" id="optimizerLabel">优化师：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <div class="multi-panel" id="optimizerPanel">
                <div class="multi-panel__left">
                  <div class="multi-panel__search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                    <input type="text" id="optimizerSearch" placeholder="搜索" autocomplete="off" />
                  </div>
                  <div class="multi-panel__toolbar">
                    <button class="multi-panel__link" type="button" id="optimizerSelectAll">全选</button>
                  </div>
                  <div class="multi-panel__list" id="optimizerList"></div>
                </div>
                <div class="multi-panel__right">
                  <div class="multi-panel__toolbar multi-panel__toolbar--right">
                    <span id="optimizerCount">已选择 0 项</span>
                    <button class="multi-panel__link" type="button" id="optimizerClear">清空</button>
                  </div>
                  <div class="multi-panel__list" id="optimizerSelected"></div>
                </div>
              </div>
            </div>
            <div class="filter-item" id="statusWrap">
              <button class="select-trigger" type="button" id="statusTrigger">
                <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <div class="single-panel" id="statusPanel">
                <div class="single-option is-active" data-value="">全部</div>
                <div class="single-option" data-value="启用">启用</div>
                <div class="single-option" data-value="禁用">禁用</div>
              </div>
            </div>
            <div class="filter-actions">
              <button class="btn btn--primary" type="button" id="searchBtn">查询</button>
              <button class="btn btn--success" type="button" id="importBtn">导入</button>
              <div class="batch-wrap" id="batchWrap">
                <button class="btn btn--default btn--dropdown" type="button" id="batchBtn" disabled>
                  批量操作
                  <svg class="btn__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                </button>
                <div class="batch-menu" id="batchMenu" role="menu">
                  <button class="batch-menu__item" type="button" role="menuitem" data-batch="product">修改产品</button>
                  <button class="batch-menu__item" type="button" role="menuitem" data-batch="optimizer">修改优化师</button>
                  <button class="batch-menu__item" type="button" role="menuitem" data-batch="status">修改状态</button>
                </div>
              </div>
              <button class="btn btn--default" type="button" id="exportBtn">导出</button>
            </div>
          </div>

          <div class="data-panel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="accountTable">
                <colgroup>
                  <col class="col-check" />
                  <col class="col-name" />
                  <col class="col-id" />
                  <col class="col-product" />
                  <col class="col-appid" />
                  <col class="col-optimizer" />
                  <col class="col-status" />
                  <col class="col-action" />
                </colgroup>
                <thead>
                  <tr>
                    <th class="col-check"><span class="cell-check"><input type="checkbox" id="checkAll" aria-label="全选" /></span></th>
                    <th class="col-name">账户名称</th>
                    <th class="col-id">账户ID</th>
                    <th class="col-product">产品名称</th>
                    <th class="col-appid">APPID</th>
                    <th class="col-optimizer">优化师</th>
                    <th class="col-status">状态</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="accountBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>

          <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
  </div>

  <div class="page-msg page-msg--success" id="pageMsg" role="status" aria-live="polite"></div>

  <!-- 导入弹窗 -->
  <div class="modal-mask" id="importModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="importTitle">导入</h2>
        <button class="modal__close" type="button" id="importClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="import-actions">
          <button class="btn btn--primary" type="button" id="uploadBtn">上传文件</button>
          <button class="link" type="button" id="downloadTemplateBtn">下载模板</button>
          <input type="file" id="importFile" accept=".csv,.xls,text/csv,application/vnd.ms-excel" hidden />
        </div>
        <div class="import-alert" id="importAlert" role="alert">
          <svg class="import-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>
          </svg>
          <span id="importAlertText"></span>
        </div>
        <div class="import-table-shell">
          <div class="import-table-wrap">
            <table class="import-table" id="importTable">
              <thead>
                <tr>
                  <th style="width:28%">账户ID</th>
                  <th style="width:28%">产品名称</th>
                  <th style="width:16%">优化师</th>
                  <th class="col-error">错误信息</th>
                </tr>
              </thead>
              <tbody id="importBody"></tbody>
            </table>
          </div>
          <div class="import-empty" id="importEmpty">暂无数据</div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="importCancel">取消</button>
        <button class="btn btn--primary" type="button" id="importConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 编辑 TikTok 账户 -->
  <div class="modal-mask" id="editModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="editTitle">编辑TikTok账户</h2>
        <button class="modal__close" type="button" id="editClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label">账户名称</div>
          <div class="form-item__control">
            <input class="input" type="text" id="editAccountName" disabled />
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">账户ID</div>
          <div class="form-item__control">
            <input class="input" type="text" id="editAccountId" disabled />
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">优化师</div>
          <div class="form-item__control" id="editOptimizerWrap">
            <button class="select-trigger" type="button" id="editOptimizerTrigger">
              <span class="select-trigger__text" id="editOptimizerLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button type="button" class="select-clear" id="editOptimizerClear" aria-label="清除" tabindex="-1">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel single-panel--search" id="editOptimizerPanel">
              <div class="single-panel__search">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
                <input type="text" id="editOptimizerSearch" placeholder="搜索优化师" autocomplete="off" />
              </div>
              <div class="single-panel__list" id="editOptimizerList"></div>
            </div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">产品名称</div>
          <div class="form-item__control" id="editProductWrap">
            <button class="select-trigger" type="button" id="editProductTrigger">
              <span class="select-trigger__text" id="editProductLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button type="button" class="select-clear" id="editProductClear" aria-label="清除" tabindex="-1">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel single-panel--search" id="editProductPanel">
              <div class="single-panel__search">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
                <input type="text" id="editProductSearch" placeholder="搜索产品" autocomplete="off" />
              </div>
              <div class="single-panel__list" id="editProductList"></div>
            </div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">状态</div>
          <div class="form-item__control">
            <div class="seg" id="editStatusSeg" role="group" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="editCancel">取消</button>
        <button class="btn btn--primary" type="button" id="editSave">提交</button>
      </div>
    </div>
  </div>

  <!-- 批量修改产品 -->
  <div class="modal-mask" id="batchProductModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="batchProductTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="batchProductTitle">修改产品</h2>
        <button class="modal__close" type="button" id="batchProductClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label">产品名称</div>
          <div class="form-item__control" id="batchProductWrap">
            <button class="select-trigger" type="button" id="batchProductTrigger">
              <span class="select-trigger__text" id="batchProductLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button type="button" class="select-clear" id="batchProductClear" aria-label="清除" tabindex="-1">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel single-panel--search" id="batchProductPanel">
              <div class="single-panel__search">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
                <input type="text" id="batchProductSearch" placeholder="搜索产品" autocomplete="off" />
              </div>
              <div class="single-panel__list" id="batchProductList"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="batchProductCancel">取消</button>

  <!-- 批量修改优化师 -->
  <div class="modal-mask" id="batchOptimizerModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="batchOptimizerTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="batchOptimizerTitle">修改优化师</h2>
        <button class="modal__close" type="button" id="batchOptimizerClose" aria-label="关闭">

      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label">优化师</div>
          <div class="form-item__control" id="batchOptimizerWrap">
            <button class="select-trigger" type="button" id="batchOptimizerTrigger">
              <span class="select-trigger__text" id="batchOptimizerLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button type="button" class="select-clear" id="batchOptimizerClear" aria-label="清除" tabindex="-1">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel single-panel--search" id="batchOptimizerPanel">
              <div class="single-panel__search">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
                <input type="text" id="batchOptimizerSearch" placeholder="搜索优化师" autocomplete="off" />
              </div>
              <div class="single-panel__list" id="batchOptimizerList"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="batchOptimizerCancel">取消</button>
        <button class="btn btn--primary" type="button" id="batchOptimizerSave">提交</button>
      </div>
    </div>
  </div>

  <!-- 批量修改状态 -->
  <div class="modal-mask" id="batchStatusModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="batchStatusTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="batchStatusTitle">修改状态</h2>
        <button class="modal__close" type="button" id="batchStatusClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label">状态</div>
          <div class="form-item__control">
            <div class="seg" id="batchStatusSeg" role="group" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="batchStatusCancel">取消</button>
        <button class="btn btn--primary" type="button" id="batchStatusSave">提交</button>
      </div>
    </div>
  </div>

  <script src="product-common.js"></script>
  <script src="product-sidebar.js"></script>
  <script>
    (function () {
      ProductShell.mount('tiktok-accounts');

      const UI = window.ProductUI;
      const escapeHtml = UI.escapeHtml;
      const showPageMsg = UI.showToast;
      const copyText = UI.copyText;
      const closePanels = UI.closePanels;
      let optimizerMulti = null;
      let batchMenuApi = null;

      const PRODUCTS = [
        'Color Water Sort Master',
        'Tile Match Journey',
        'Wonder Puzzle',
        'Star Merge',
        'Ocean Match',
        'Pixel Farm'
      ];
      const PLATFORM_ICONS = {
        TikTok: 'assets/TikTok.png',
        Android: 'assets/Android.png',
        iOS: 'assets/iOS.png'
      };
      const PRODUCT_PLATFORM_ICON = PLATFORM_ICONS.TikTok;
      const OPTIMIZERS = Array.from({ length: 12 }, function (_, i) {
        return '用户' + String.fromCharCode(65 + i);
      });
      const ACCOUNT_PREFIXES = ['CWSM_TT_BV', 'TMJ_TT_US', 'WP_TT_EU', 'SM_TT_SEA', 'OM_TT_NA', 'PF_TT_JP'];
      const COPY_ICON = UI.COPY_ICON;

      let allRows = [];
      let filteredRows = [];
      let page = 1;
      let pageSize = 50;
      let selectedIds = new Set();
      let selectedOptimizers = [];
      let filterStatus = '';
      let importRows = [];
      let editingId = null;
      let editOptimizer = '';
      let editProduct = '';
      let editStatus = '启用';
      let batchProduct = '';
      let batchOptimizer = '';
      let batchStatus = '启用';
      const FORM_MODAL_IDS = ['editModal', 'batchProductModal', 'batchOptimizerModal', 'batchStatusModal'];

      function padId(n, len) {
        const base = String(7000000000000000000n + BigInt(n));
        return base.slice(0, len || 19);
      }

      function buildData() {
        const rows = [];
        for (let i = 0; i < 58; i++) {
          const product = PRODUCTS[i % PRODUCTS.length];
          const prefix = ACCOUNT_PREFIXES[i % ACCOUNT_PREFIXES.length];
          rows.push({
            id: 'acc_' + (i + 1),
            accountName: prefix + '_minigame_' + String(i + 1).padStart(3, '0'),
            accountId: padId(i * 137 + 8295792517141, 19),
            productName: product,
            appId: padId(i * 211 + 5955854953662482, 19),
            optimizer: OPTIMIZERS[i % OPTIMIZERS.length],
            status: i % 11 === 0 ? '禁用' : '启用'
          });
        }
        return rows;
      }

      function applyFilter() {
        const kw = document.getElementById('accountKeyword').value.trim().toLowerCase();
        filteredRows = allRows.filter(function (row) {
          if (kw) {
            const nameHit = row.accountName.toLowerCase().indexOf(kw) !== -1;
            const idHit = row.accountId.toLowerCase().indexOf(kw) !== -1;
            if (!nameHit && !idHit) return false;
          }
          if (selectedOptimizers.length && selectedOptimizers.indexOf(row.optimizer) === -1) return false;
          if (filterStatus && row.status !== filterStatus) return false;
          return true;
        });
        page = 1;
        selectedIds.clear();
        closeBatchMenu();
        renderTable();
        renderPagination();
        syncBatchBtn();
      }

      function syncBatchBtn() {
        if (batchMenuApi) batchMenuApi.setDisabled(selectedIds.size === 0);
        else document.getElementById('batchBtn').disabled = selectedIds.size === 0;
      }

      function closeBatchMenu() {
        if (batchMenuApi) batchMenuApi.close();
      }

      function renderTable() {
        const body = document.getElementById('accountBody');
        const empty = document.getElementById('emptyTip');
        const start = (page - 1) * pageSize;
        const pageRows = filteredRows.slice(start, start + pageSize);

        if (!filteredRows.length) {
          body.innerHTML = '';
          empty.hidden = false;
          document.getElementById('checkAll').checked = false;
          document.getElementById('checkAll').indeterminate = false;
          return;
        }

        empty.hidden = true;
        body.innerHTML = pageRows.map(function (row) {
          const checked = selectedIds.has(row.id);
          return '<tr>' +
            '<td class="col-check"><span class="cell-check"><input type="checkbox" data-check="' + escapeHtml(row.id) + '"' + (checked ? ' checked' : '') + ' aria-label="选择" /></span></td>' +
            '<td class="col-name" title="' + escapeHtml(row.accountName) + '">' + escapeHtml(row.accountName) + '</td>' +
            '<td class="col-id">' +
              '<span class="cell-id">' +
                '<button class="copy-btn" type="button" data-copy="' + escapeHtml(row.accountId) + '" title="复制账户ID">' + COPY_ICON + '</button>' +
                '<span class="cell-id__text" title="' + escapeHtml(row.accountId) + '">' + escapeHtml(row.accountId) + '</span>' +
              '</span>' +
            '</td>' +
            '<td class="col-product" title="' + escapeHtml(row.productName) + '">' + escapeHtml(row.productName) + '</td>' +
            '<td class="col-appid" title="' + escapeHtml(row.appId) + '">' + escapeHtml(row.appId) + '</td>' +
            '<td class="col-optimizer">' + escapeHtml(row.optimizer) + '</td>' +
            '<td class="col-status">' + UI.statusTag(row.status) + '</td>' +
            '<td class="col-action"><button class="link" type="button" data-edit="' + escapeHtml(row.id) + '">编辑</button></td>' +
            '</tr>';
        }).join('');

        const pageIds = pageRows.map(function (r) { return r.id; });
        const checkedCount = pageIds.filter(function (id) { return selectedIds.has(id); }).length;
        const checkAll = document.getElementById('checkAll');
        checkAll.checked = pageIds.length > 0 && checkedCount === pageIds.length;
        checkAll.indeterminate = checkedCount > 0 && checkedCount < pageIds.length;
      }

      function renderPagination() {
        UI.renderPagination({
          containerId: 'pagination',
          total: filteredRows.length,
          page: page,
          pageSize: pageSize
        });
      }

      /* —— 导入 —— */
      function openImportModal() {
        importRows = [];
        hideImportAlert();
        renderImportTable();
        document.getElementById('importFile').value = '';
        UI.openModal('importModal');
      }

      function closeImportModal() {
        UI.closeModal('importModal');
      }

      function showImportAlert(text) {
        const alert = document.getElementById('importAlert');
        document.getElementById('importAlertText').textContent = text;
        alert.classList.add('is-show');
      }

      function hideImportAlert() {
        document.getElementById('importAlert').classList.remove('is-show');

      function normalizeAccountId(raw) {
        let v = String(raw == null ? '' : raw).trim();
        if (!v) return '';
        // Excel 文本前缀 / 公式写法：'123 或 ="123" 或 =123
        if (v.charAt(0) === "'") v = v.slice(1).trim();
        const formulaMatch = v.match(/^=\s*"([^"]*)"\s*$/) || v.match(/^=\s*(.+)$/);
        if (formulaMatch) v = String(formulaMatch[1]).trim();
        v = v.replace(/^\t+/, '').replace(/\s+/g, '');
        // 科学计数法：精度已丢失，无法可靠还原
        if (/e\+/i.test(v) || /e-/i.test(v)) return v;
        return v;
      }

      function parseCsvLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuotes) {
            if (ch === '"') {
              if (line[i + 1] === '"') {
                cur += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              cur += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',' || ch === '\t') {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        result.push(cur.trim());
        return result;
      }

      function normalizeHeader(h) {
        return String(h || '')
          .replace(/^\uFEFF/, '')
          .trim()
          .toLowerCase()
          .replace(/\s+/g, '');
      }

      function mapHeaderIndex(headers) {
        const map = { accountId: -1, productName: -1, optimizer: -1 };
        headers.forEach(function (h, i) {
          const key = normalizeHeader(h);
          if (key === '账户id' || key === 'accountid' || key === 'account_id') map.accountId = i;
          else if (key === '产品名称' || key === 'productname' || key === 'product_name' || key === '产品名') map.productName = i;
          else if (key === '优化师' || key === 'optimizer') map.optimizer = i;
        });
        return map;
      }

      function validateImportRow(row, index, idSet) {
        const errors = [];
        if (!row.accountId) {
          errors.push('账户ID不能为空');
        } else if (/e[+-]/i.test(row.accountId)) {
          errors.push('账户ID疑似被 Excel 转为科学计数法，请将账户ID列设为文本后重填');
        } else if (!/^\d{5,}$/.test(row.accountId)) {
          errors.push('账户ID格式不正确');
        } else if (idSet.has(row.accountId)) {
          errors.push('账户ID在文件中重复');
        } else if (!allRows.some(function (r) { return r.accountId === row.accountId; })) {
          errors.push('不存在账户ID');
        }
        if (row.accountId) idSet.add(row.accountId);
        void index;
        return errors.join('；');
      }

      function buildImportRows(headers, dataLines, splitLine) {
        const col = mapHeaderIndex(headers);
        if (col.accountId < 0 || col.productName < 0 || col.optimizer < 0) {
          return { error: '表头不正确，需包含：账户ID、产品名称、优化师' };
        }
        const idSet = new Set();
        const rows = [];
        for (let i = 0; i < dataLines.length; i++) {
          const cols = splitLine(dataLines[i]);
          const row = {
            accountId: normalizeAccountId(cols[col.accountId]),
            productName: String(cols[col.productName] == null ? '' : cols[col.productName]).trim(),
            optimizer: String(cols[col.optimizer] == null ? '' : cols[col.optimizer]).trim(),
            error: ''
          };
          row.error = validateImportRow(row, i + 2, idSet);
          rows.push(row);
        }
        if (!rows.length) {
          return { error: '未解析到有效数据行，请检查文件内容' };
        }
        return { rows: rows };
      }

      function parseImportHtml(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const table = doc.querySelector('table');
        if (!table) {
          return { error: '无法解析模板表格，请使用下载的导入模板' };
        }
        const trs = Array.prototype.slice.call(table.querySelectorAll('tr'));
        if (!trs.length) {
          return { error: '文件内容为空，请使用下载的模板填写后重新上传' };
        }
        const headers = Array.prototype.map.call(trs[0].querySelectorAll('td,th'), function (cell) {
          return (cell.textContent || '').trim();
        });
        const dataLines = trs.slice(1).map(function (tr) {
          return Array.prototype.map.call(tr.querySelectorAll('td,th'), function (cell) {
            return (cell.textContent || '').trim();
          });
        }).filter(function (cols) {
          return cols.some(function (c) { return String(c).trim() !== ''; });
        });
        return buildImportRows(headers, dataLines, function (cols) { return cols; });
      }

      function parseImportSpreadsheetML(xmlText) {
        const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
          return { error: '无法解析模板表格，请使用下载的导入模板' };
        }
        const rows = Array.prototype.slice.call(doc.getElementsByTagName('Row'));
        if (!rows.length) {
          return { error: '文件内容为空，请使用下载的模板填写后重新上传' };
        }

        function cellIndex(cell, fallback) {
          const raw =
            cell.getAttribute('ss:Index') ||
            cell.getAttribute('Index') ||
            (cell.getAttributeNS && cell.getAttributeNS('urn:schemas-microsoft-com:office:spreadsheet', 'Index'));
          const n = Number(raw);
          return n > 0 ? n : fallback;
        }

        function rowCells(row) {
          const cells = Array.prototype.slice.call(row.getElementsByTagName('Cell'));
          const cols = [];
          let nextIndex = 1;
          cells.forEach(function (cell) {
            const idx = cellIndex(cell, nextIndex);
            while (nextIndex < idx) {
              cols.push('');
              nextIndex += 1;
            }
            const data = cell.getElementsByTagName('Data')[0];
            cols.push(data ? String(data.textContent || '').trim() : '');
            nextIndex += 1;
          });
          return cols;
        }

        const headers = rowCells(rows[0]);
        const dataLines = rows.slice(1).map(rowCells).filter(function (cols) {
          return cols.some(function (c) { return String(c).trim() !== ''; });
        });
        return buildImportRows(headers, dataLines, function (cols) { return cols; });
      }

      function parseImportText(text) {
        const raw = String(text || '');
        if (
          /<Workbook[\s>]/i.test(raw) ||
          /urn:schemas-microsoft-com:office:spreadsheet/i.test(raw) ||
          /ss:Workbook/i.test(raw)
        ) {
          return parseImportSpreadsheetML(raw);
        }
        if (/<html[\s>]/i.test(raw) || /<table[\s>]/i.test(raw)) {
          return parseImportHtml(raw);
        }

        const lines = raw
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n')
          .split('\n')
          .filter(function (line) { return line.trim() !== ''; });

        if (!lines.length) {
          return { error: '文件内容为空，请使用下载的模板填写后重新上传' };
        }

        const headers = parseCsvLine(lines[0]);
        return buildImportRows(headers, lines.slice(1), parseCsvLine);
      }

      function handleImportFile(file) {
        hideImportAlert();
        if (!file) return;

        const name = (file.name || '').toLowerCase();
        if (name.endsWith('.xlsx')) {
          importRows = [];
          renderImportTable();
          showImportAlert('暂不支持 .xlsx，请下载模板（.xls）填写后上传，或另存为 CSV');
          showPageMsg('导入失败：请上传 .xls 或 .csv 文件', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          const result = parseImportText(e.target.result);
          if (result.error) {
            importRows = [];
            renderImportTable();
            showImportAlert(result.error);
            showPageMsg('导入失败：' + result.error, 'error');
            return;
          }
          importRows = result.rows;
          renderImportTable();
          const errCount = importRows.filter(function (r) { return r.error; }).length;
          if (errCount) {
            showImportAlert('共 ' + importRows.length + ' 行，其中 ' + errCount + ' 行校验失败；确认提交后将默认移除失败数据');
            showPageMsg('有 ' + errCount + ' 行校验失败，确认后将自动移除', 'error');
          } else {
            hideImportAlert();
            showPageMsg('文件解析成功，共 ' + importRows.length + ' 行');
          }
        };
        reader.onerror = function () {
          importRows = [];
          renderImportTable();
          showImportAlert('文件读取失败，请重试');
          showPageMsg('导入失败：文件读取失败', 'error');
        };
        reader.readAsText(file, 'UTF-8');
      }

      function confirmImport() {
        if (!importRows.length) {
          showImportAlert('请先上传文件');
          showPageMsg('请先上传导入文件', 'error');
          return;
        }

        const validRows = importRows.filter(function (r) { return !r.error; });
        const removedCount = importRows.length - validRows.length;

        if (!validRows.length) {
          showImportAlert('全部数据校验失败，已无可提交内容');
          showPageMsg('导入失败：没有可提交的有效数据', 'error');
          return;
        }

        let updated = 0;
        validRows.forEach(function (row) {
          const existing = allRows.find(function (r) { return r.accountId === row.accountId; });
          if (!existing) return;
          let changed = false;
          if (row.productName) {
            existing.productName = row.productName;
            changed = true;
          }
          if (row.optimizer) {
            existing.optimizer = row.optimizer;
            changed = true;
            if (OPTIMIZERS.indexOf(row.optimizer) === -1) {
              OPTIMIZERS.push(row.optimizer);
            }
          }
          if (changed) updated++;
        });
        if (optimizerMulti) optimizerMulti.render();

        closeImportModal();
        applyFilter();
        if (removedCount) {
          showPageMsg('导入成功：已更新 ' + updated + ' 条，已移除失败数据 ' + removedCount + ' 条');
        } else {
          showPageMsg('导入成功：已更新 ' + updated + ' 条账户归属');
        }
      }

            })
            .join(',');
        });
        const blob = new Blob([bom + header + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

          if (document.getElementById(cfg.panelId).classList.contains('is-open')) {
            renderSearchList(cfg.listId, cfg.getOptions(), cfg.getValue(), '', cfg.iconSrc);
          }
        });
        document.getElementById(cfg.wrapId).addEventListener('click', function (e) {
          e.stopPropagation();
        });
        document.getElementById(cfg.searchId).addEventListener('input', function (e) {
          renderSearchList(cfg.listId, cfg.getOptions(), cfg.getValue(), e.target.value, cfg.iconSrc);
        });
        document.getElementById(cfg.listId).addEventListener('click', function (e) {
          const opt = e.target.closest('.single-option');

          const value = opt.getAttribute('data-value') || '';
          cfg.setValue(value);
          setSelectLabel(cfg.labelId, value, cfg.wrapId, cfg.iconSrc);
          renderSearchList(cfg.listId, cfg.getOptions(), value, document.getElementById(cfg.searchId).value, cfg.iconSrc);
          closePanels();
        });
        if (cfg.clearId) {
          document.getElementById(cfg.clearId).addEventListener('click', function (e) {
            e.stopPropagation();
            cfg.setValue('');
            setSelectLabel(cfg.labelId, '', cfg.wrapId, cfg.iconSrc);
            renderSearchList(cfg.listId, cfg.getOptions(), '', document.getElementById(cfg.searchId).value, cfg.iconSrc);
            closePanels();
          });
        }
      }

      function bindEvents() {

        optimizerMulti = UI.bindMultiSelect({
          wrapId: 'optimizerWrap',
          triggerId: 'optimizerTrigger',
          panelId: 'optimizerPanel',
          listId: 'optimizerList',
          selectedId: 'optimizerSelected',
          countId: 'optimizerCount',
          labelId: 'optimizerLabel',
          searchId: 'optimizerSearch',
          selectAllId: 'optimizerSelectAll',
          clearId: 'optimizerClear',
          prefix: '优化师：',
          getOptions: function () { return OPTIMIZERS; },
          getSelected: function () { return selectedOptimizers; },
          setSelected: function (v) { selectedOptimizers = v; }
        });

        UI.bindSingleSelect({
          wrapId: 'statusWrap',
          triggerId: 'statusTrigger',
          panelId: 'statusPanel',
          labelId: 'statusLabel',
          prefix: '状态：',
          getValue: function () { return filterStatus; },
          onChange: function (v) { filterStatus = v || ''; }
        });

        UI.bindPagination({
          containerId: 'pagination',
          getTotal: function () { return filteredRows.length; },
          getPage: function () { return page; },
          getPageSize: function () { return pageSize; },
          onPageChange: function (p) {
            page = p;
            renderTable();
            renderPagination();
          },
          onPageSizeChange: function (size) {
            pageSize = size;
            page = 1;
            renderTable();
            renderPagination();
          }
        });

        batchMenuApi = UI.bindBatchMenu({
          wrapId: 'batchWrap',
          btnId: 'batchBtn',
          menuId: 'batchMenu',
          onAction: function (action) {
            if (!selectedIds.size) {
              showPageMsg('请先选择账户', 'error');
              return;
            }
            if (action === 'product') openBatchProductModal();
            else if (action === 'optimizer') openBatchOptimizerModal();
            else if (action === 'status') openBatchStatusModal();
          }
        });
        syncBatchBtn();

        document.getElementById('searchBtn').addEventListener('click', applyFilter);
        document.getElementById('accountKeyword').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') applyFilter();
        });

        document.getElementById('exportBtn').addEventListener('click', exportCsv);

        bindSearchSelect({
          wrapId: 'editOptimizerWrap',
          triggerId: 'editOptimizerTrigger',
          panelId: 'editOptimizerPanel',
          searchId: 'editOptimizerSearch',
          listId: 'editOptimizerList',
          labelId: 'editOptimizerLabel',
          clearId: 'editOptimizerClear',
          getOptions: function () { return OPTIMIZERS; },
          getValue: function () { return editOptimizer; },
          setValue: function (v) { editOptimizer = v; }
        });
        bindSearchSelect({
          wrapId: 'editProductWrap',
          triggerId: 'editProductTrigger',
          panelId: 'editProductPanel',
          searchId: 'editProductSearch',
          listId: 'editProductList',
          labelId: 'editProductLabel',
          clearId: 'editProductClear',
          iconSrc: PRODUCT_PLATFORM_ICON,
          getOptions: function () { return PRODUCTS; },
          getValue: function () { return editProduct; },
          setValue: function (v) { editProduct = v; }
        });
        bindSearchSelect({
          wrapId: 'batchProductWrap',
          triggerId: 'batchProductTrigger',
          panelId: 'batchProductPanel',
          searchId: 'batchProductSearch',
          listId: 'batchProductList',
          labelId: 'batchProductLabel',
          clearId: 'batchProductClear',
          iconSrc: PRODUCT_PLATFORM_ICON,
          getOptions: function () { return PRODUCTS; },
          getValue: function () { return batchProduct; },
          setValue: function (v) { batchProduct = v; }
        });
        bindSearchSelect({
          wrapId: 'batchOptimizerWrap',
          triggerId: 'batchOptimizerTrigger',
          panelId: 'batchOptimizerPanel',
          searchId: 'batchOptimizerSearch',
          listId: 'batchOptimizerList',
          labelId: 'batchOptimizerLabel',
          clearId: 'batchOptimizerClear',
          getOptions: function () { return OPTIMIZERS; },
          getValue: function () { return batchOptimizer; },
          setValue: function (v) { batchOptimizer = v; }
        });
        UI.bindSeg('editStatusSeg', function (v) { editStatus = v; });
        UI.bindSeg('batchStatusSeg', function (v) { batchStatus = v; });

        document.getElementById('editClose').addEventListener('click', function () { closeFormModal('editModal'); editingId = null; });
        document.getElementById('editCancel').addEventListener('click', function () { closeFormModal('editModal'); editingId = null; });
        document.getElementById('editSave').addEventListener('click', saveEditModal);

        document.getElementById('batchProductClose').addEventListener('click', function () { closeFormModal('batchProductModal'); });
        document.getElementById('batchProductCancel').addEventListener('click', function () { closeFormModal('batchProductModal'); });
        document.getElementById('batchProductSave').addEventListener('click', saveBatchProduct);

        document.getElementById('batchOptimizerClose').addEventListener('click', function () { closeFormModal('batchOptimizerModal'); });
        document.getElementById('batchOptimizerCancel').addEventListener('click', function () { closeFormModal('batchOptimizerModal'); });
        document.getElementById('batchOptimizerSave').addEventListener('click', saveBatchOptimizer);

        document.getElementById('batchStatusClose').addEventListener('click', function () { closeFormModal('batchStatusModal'); });
        document.getElementById('batchStatusCancel').addEventListener('click', function () { closeFormModal('batchStatusModal'); });
        document.getElementById('batchStatusSave').addEventListener('click', saveBatchStatus);

        document.getElementById('importBtn').addEventListener('click', openImportModal);
        document.getElementById('importClose').addEventListener('click', closeImportModal);
        document.getElementById('importCancel').addEventListener('click', closeImportModal);
        document.getElementById('importConfirm').addEventListener('click', confirmImport);
        document.getElementById('downloadTemplateBtn').addEventListener('click', downloadTemplate);
        document.getElementById('uploadBtn').addEventListener('click', function () {
          document.getElementById('importFile').click();
        });
        document.getElementById('importFile').addEventListener('change', function (e) {
          const file = e.target.files && e.target.files[0];
          handleImportFile(file);
        });

        document.getElementById('checkAll').addEventListener('change', function () {
          const checked = this.checked;
          const start = (page - 1) * pageSize;
          const pageRows = filteredRows.slice(start, start + pageSize);
          pageRows.forEach(function (row) {
            if (checked) selectedIds.add(row.id);
            else selectedIds.delete(row.id);
          });
          renderTable();
          syncBatchBtn();
        });

        document.getElementById('accountBody').addEventListener('change', function (e) {
          const input = e.target.closest('[data-check]');
          if (!input) return;
          const id = input.getAttribute('data-check');
          if (input.checked) selectedIds.add(id);
          else selectedIds.delete(id);
          renderTable();
          syncBatchBtn();
        });

        document.getElementById('accountBody').addEventListener('click', function (e) {
          const copyBtn = e.target.closest('[data-copy]');
          if (copyBtn) {
            copyText(copyBtn.getAttribute('data-copy') || '');
            return;
          }
          const edit = e.target.closest('[data-edit]');
          if (edit) openEditModal(edit.getAttribute('data-edit'));
        });

        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          if (document.getElementById('importModal').classList.contains('is-open')) {
            closeImportModal();
            return;
          }
          for (let i = 0; i < FORM_MODAL_IDS.length; i++) {
            const id = FORM_MODAL_IDS[i];
            if (document.getElementById(id).classList.contains('is-open')) {
              closeFormModal(id);
              if (id === 'editModal') editingId = null;
              return;
            }
          }
        });
      }

      allRows = buildData();
      filteredRows = allRows.slice();
      renderTable();
      renderPagination();
      bindEvents();
    })();
  </script>
  <script src="col-resize.js"></script>
</body>
</html>
