<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>短剧 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="tt-dramas.css?v=5" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar" id="filterBar">
          <div class="filter-item" id="filterTitleWrap">
            <input class="input" id="filterTitle" type="text" placeholder="剧目名称" autocomplete="off" />
            <button class="select-clear" type="button" id="filterTitleClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
          </div>
          <div class="filter-item" id="langWrap">
            <button class="select-trigger" type="button" id="langTrigger">
              <span class="select-trigger__text" id="langLabel">语种：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="langClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="langPanel">
              <div class="single-option" data-value="英语">英语</div>
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
            <button class="btn btn--success" type="button" id="syncBtn">同步</button>
          </div>
        </div>

        <div class="data-panel" id="dataPanel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="dataTable">
                <colgroup>
                  <col class="col-id" data-col-width="112" />
                  <col class="col-title" data-col-width="280" />
                  <col class="col-lang" data-col-width="100" />
                  <col class="col-time" data-col-width="180" />
                  <col class="col-time" data-col-width="180" />
                </colgroup>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>剧目名称</th>
                    <th>语种</th>
                    <th>创建时间</th>
                    <th>更新时间</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="menu.js"></script>
  <script src="product-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script src="tt-dramas.js?v=5"></script>
</body>
</html>
