<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="user-management.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <img class="logo" src="assets/logo.png" width="32" height="32" alt="海外中台" onerror="this.style.background='var(--color-fill-4)';this.removeAttribute('src')" />
        <span class="brand-name">海外中台</span>
      </div>
      <nav class="header-nav" aria-label="顶部导航">
        <a href="#" class="header-nav__item" data-menu-name="首页">首页</a>
        <a href="dashboard.html" class="header-nav__item" data-menu-name="看板">看板</a>
        <a href="tiktok-accounts.html" class="header-nav__item" data-menu-name="产品">产品</a>
        <a href="feedback-tickets.html" class="header-nav__item" data-menu-name="工具">工具</a>
        <a href="menu-management.html" class="header-nav__item is-active" data-menu-name="管理">管理</a>
      </nav>
      <div class="header-right">
        <button class="header-icon" type="button" title="下载" aria-label="下载">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="header-icon" type="button" title="消息" aria-label="消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <a class="header-icon" href="https://m0v1x0i131y.feishu.cn/wiki/P7WcwmPrdigKg6keQbycBtYgn3d" target="_blank" rel="noopener noreferrer" title="帮助中心" aria-label="帮助中心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </a>
        <button class="user-chip" type="button" aria-label="用户菜单">
          <img class="user-avatar" src="assets/avatar.jpg" width="32" height="32" alt="" onerror="this.style.background='var(--color-fill-4)';this.removeAttribute('src')" />
          <span class="user-name">小风</span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" aria-label="侧边栏导航">
          <div class="menu-group" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
              <span class="menu-group__title-text">系统管理</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <ul class="menu-children">
              <li>
                <a href="menu-management.html" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                  </svg>
                  <span class="menu-item__text">菜单管理</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="menu-group" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <span class="menu-group__title-text">权限管理</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <ul class="menu-children">
              <li>
                <a href="user-management.html" class="menu-item is-active">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                  <span class="menu-item__text">用户管理</span>
                </a>
              </li>
              <li>
                <a href="role-management.html" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                  <span class="menu-item__text">角色管理</span>
                </a>
              </li>
              <li>
                <a href="datagroup-management.html" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
                  </svg>
                  <span class="menu-item__text">数据组管理</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>
        <div class="sidebar-footer">
          <button class="sidebar-collapse-btn" id="sidebarToggle" type="button" title="折叠菜单" aria-label="折叠侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h16"/><path d="M15 9l-3 3 3 3"/>
            </svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <div class="content-card">
          <div class="filter-bar" id="filterBar">
            <div class="filter-item">
              <input class="input" id="filterNickname" type="text" placeholder="昵称" autocomplete="off" />
            </div>

            <div class="filter-item" id="deptWrap">
              <button class="select-trigger" type="button" id="deptTrigger">
                <span class="select-trigger__text" id="deptLabel">部门：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="deptClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="multi-panel multi-panel--simple" id="deptPanel">
                <div class="multi-panel__list" id="deptList"></div>
              </div>
            </div>

            <div class="filter-item" id="roleWrap">
              <button class="select-trigger" type="button" id="roleTrigger">
                <span class="select-trigger__text" id="roleLabel">角色：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="roleClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="multi-panel multi-panel--simple" id="rolePanel">
                <div class="multi-panel__list" id="roleList"></div>
              </div>
            </div>

            <div class="filter-item" id="dataGroupWrap">
              <button class="select-trigger" type="button" id="dataGroupTrigger">
                <span class="select-trigger__text" id="dataGroupLabel">数据组：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="dataGroupClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="multi-panel multi-panel--simple" id="dataGroupPanel">
                <div class="multi-panel__list" id="dataGroupList"></div>
              </div>
            </div>

            <div class="filter-item" id="statusWrap">
              <button class="select-trigger" type="button" id="statusTrigger">
                <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="statusClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="single-panel" id="statusPanel">
                <button class="single-option" type="button" data-value="">全部</button>
                <button class="single-option" type="button" data-value="启用">启用</button>
                <button class="single-option" type="button" data-value="禁用">禁用</button>
              </div>
            </div>

            <div class="filter-actions">
              <button class="btn btn--default" type="button" id="resetBtn">重置</button>
              <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
            </div>
          </div>

          <div class="data-panel" id="dataPanel">
            <div class="table-shell">
              <div class="table-wrap">
                <table class="data-table" id="userTable">
                  <colgroup>
                    <col data-col-width="140" />
                    <col data-col-width="180" />
                    <col data-col-width="160" />
                    <col data-col-width="140" />
                    <col data-col-width="160" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                    <col data-col-width="168" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>昵称</th>
                      <th>账号</th>
                      <th>部门</th>
                      <th>角色</th>
                      <th>数据组</th>
                      <th>状态</th>
                      <th>更新时间</th>
                      <th class="col-action">操作</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 编辑用户：账号/昵称/部门来自飞书，只读 -->
  <div class="modal-mask modal-mask--dropdown" id="editModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="editModalTitle">编辑用户</div>
        <button class="modal__close" type="button" data-close="editModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <label class="form-item__label">账号</label>
          <div class="form-item__control">
            <input class="input" id="editAccount" type="text" readonly disabled autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">昵称</label>
          <div class="form-item__control">
            <input class="input" id="editNickname" type="text" readonly disabled autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">部门</label>
          <div class="form-item__control">
            <input class="input" id="editDept" type="text" readonly disabled autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">角色</label>
          <div class="form-item__control" id="editRoleWrap">
            <button class="select-trigger" type="button" id="editRoleTrigger">
              <span class="select-trigger__text" id="editRoleLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="editRoleClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel multi-panel--simple" id="editRolePanel">
              <div class="multi-panel__list" id="editRoleList"></div>
            </div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">数据组</label>
          <div class="form-item__control" id="editDataGroupWrap">
            <button class="select-trigger" type="button" id="editDataGroupTrigger">
              <span class="select-trigger__text" id="editDataGroupLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="editDataGroupClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel multi-panel--simple" id="editDataGroupPanel">
              <div class="multi-panel__list" id="editDataGroupList"></div>
            </div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">状态</label>
          <div class="form-item__control">
            <div class="seg" id="editStatusSeg" role="group" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="editModal">取消</button>
        <button class="btn btn--primary" type="button" id="editSubmit">提交</button>
      </div>
    </div>
  </div>

  <!-- 扮演确认 -->
  <div class="modal-mask modal-mask--confirm" id="impersonateModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="impersonateTitle">
      <button class="confirm-modal__close" type="button" data-close="impersonateModal" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon confirm-modal__icon--warning" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Zm-2-11a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v2Zm4-18a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V15Z"/></svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="impersonateTitle">扮演确认</h2>
          <p class="confirm-modal__body" id="impersonateBody">确认扮演该用户吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" data-close="impersonateModal">取消</button>
        <button class="btn btn--primary" type="button" id="impersonateOk">确认</button>
      </div>
    </div>
  </div>

  <!-- 编辑日志 -->
  <div class="drawer-mask" id="logDrawer" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="logDrawerTitle">
      <div class="drawer__header">
        <h2 class="drawer__title" id="logDrawerTitle">编辑日志</h2>
        <button class="drawer__close" type="button" id="logDrawerClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="logDrawerBody"></div>
      <div class="pagination drawer__pager" id="logPagination" hidden></div>
    </aside>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="col-resize.js"></script>
  <script src="user-management.js"></script>
</body>
</html>
