<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok托管 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="tiktok-hosting.css?v=20261103" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card" id="listView">
        <div class="filter-bar" id="filterBar">
          <div class="filter-item" id="filterNameWrap">
            <input class="input" id="filterName" type="text" placeholder="托管名称" autocomplete="off" />
            <button class="select-clear" type="button" id="filterNameClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
          </div>
          <div class="filter-item" id="filterCreatorWrap">
            <button class="select-trigger" type="button" id="filterCreatorTrigger">
              <span class="select-trigger__text" id="filterCreatorLabel">创建人：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="filterCreatorClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="filterCreatorPanel">
              <button class="single-option" type="button" data-value="">全部</button>
              <button class="single-option" type="button" data-value="用户A">用户A</button>
              <button class="single-option" type="button" data-value="用户B">用户B</button>
              <button class="single-option" type="button" data-value="用户C">用户C</button>
              <button class="single-option" type="button" data-value="用户D">用户D</button>
              <button class="single-option" type="button" data-value="用户E">用户E</button>
              <button class="single-option" type="button" data-value="用户F">用户F</button>
            </div>
          </div>
          <div class="filter-item" id="filterStatusWrap">
            <button class="select-trigger" type="button" id="filterStatusTrigger">
              <span class="select-trigger__text" id="filterStatusLabel">状态：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="filterStatusClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="filterStatusPanel">
              <button class="single-option" type="button" data-value="">全部</button>
              <button class="single-option" type="button" data-value="启用">启用</button>
              <button class="single-option" type="button" data-value="禁用">禁用</button>
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
            <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
            <div class="create-split" id="createSplit">
              <button class="create-split__main" type="button" id="createBtn">添加</button>
              <button class="create-split__caret" type="button" id="createCaret" aria-label="选择托管对象" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <div class="create-menu" id="createMenu" role="menu" hidden>
                <button class="create-menu__item" type="button" role="menuitem" data-create="广告账户">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="5" r="2.2"/><path d="M3.2 13.2c.6-2.2 2.4-3.4 4.8-3.4s4.2 1.2 4.8 3.4"/></svg>
                  广告账户
                </button>
                <button class="create-menu__item" type="button" role="menuitem" data-create="推广系列">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h8M2.5 11.5h5"/></svg>
                  推广系列
                </button>
                <button class="create-menu__item" type="button" role="menuitem" data-create="广告组">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="0.8"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="0.8"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="0.8"/><rect x="9" y="9" width="4.5" height="4.5" rx="0.8"/></svg>
                  广告组
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="data-panel" id="dataPanel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="dataTable">
                <colgroup>
                  <col data-col-width="80" />
                  <col data-col-width="80" />
                  <col data-col-width="180" />
                  <col data-col-width="100" />
                  <col data-col-width="200" />
                  <col data-col-width="96" />
                  <col data-col-width="88" />
                  <col data-col-width="168" />
                  <col data-col-width="168" />
                  <col data-col-width="220" />
                </colgroup>
                <thead>
                  <tr>
                    <th>状态</th>
                    <th>ID</th>
                    <th>托管名称</th>
                    <th>托管对象</th>
                    <th>检查频次</th>
                    <th>执行次数</th>
                    <th>创建人</th>
                    <th>最近执行时间</th>
                    <th>创建时间</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>

      <div class="cfg-page" id="createView" hidden>
        <div class="cfg-page__head">
          <button class="cfg-page__back" type="button" id="createBack" aria-label="返回">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7.5 2.5L3.5 6l4 3.5"/></svg>
          </button>
          <h1 class="cfg-page__title" id="createTitle">推广系列托管</h1>
          <div class="cfg-page__actions">
            <button class="btn btn--default" type="button" id="createCancel">取消</button>
            <button class="btn btn--primary" type="button" id="createSubmit">提交</button>
          </div>
        </div>
        <div class="cfg-page__body" id="createBody">
          <section class="cfg-card" id="ruleCard">
            <h2 class="cfg-card__title" id="ruleTitle">托管规则</h2>
            <div class="cfg-card__form">
              <div id="campaignRules">
                <div class="form-item" id="itemFilters">
                  <label class="form-item__label">筛选</label>
                  <div class="form-item__control">
                    <div class="th-stack" id="filterRows"></div>
                    <button class="th-add" type="button" id="addFilterBtn">
                      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 1.5v9M1.5 6h9"/></svg>
                      添加筛选
                    </button>
                    <div class="form-item__error">请完善筛选</div>
                  </div>
                </div>
                <div class="form-item">
                  <label class="form-item__label">条件</label>
                  <div class="form-item__control">
                    <div class="seg" id="logicSeg" role="radiogroup" aria-label="条件">
                      <button type="button" class="seg__item is-active" data-logic="any" role="radio" aria-checked="true">满足任一条件</button>
                      <button type="button" class="seg__item" data-logic="all" role="radio" aria-checked="false">满足全部条件</button>
                    </div>
                  </div>
                </div>
                <div class="form-item" id="itemMetrics">
                  <label class="form-item__label is-required">指标</label>
                  <div class="form-item__control">
                    <div class="th-stack" id="metricRows"></div>
                    <button class="th-add" type="button" id="addMetricBtn">
                      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 1.5v9M1.5 6h9"/></svg>
                      添加指标
                    </button>
                    <div class="form-item__error">请完善指标</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div id="campaignCfg">
            <section class="cfg-card">
              <h2 class="cfg-card__title">执行动作</h2>
              <div class="cfg-card__form">
                <div class="form-item" id="itemActions">
                  <label class="form-item__label is-required">执行动作</label>
                  <div class="form-item__control">
                    <div class="th-stack" id="actionRows"></div>
                    <button class="th-add" type="button" id="addActionBtn">
                      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 1.5v9M1.5 6h9"/></svg>
                      添加动作
                    </button>
                    <div class="th-tips">只有开启 CBO预算优化 的推广系列才能执行预算调整。日预算应为 50 - 9999999.99 间的纯数字。</div>
                    <div class="form-item__error">请完善执行动作</div>
                  </div>
                </div>
              </div>
            </section>

            <section class="cfg-card">
              <h2 class="cfg-card__title">执行频率</h2>
              <div class="cfg-card__form">
                <div class="form-item">
                  <label class="form-item__label">执行时区</label>
                  <div class="form-item__control">
                    <div class="th-select th-w168 has-value" id="tzBox" data-kind="timezone">
                      <button class="select-trigger" type="button" title="UTC+0">
                        <span class="select-trigger__text">UTC+0</span>
                        <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                      </button>
                      <div class="single-panel"></div>
                    </div>
                  </div>
                </div>
                <div class="form-item" id="itemEffect">
                  <label class="form-item__label">生效日期</label>
                  <div class="form-item__control">
                    <div class="th-inline">
                      <div class="seg" id="effectSeg" role="radiogroup" aria-label="生效日期">
                        <button type="button" class="seg__item is-active" data-effect="long" role="radio" aria-checked="true">长期</button>
                        <button type="button" class="seg__item" data-effect="custom" role="radio" aria-checked="false">自定义</button>
                      </div>
                      <div id="effectDateHost" hidden></div>
                    </div>
                    <div class="form-item__error">请选择生效日期</div>
                  </div>
                </div>
                <div class="form-item" id="itemFreq">
                  <label class="form-item__label">检查频次</label>
                  <div class="form-item__control">
                    <div class="th-inline">
                      <div class="th-select th-w168 has-value" id="freqBox" data-kind="frequency">
                        <button class="select-trigger" type="button" title="每天">
                          <span class="select-trigger__text">每天</span>
                          <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                        </button>
                        <div class="single-panel"></div>
                      </div>
                      <div class="th-select th-w168" id="weekBox" data-kind="weekdays" hidden>
                        <button class="select-trigger" type="button">
                          <span class="select-trigger__text"><span class="muted">请选择星期</span></span>
                          <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                        </button>
                        <div class="multi-panel"></div>
                      </div>
                      <div class="th-select th-w168 has-value" id="timeBox" data-kind="time">
                        <button class="select-trigger" type="button" title="09:00:00">
                          <span class="select-trigger__text">09:00:00</span>
                          <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                        </button>
                        <div class="th-time-panel"></div>
                      </div>
                    </div>
                    <div class="form-item__error" id="freqError">请选择星期</div>
                  </div>
                </div>
              </div>
            </section>
          </div>

          <section class="cfg-card" id="basicCard">
            <h2 class="cfg-card__title">基础信息</h2>
            <div class="cfg-card__form">
              <div class="form-item" id="createNameItem">
                <label class="form-item__label is-required">托管名称</label>
                <div class="form-item__control">
                  <div class="input-clearable th-field" id="createNameWrap">
                    <input class="input" id="createName" type="text" placeholder="请输入" maxlength="50" autocomplete="off" />
                    <button class="select-clear" type="button" aria-label="清除">
                      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                    </button>
                  </div>
                  <div class="form-item__error" id="createNameError">请输入托管名称</div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-mask" id="formModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="modal__header">
        <div class="modal__title" id="formTitle">广告账户托管</div>
        <button class="modal__close" type="button" id="formClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item" id="itemName">
          <label class="form-item__label is-required">托管名称</label>
          <div class="form-item__control">
            <div class="input-clearable" id="formNameWrap">
              <input class="input" id="formName" type="text" placeholder="请输入" maxlength="50" autocomplete="off" />
              <button class="select-clear" type="button" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
            <div class="form-item__error" id="nameError">请输入托管名称</div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">托管对象</label>
          <div class="form-item__control">
            <input class="input" id="formTarget" type="text" value="" disabled />
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="formCancel">取消</button>
        <button class="btn btn--primary" type="button" id="formSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="drawer-mask" id="runDrawer" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="runDrawerTitle">
      <div class="drawer__header">
        <h2 class="drawer__title" id="runDrawerTitle">执行记录</h2>
        <button class="drawer__close" type="button" id="runDrawerClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="filter-bar run-filter" id="runFilter">
        <div class="filter-item filter-item--date" id="runDateItem">
          <div id="runDateHost"></div>
          <button class="select-clear" type="button" id="runDateClear" aria-label="清除">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
          </button>
        </div>
        <div class="filter-item" id="runAccountWrap">
          <input class="input" id="runAccountInput" type="text" placeholder="广告账户名称/ID" autocomplete="off" />
          <button class="select-clear" type="button" id="runAccountClear" aria-label="清除">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
          </button>
        </div>
        <div class="filter-item" id="runCampaignWrap">
          <input class="input" id="runCampaignInput" type="text" placeholder="推广系列名称/ID" autocomplete="off" />
          <button class="select-clear" type="button" id="runCampaignClear" aria-label="清除">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
          </button>
        </div>
        <div class="filter-item" id="runResultWrap">
          <button class="select-trigger" type="button" id="runResultTrigger">
            <span class="select-trigger__text" id="runResultLabel">执行结果：<span class="muted">请选择</span></span>
            <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
          </button>
          <button class="select-clear" type="button" id="runResultClear" aria-label="清除">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
          </button>
          <div class="single-panel" id="runResultPanel">
            <button class="single-option" type="button" data-value="成功">成功</button>
            <button class="single-option" type="button" data-value="失败">失败</button>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn btn--default" type="button" id="runFilterReset">重置</button>
          <button class="btn btn--primary" type="button" id="runFilterQuery">查询</button>
        </div>
      </div>
      <div class="drawer__body" id="runDrawerBody"></div>
      <div class="pagination drawer__pager" id="runPagination" hidden></div>
    </aside>
  </div>

  <div class="drawer-mask" id="logDrawer" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="logDrawerTitle">
      <div class="drawer__header">
        <h2 class="drawer__title" id="logDrawerTitle">日志</h2>
        <button class="drawer__close" type="button" id="logDrawerClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="logDrawerBody"></div>
      <div class="pagination drawer__pager" id="logPagination" hidden></div>
    </aside>
  </div>

  <div class="modal-mask modal-mask--confirm" id="confirmModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <button class="confirm-modal__close" type="button" id="confirmClose" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon confirm-modal__icon--danger" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Zm4.955-27.771-4.95 4.95-4.95-4.95a1 1 0 0 0-1.414 0l-1.414 1.414a1 1 0 0 0 0 1.414l4.95 4.95-4.95 4.95a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l4.95-4.95 4.95 4.95a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-4.95-4.95 4.95-4.95a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0Z"/></svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="confirmTitle">删除确认</h2>
          <p class="confirm-modal__body">此操作不可撤销，确认删除吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" id="confirmCancel">取消</button>
        <button class="btn btn--primary" type="button" id="confirmOk">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-mask modal-mask--confirm" id="statusConfirmModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="statusConfirmTitle">
      <button class="confirm-modal__close" type="button" id="statusConfirmClose" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon confirm-modal__icon--warning" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Zm-2-11a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v2Zm4-18a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V15Z"/></svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="statusConfirmTitle">禁用确认</h2>
          <p class="confirm-modal__body" id="statusConfirmBody">确认禁用该托管吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" id="statusConfirmCancel">取消</button>
        <button class="btn btn--primary" type="button" id="statusConfirmOk">确认</button>
      </div>
    </div>
