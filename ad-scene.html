<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>场景管理 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="ad-strategy.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar" id="filterBar">
          <div class="filter-item" id="filterKeywordWrap">
            <input class="input input-clearable" id="filterKeyword" type="text" placeholder="场景名称/Key" autocomplete="off" />
            <button class="select-clear" type="button" id="filterKeywordClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
          </div>
          <div class="filter-item" id="sceneTypeWrap">
            <button class="select-trigger" type="button" id="sceneTypeTrigger">
              <span class="select-trigger__text" id="sceneTypeLabel">场景类型：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="sceneTypeClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="sceneTypePanel">
              <button class="single-option" type="button" data-value="SDK内置">SDK内置</button>
              <button class="single-option" type="button" data-value="自定义">自定义</button>
            </div>
          </div>
          <div class="filter-item" id="adSwitchWrap">
            <button class="select-trigger" type="button" id="adSwitchTrigger">
              <span class="select-trigger__text" id="adSwitchLabel">广告开关：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="adSwitchClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="adSwitchPanel">
              <button class="single-option" type="button" data-value="开">开</button>
              <button class="single-option" type="button" data-value="关">关</button>
            </div>
          </div>
          <div class="filter-item" id="statusWrap">
            <button class="select-trigger" type="button" id="statusTrigger">
              <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="statusClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="statusPanel">
              <button class="single-option" type="button" data-value="启用">启用</button>
              <button class="single-option" type="button" data-value="禁用">禁用</button>
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
            <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
            <button class="btn btn--success" type="button" id="addBtn">添加</button>
          </div>
        </div>

        <div class="data-panel" id="dataPanel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="dataTable">
                <colgroup>
                  <col class="col-check col-drag" data-col-width="48" />
                  <col data-col-width="180" />
                  <col data-col-width="260" />
                  <col data-col-width="120" />
                  <col data-col-width="100" />
                  <col data-col-width="100" />
                  <col data-col-width="100" />
                  <col data-col-width="180" />
                  <col data-col-width="120" />
                </colgroup>
                <thead>
                  <tr>
                    <th class="col-check col-drag"></th>
                    <th>场景名称</th>
                    <th>场景Key</th>
                    <th>场景类型</th>
                    <th>广告开关</th>
                    <th>关联字段</th>
                    <th>状态</th>
                    <th>更新时间</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-mask modal-mask--dropdown" id="editModal" aria-hidden="true">
    <div class="modal modal--form modal--large" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="editModalTitle">添加场景</div>
        <button class="modal__close" type="button" data-close="editModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <label class="form-item__label">场景类型</label>
          <div class="form-item__control">
            <div class="seg" id="editSceneTypeSeg" role="radiogroup" aria-label="场景类型">
              <button type="button" class="seg__item" data-value="SDK内置">SDK内置</button>
              <button type="button" class="seg__item is-active" data-value="自定义">自定义</button>
            </div>
          </div>
        </div>
        <div class="form-item" id="editKeyItem">
          <label class="form-item__label is-required">场景Key</label>
          <div class="form-item__control">
            <div class="input-clearable" id="editKeyClearWrap">
              <input class="input" id="editKey" type="text" placeholder="请输入场景Key" autocomplete="off" />
              <button class="select-clear" type="button" id="editKeyClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
            <div class="form-item__error">请输入场景Key</div>
          </div>
        </div>
        <div class="form-item" id="editNameItem">
          <label class="form-item__label is-required">场景名称</label>
          <div class="form-item__control">
            <div class="input-clearable" id="editNameClearWrap">
              <input class="input" id="editName" type="text" placeholder="请输入场景名称" autocomplete="off" />
              <button class="select-clear" type="button" id="editNameClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
            <div class="form-item__error">请输入场景名称</div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">描述</label>
          <div class="form-item__control">
            <div class="input-clearable" id="editRemarkClearWrap">
              <input class="input" id="editRemark" type="text" placeholder="请输入描述" autocomplete="off" />
              <button class="select-clear" type="button" id="editRemarkClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">状态</label>
          <div class="form-item__control">
            <div class="seg" id="editStatusSeg" role="radiogroup" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
        <div class="form-divider" role="separator"></div>
        <div class="form-item form-item--switch">
          <label class="form-item__label">广告开关</label>
          <div class="form-item__control">
            <button class="switch is-on" type="button" id="editAdSwitch" aria-label="广告开关" aria-pressed="true"></button>
          </div>
        </div>
        <div class="form-item form-item--top" id="editFieldItem">
          <label class="form-item__label is-required">关联字段</label>
          <div class="form-item__control">
            <div class="scene-field-select" id="editFieldWrap">
            <button class="select-trigger" type="button" id="editFieldTrigger">
              <span class="select-trigger__text" id="editFieldLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="editFieldClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel" id="editFieldPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="editFieldSearch" type="text" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="editFieldSelectAll">全选</button>
                </div>
                <div class="multi-panel__list" id="editFieldList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="editFieldCount">已选择 0 项</span>
                  <button class="multi-panel__link" type="button" id="editFieldPanelClear">清空</button>
                </div>
                <div class="multi-panel__list" id="editFieldSelected"></div>
              </div>
            </div>
            <div class="form-item__error">请选择关联字段</div>
            </div>
          </div>
        </div>
        <div class="scene-field-block" id="editFieldConfig" hidden>
          <table class="param-table scene-field-table">
            <colgroup>
              <col class="col-drag" />
              <col class="col-name" />
              <col class="col-type" />
              <col class="col-def" />
              <col class="col-req" />
              <col class="col-op" />
            </colgroup>
            <thead>
              <tr>
                <th></th>
                <th>字段名称</th>
                <th>控件类型</th>
                <th>预设默认值</th>
                <th>是否必填</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="editFieldConfigBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="editModal">取消</button>
        <button class="btn btn--primary" type="button" id="editSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-mask modal-mask--dropdown" id="arrayPresetModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="arrayPresetTitle">
      <div class="modal__header">
        <div class="modal__title" id="arrayPresetTitle">预设子字段</div>
        <button class="modal__close" type="button" data-close="arrayPresetModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body" id="arrayPresetBody"></div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="arrayPresetModal">取消</button>
        <button class="btn btn--primary" type="button" id="arrayPresetSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="menu.js"></script>
  <script src="product-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script src="ad-strategy-data.js"></script>
  <script>ProductShell.mount('ad-scene');</script>
  <script src="ad-scene.js"></script>
</body>
</html>
