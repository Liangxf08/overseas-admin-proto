<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APP应用 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <style>
    .cell-platform {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
    }
    .array-field { margin-bottom: 20px; }
    .array-field__title {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-1, #1D2129);
      margin-bottom: 8px;
    }
    .array-row {
      border: 1px solid var(--color-border-2, #E5E6EB);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 8px;
      background: var(--color-fill-1, #F7F8FA);
    }
    .array-row__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--color-text-2, #4E5969);
    }
    .array-row .form-item { margin-bottom: 12px; }
    .array-row .form-item:last-child { margin-bottom: 0; }
    .plugin-section {
      margin-bottom: 24px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border-2, #E5E6EB);
    }
    .plugin-section:last-child { border-bottom: none; }
    .plugin-section__title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-1, #1D2129);
      margin-bottom: 16px;
    }
    .param-table .input,
    .param-table select.input {
      width: 100%;
    }
    .sync-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 8px;
      gap: 8px;
    }
    .drawer__body .form-item:last-child { margin-bottom: 20px; }
    .readonly-text {
      height: 32px;
      line-height: 32px;
      color: var(--color-text-1, #1D2129);
      padding: 0 12px;
      background: var(--color-fill-1, #F7F8FA);
      border: 1px solid var(--color-border-2, #E5E6EB);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar">
          <div class="filter-item filter-item--wide">
            <input class="input" id="filterKeyword" type="text" placeholder="产品名称/ID" autocomplete="off" />
          </div>
          <div class="filter-item filter-item--wide">
            <input class="input" id="filterPackage" type="text" placeholder="包名" autocomplete="off" />
          </div>

          <div class="filter-item" id="platformWrap">
            <button class="select-trigger" type="button" id="platformTrigger">
              <span class="select-trigger__text" id="platformLabel">平台：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="multi-panel" id="platformPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="platformSearch" type="text" placeholder="搜索" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="platformSelectAll">全选</button>
                  <button class="multi-panel__link" type="button" id="platformClear" style="margin-left:12px">清空</button>
                </div>
                <div class="multi-panel__list" id="platformList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="platformCount">已选择 0 项</span>
                </div>
                <div class="multi-panel__list" id="platformSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="groupWrap">
            <button class="select-trigger" type="button" id="groupTrigger">
              <span class="select-trigger__text" id="groupLabel">产品组：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="multi-panel" id="groupPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="groupSearch" type="text" placeholder="搜索" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="groupSelectAll">全选</button>
                  <button class="multi-panel__link" type="button" id="groupClear" style="margin-left:12px">清空</button>
                </div>
                <div class="multi-panel__list" id="groupList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="groupCount">已选择 0 项</span>
                </div>
                <div class="multi-panel__list" id="groupSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="typeWrap">
            <button class="select-trigger" type="button" id="typeTrigger">
              <span class="select-trigger__text" id="typeLabel">产品类型：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="multi-panel" id="typePanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="typeSearch" type="text" placeholder="搜索" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="typeSelectAll">全选</button>
                  <button class="multi-panel__link" type="button" id="typeClear" style="margin-left:12px">清空</button>
                </div>
                <div class="multi-panel__list" id="typeList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="typeCount">已选择 0 项</span>
                </div>
                <div class="multi-panel__list" id="typeSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="seriesWrap">
            <button class="select-trigger" type="button" id="seriesTrigger">
              <span class="select-trigger__text" id="seriesLabel">产品系列：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="multi-panel" id="seriesPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="seriesSearch" type="text" placeholder="搜索" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="seriesSelectAll">全选</button>
                  <button class="multi-panel__link" type="button" id="seriesClear" style="margin-left:12px">清空</button>
                </div>
                <div class="multi-panel__list" id="seriesList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="seriesCount">已选择 0 项</span>
                </div>
                <div class="multi-panel__list" id="seriesSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="ownerWrap">
            <button class="select-trigger" type="button" id="ownerTrigger">
              <span class="select-trigger__text" id="ownerLabel">负责人：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="multi-panel" id="ownerPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="ownerSearch" type="text" placeholder="搜索" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="ownerSelectAll">全选</button>
                  <button class="multi-panel__link" type="button" id="ownerClear" style="margin-left:12px">清空</button>
                </div>
                <div class="multi-panel__list" id="ownerList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="ownerCount">已选择 0 项</span>
                </div>
                <div class="multi-panel__list" id="ownerSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="configStatusWrap">
            <button class="select-trigger" type="button" id="configStatusTrigger">
              <span class="select-trigger__text" id="configStatusLabel">配置状态：全部</span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="single-panel" id="configStatusPanel">
              <div class="single-option is-active" data-value="全部">全部</div>
              <div class="single-option" data-value="已配置">已配置</div>
              <div class="single-option" data-value="未配置">未配置</div>
            </div>
          </div>

          <div class="filter-item" id="statusWrap">
            <button class="select-trigger" type="button" id="statusTrigger">
              <span class="select-trigger__text" id="statusLabel">状态：全部</span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="single-panel" id="statusPanel">
              <div class="single-option is-active" data-value="全部">全部</div>
              <div class="single-option" data-value="启用">启用</div>
              <div class="single-option" data-value="禁用">禁用</div>
            </div>
          </div>

          <div class="filter-actions">
            <button class="btn btn--primary" type="button" id="searchBtn">查询</button>
            <button class="btn btn--default" type="button" id="addBtn">添加</button>
          </div>
        </div>

        <div class="table-shell">
          <div class="table-wrap">
            <table class="data-table" id="dataTable">
              <colgroup>
                <col style="width:12%" />
                <col style="width:10%" />
                <col style="width:12%" />
                <col style="width:7%" />
                <col style="width:8%" />
                <col style="width:7%" />
                <col style="width:8%" />
                <col style="width:6%" />
                <col style="width:7%" />
                <col style="width:6%" />
                <col style="width:17%" />
              </colgroup>
              <thead>
                <tr>
                  <th>产品名称</th>
                  <th>产品ID</th>
                  <th>包名</th>
                  <th>平台</th>
                  <th>产品组</th>
                  <th>产品类型</th>
                  <th>产品系列</th>
                  <th>负责人</th>
                  <th>配置状态</th>
                  <th>状态</th>
                  <th class="col-action">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
          </div>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <div class="page-msg page-msg--success" id="pageMsg" role="status"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-mask" id="formModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="formModalTitle">添加产品</div>
        <button class="modal__close" type="button" id="formModalClose" aria-label="关闭">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l10 10M12 2L2 12"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label is-required">平台</div>
          <div class="form-item__control">
            <div class="seg" id="platformSeg">
              <button class="seg__item is-active" type="button" data-value="Android">Android</button>
              <button class="seg__item" type="button" data-value="iOS">iOS</button>
            </div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">产品名称</div>
          <div class="form-item__control">
            <input class="input" id="formName" type="text" placeholder="请输入产品名称" autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">产品组</div>
          <div class="form-item__control" id="formGroupWrap">
            <button class="select-trigger" type="button" id="formGroupTrigger">
              <span class="select-trigger__text" id="formGroupLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              <span class="select-clear" id="formGroupClear" aria-label="清除"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg></span>
            </button>
            <div class="single-panel" id="formGroupPanel"></div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">产品类型</div>
          <div class="form-item__control" id="formTypeWrap">
            <button class="select-trigger" type="button" id="formTypeTrigger">
              <span class="select-trigger__text" id="formTypeLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              <span class="select-clear" id="formTypeClear" aria-label="清除"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg></span>
            </button>
            <div class="single-panel" id="formTypePanel"></div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">产品系列</div>
          <div class="form-item__control" id="formSeriesWrap">
            <button class="select-trigger" type="button" id="formSeriesTrigger">
              <span class="select-trigger__text" id="formSeriesLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              <span class="select-clear" id="formSeriesClear" aria-label="清除"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg></span>
            </button>
            <div class="single-panel" id="formSeriesPanel"></div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">负责人</div>
          <div class="form-item__control" id="formOwnerWrap">
            <button class="select-trigger" type="button" id="formOwnerTrigger">
              <span class="select-trigger__text" id="formOwnerLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              <span class="select-clear" id="formOwnerClear" aria-label="清除"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg></span>
            </button>
            <div class="single-panel" id="formOwnerPanel"></div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">包名</div>
          <div class="form-item__control">
            <input class="input" id="formPackage" type="text" placeholder="请输入包名" autocomplete="off" />
          </div>
        </div>
        <div class="form-item" id="storeIdItem" hidden>
          <div class="form-item__label">StoreID</div>
          <div class="form-item__control">
            <input class="input" id="formStoreId" type="text" placeholder="请输入 StoreID" autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">状态</div>
          <div class="form-item__control">
            <div class="seg" id="statusSeg">
              <button class="seg__item is-active" type="button" data-value="启用">启用</button>
              <button class="seg__item" type="button" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="formCancelBtn">取消</button>
        <button class="btn btn--primary" type="button" id="formSubmitBtn">提交</button>
      </div>
    </div>
  </div>

  <!-- Download JSON Modal -->
  <div class="modal-mask" id="jsonModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="jsonModalTitle">下载JSON</div>
        <button class="modal__close" type="button" id="jsonModalClose" aria-label="关闭">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l10 10M12 2L2 12"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label">平台</div>
          <div class="form-item__control"><div class="readonly-text" id="jsonPlatform"></div></div>
        </div>
        <div class="form-item">
          <div class="form-item__label">产品名称</div>
          <div class="form-item__control"><div class="readonly-text" id="jsonAppName"></div></div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">SDK版本号</div>
          <div class="form-item__control">
            <input class="input" id="jsonSdkVersion" type="text" placeholder="请输入SDK版本号" autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label is-required">APP版本号</div>
          <div class="form-item__control">
            <input class="input" id="jsonAppVersion" type="text" placeholder="请输入APP版本号" autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="jsonCancelBtn">取消</button>
        <button class="btn btn--primary" type="button" id="jsonSubmitBtn">提交</button>
      </div>
    </div>
  </div>

  <!-- Config Drawer -->
  <div class="drawer-mask" id="configDrawerMask" aria-hidden="true"></div>
  <aside class="drawer" id="configDrawer" aria-hidden="true">
    <div class="drawer__header">
      <div class="drawer__title" id="configDrawerTitle">配置</div>
      <button class="modal__close" type="button" id="configDrawerClose" aria-label="关闭">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l10 10M12 2L2 12"/></svg>
      </button>
    </div>
    <div class="drawer__body">
      <div class="drawer-tabs" id="configTabs">
        <button class="drawer-tabs__item is-active" type="button" data-tab="startup">启动配置</button>
        <button class="drawer-tabs__item" type="button" data-tab="plugin">插件配置</button>
        <button class="drawer-tabs__item" type="button" data-tab="ad">广告配置</button>
        <button class="drawer-tabs__item" type="button" data-tab="iap">内购配置</button>
      </div>
      <div class="config-block is-active" id="tabStartup"></div>
      <div class="config-block" id="tabPlugin"></div>
      <div class="config-block" id="tabAd"></div>
      <div class="config-block" id="tabIap"></div>
    </div>
    <div class="drawer__footer">
      <button class="btn btn--default" type="button" id="configCancelBtn">取消</button>
      <button class="btn btn--primary" type="button" id="configSubmitBtn">提交</button>
    </div>
  </aside>

  <script src="col-resize.js"></script>
  <script src="product-common.js"></script>
  <script src="product-sidebar.js"></script>
  <script>
    (function () {
      'use strict';

      ProductShell.mount('app-apps');

      var UI = ProductUI;
      var escapeHtml = UI.escapeHtml;
      var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
      var LS_JSON_KEY = 'hwzt_json_files';

      var PLATFORMS = ['Android', 'iOS'];
      var GROUPS = ['益智解谜', '超休闲', '中重度', '三消', '合成'];
      var TYPES = ['休闲', '超休闲', '中重度', '模拟经营', '解谜'];
      var SERIES = ['Jam系列', 'Sort系列', 'Match系列', 'ASMR系列', 'Word系列'];
      var OWNERS = Array.from({ length: 6 }, function (_, i) { return '用户' + String.fromCharCode(65 + i); });

      var STARTUP_FIELDS = [
        { key: 'config_version', name: '配置版本', type: '数字输入', defaultValue: '200', min: 1, max: 999 },
        { key: 'channel', name: '渠道标识', type: '文本输入', defaultValue: '', placeholder: '请输入渠道' },
        { key: 'debug_mode', name: '调试模式', type: '开关', defaultValue: false },
        {
          key: 'log_level', name: '日志级别', type: '下拉选择', defaultValue: 'info',
          options: [
            { value: 'debug', label: 'Debug' },
            { value: 'info', label: 'Info' },
            { value: 'warn', label: 'Warn' },
            { value: 'error', label: 'Error' }
          ]
        },

      function renderFieldControl(field, value, dataAttr) {
        var attr = dataAttr || '';
        if (field.type === '数字输入') {
          return '<input class="input" type="number" ' + attr + ' value="' + escapeHtml(value == null ? '' : value) + '" placeholder="请输入" />';
        }
        if (field.type === '文本输入') {
          return '<input class="input" type="text" ' + attr + ' value="' + escapeHtml(value == null ? '' : value) + '" placeholder="' + escapeHtml(field.placeholder || '请输入') + '" />';
        }
        if (field.type === '开关') {
          return '<button class="switch' + (value ? ' is-on' : '') + '" type="button" ' + attr + ' aria-label="开关"></button>';
        }
        if (field.type === '下拉选择') {
          var opts = (field.options || []).map(function (o) {
            var selected = String(o.value) === String(value) ? ' selected' : '';
            return '<option value="' + escapeHtml(o.value) + '"' + selected + '>' + escapeHtml(o.label) + '</option>';
          }).join('');
          return '<select class="input" ' + attr + '>' + opts + '</select>';
        }
        return '';
      }

      function renderStartupTab() {
        var html = '';
        STARTUP_FIELDS.forEach(function (field) {
          if (field.type === 'Array') {
            html += renderArrayField(field, state.draft.startup[field.key] || []);
          } else {
            html +=
              '<div class="form-item">' +
                '<div class="form-item__label">' + escapeHtml(field.name) + '</div>' +
                '<div class="form-item__control">' +
                  renderFieldControl(field, state.draft.startup[field.key], 'data-startup-key="' + escapeHtml(field.key) + '"') +
                '</div>' +
              '</div>';
          }
        });
        UI.$('tabStartup').innerHTML = html;
      }

      function renderArrayField(field, rowsData) {
        var maxRows = field.maxRows;
        var showAdd = maxRows == null || maxRows === '' || Number(maxRows) > 1;
        if (maxRows === 1) showAdd = false;
        var countLabel = '';
        if (maxRows != null && maxRows !== '' && Number(maxRows) > 1) {
          countLabel = '（' + rowsData.length + '/' + maxRows + '）';
        }
        var addDisabled = maxRows != null && maxRows !== '' && rowsData.length >= Number(maxRows);
        var html =
          '<div class="array-field" data-array-key="' + escapeHtml(field.key) + '">' +
            '<div class="param-toolbar">' +
              '<div class="param-toolbar__title">' + escapeHtml(field.name) + countLabel + '</div>' +
              (showAdd
                ? '<button class="btn btn--text btn--sm" type="button" data-array-add="' + escapeHtml(field.key) + '"' + (addDisabled ? ' disabled' : '') + '>添加</button>'
                : '') +
            '</div>';

        rowsData.forEach(function (row, idx) {
          var canDelete = !(maxRows === 1) && idx > 0;
          if (maxRows === 1) canDelete = false;
          html +=
            '<div class="array-row" data-array-index="' + idx + '">' +
              '<div class="array-row__head">' +
                '<span>第 ' + (idx + 1) + ' 行</span>' +
                '<button class="link" type="button" data-array-del="' + escapeHtml(field.key) + '" data-index="' + idx + '"' + (canDelete ? '' : ' disabled') + '>删除</button>' +
              '</div>';
          (field.children || []).forEach(function (child) {
            html +=
              '<div class="form-item">' +
                '<div class="form-item__label">' + escapeHtml(child.name) + '</div>' +
                '<div class="form-item__control">' +
                  renderFieldControl(child, row[child.key], 'data-array-field="' + escapeHtml(field.key) + '" data-index="' + idx + '" data-child="' + escapeHtml(child.key) + '"') +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;

      function openJsonModal(app) {

      function buildJsonPayload(app, sdkVersion, appVersion) {
        var cfg = app.config || {
          startup: defaultStartupValues(),
          plugins: defaultPluginValues(app.platform),
          ad: emptyAdConfig(),
          iap: emptyIapConfig()
        };
        var ad = cfg.ad || emptyAdConfig();
        var bannerIds = [];
        var interIds = [];
        var nativeIds = [];
        var rewardIds = [];
        var splashIds = [];
        (ad.units || []).forEach(function (u) {
          if (!u.unitId) return;
          var item = {
            ad_type: u.network,
            ad_pos: u.unitId,
            ad_name: u.unitName,
            ad_bid_floor_price: String(u.floor == null || u.floor === '' ? '0' : u.floor)
          };
          if (u.adType === 'Banner') bannerIds.push(item);
          else if (u.adType === 'Interstitial') interIds.push(item);
          else if (u.adType === 'Native') nativeIds.push(item);
          else if (u.adType === 'Rewarded') rewardIds.push(item);
          else if (u.adType === 'Splash') splashIds.push(item);
        });

        var iap = cfg.iap || emptyIapConfig();
        var consumableIds = [];
        var nonConsumableIds = [];
        var subscribeIds = [];
        (iap.products || []).forEach(function (p) {
          if (!p.productId) return;
          var item = { productId: p.productId, dollar_price: String(p.dollarPrice || '') };
          if (p.kind === 'nonConsumable') nonConsumableIds.push(item);
          else if (p.kind === 'subscribe') subscribeIds.push(item);
          else consumableIds.push(item);
        });

        var sdk_config = Object.assign({}, (cfg.plugins && cfg.plugins.sdk_config) || {}, {
          config_version: (cfg.startup && cfg.startup.config_version) || ((cfg.plugins && cfg.plugins.sdk_config && cfg.plugins.sdk_config.config_version) || '')
        });

        return {
          sdk_app_id: app.id,
          app_name: app.name,
          package_name: app.packageName,
          platform: app.platform,
          sdk_version: sdkVersion,
          app_version: appVersion,
          sdk_config: sdk_config,
          adjust_config: (cfg.plugins && cfg.plugins.adjust_config) || {},
          ta_config: (cfg.plugins && cfg.plugins.ta_config) || {},
          fb_config: (cfg.plugins && cfg.plugins.fb_config) || {},
          tiktok_config: (cfg.plugins && cfg.plugins.tiktok_config) || {},
          ad_config: {
            default_sdk_type: ad.defaultSdk,
            is_appKey: ad.isAppKey,
            max_appKey: ad.maxSdkKey,
            max_review_api_key: ad.maxReviewKey,
            max_package: ad.maxPackage,
            admob_application_id: ad.admobAppId,
            bannerIds: bannerIds,
            interIds: interIds,
            nativeIds: nativeIds,
            rewardIds: rewardIds,
            splashIds: splashIds
          },
          iap_config: {
            developer_account: iap.developerAccount,
            license_key: iap.licenseKey || '',
            shared_secret: iap.sharedSecret || '',
            consumableIds: consumableIds,
            nonConsumableIds: nonConsumableIds,
            subscribeIds: subscribeIds
          },
          startup_config: cfg.startup || {}
        };
      }

      function submitJsonDownload() {
        var sdkVersion = UI.$('jsonSdkVersion').value.trim();
        var appVersion = UI.$('jsonAppVersion').value.trim();
        UI.$('jsonSdkVersion').classList.remove('is-error');
        UI.$('jsonAppVersion').classList.remove('is-error');
        if (!sdkVersion) {
          UI.$('jsonSdkVersion').classList.add('is-error');
          UI.showToast('请输入SDK版本号', 'error');
          return;
        }
        if (!appVersion) {
          UI.$('jsonAppVersion').classList.add('is-error');
          UI.showToast('请输入APP版本号', 'error');
          return;
        }
        var app = rows.find(function (r) { return r.id === state.jsonAppId; });
        if (!app) return;
        var payload = buildJsonPayload(app, sdkVersion, appVersion);
        var plain = clone(payload);
        var text = JSON.stringify(payload, null, 2);
        var filename = app.packageName + '_' + sdkVersion + '_' + appVersion + '.json';
        UI.downloadText(filename, text);

        var record = {
          id: UI.uid('json'),
          productId: app.id,
          productName: app.name,
          packageName: app.packageName,
          platform: app.platform,
          sdkVersion: sdkVersion,
          appVersion: appVersion,
          status: '启用',
          createdAt: new Date().toISOString(),
          json: plain
        };
        var stored = [];
        try {
          stored = JSON.parse(localStorage.getItem(LS_JSON_KEY) || '[]');
          if (!Array.isArray(stored)) stored = [];
        } catch (e) { stored = []; }
        stored.unshift(record);
        localStorage.setItem(LS_JSON_KEY, JSON.stringify(stored));
        UI.showToast('下载成功');
        closeJsonModal();
      }

        }),
        series: UI.bindSingleSelect({
          wrapId: 'formSeriesWrap', triggerId: 'formSeriesTrigger', panelId: 'formSeriesPanel', labelId: 'formSeriesLabel', clearId: 'formSeriesClear',
          getValue: function () { return state.formSeries; },
          onChange: function (v) { state.formSeries = v; }
        }),
        owner: UI.bindSingleSelect({
          wrapId: 'formOwnerWrap', triggerId: 'formOwnerTrigger', panelId: 'formOwnerPanel', labelId: 'formOwnerLabel', clearId: 'formOwnerClear',
          getValue: function () { return state.formOwner; },
          onChange: function (v) { state.formOwner = v; UI.$('formOwnerTrigger').classList.remove('is-error'); }
        })
      };

      UI.bindSeg('platformSeg', function () { syncStoreIdVisibility(); });
      UI.bindSeg('statusSeg');

      UI.bindPagination({
        containerId: 'pagination',
        getTotal: function () { return getFiltered().length; },
        getPage: function () { return state.page; },
        getPageSize: function () { return state.pageSize; },
        onPageChange: function (page) { state.page = page; renderTable(); },
        onPageSizeChange: function (size) { state.pageSize = size; state.page = 1; renderTable(); }
      });

      function doSearch() {
        state.keyword = UI.$('filterKeyword').value || '';
        state.packageKw = UI.$('filterPackage').value || '';
        state.page = 1;
        renderTable();
      }

      UI.$('searchBtn').addEventListener('click', doSearch);
      UI.$('filterKeyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
      UI.$('filterPackage').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
      UI.$('addBtn').addEventListener('click', function () { openForm(null); });
      UI.$('formCancelBtn').addEventListener('click', closeForm);
      UI.$('formModalClose').addEventListener('click', closeForm);
      UI.$('formSubmitBtn').addEventListener('click', submitForm);
      UI.$('jsonCancelBtn').addEventListener('click', closeJsonModal);
      UI.$('jsonModalClose').addEventListener('click', closeJsonModal);
      UI.$('jsonSubmitBtn').addEventListener('click', submitJsonDownload);
      UI.$('configCancelBtn').addEventListener('click', closeConfig);
      UI.$('configDrawerClose').addEventListener('click', closeConfig);
      UI.$('configSubmitBtn').addEventListener('click', submitConfig);
      UI.$('configDrawerMask').addEventListener('click', closeConfig);

      UI.$('configTabs').addEventListener('click', function (e) {
        var item = e.target.closest('[data-tab]');
        if (!item) return;
        var app = rows.find(function (r) { return r.id === state.configAppId; });
        collectDraft();
        switchTab(item.getAttribute('data-tab'));
        if (item.getAttribute('data-tab') === 'startup') renderStartupTab();
        if (item.getAttribute('data-tab') === 'plugin' && app) renderPluginTab(app.platform);
        if (item.getAttribute('data-tab') === 'ad') renderAdTab();
        if (item.getAttribute('data-tab') === 'iap' && app) renderIapTab(app.platform);
      });

      UI.$('tabStartup').addEventListener('click', function (e) {
        var sw = e.target.closest('.switch');
        if (sw) {
          sw.classList.toggle('is-on');
          return;
        }
        var addBtn = e.target.closest('[data-array-add]');
        if (addBtn && !addBtn.disabled) {
          collectStartupFromDom();
          var key = addBtn.getAttribute('data-array-add');
          var field = STARTUP_FIELDS.find(function (f) { return f.key === key; });
          if (!field) return;
          var list = state.draft.startup[key] || [];
          if (field.maxRows != null && field.maxRows !== '' && list.length >= Number(field.maxRows)) return;
          list.push(emptyArrayRow(field));
          state.draft.startup[key] = list;
          renderStartupTab();
          return;
        }
        var delBtn = e.target.closest('[data-array-del]');
        if (delBtn && !delBtn.disabled) {
          collectStartupFromDom();
          var dkey = delBtn.getAttribute('data-array-del');
          var didx = Number(delBtn.getAttribute('data-index'));
          var dlist = state.draft.startup[dkey] || [];
          if (didx > 0) dlist.splice(didx, 1);
          state.draft.startup[dkey] = dlist;
          renderStartupTab();
        }
      });

      UI.$('tabAd').addEventListener('click', function (e) {
        if (e.target.closest('[data-ad-add]')) {
          collectAdFromDom();
          state.draft.ad.units.push({ network: 'MAX', adType: 'Banner', unitId: '', unitName: '', floor: '0' });
          renderAdUnits();
          return;
        }
        var del = e.target.closest('[data-ad-del]');
        if (del && !del.disabled) {
          collectAdFromDom();
          var idx = Number(del.getAttribute('data-ad-del'));
          if (idx > 0) state.draft.ad.units.splice(idx, 1);
          renderAdUnits();
          return;
        }
        if (e.target.closest('[data-ad-clear]') && !e.target.closest('[data-ad-clear]').disabled) {
          collectAdFromDom();
          state.draft.ad.units = [{ network: 'MAX', adType: 'Banner', unitId: '', unitName: '', floor: '0' }];
          renderAdUnits();
        }
      });

      UI.$('tabIap').addEventListener('click', function (e) {
        if (e.target.closest('[data-iap-add]')) {
          var app = rows.find(function (r) { return r.id === state.configAppId; });
          collectIapFromDom(app ? app.platform : 'Android');
          state.draft.iap.products.push({ kind: 'consumable', productId: '', productName: '', dollarPrice: '' });
          renderIapProducts();
          return;
        }
        var del = e.target.closest('[data-iap-del]');
        if (del && !del.disabled) {
          var app2 = rows.find(function (r) { return r.id === state.configAppId; });
          collectIapFromDom(app2 ? app2.platform : 'Android');
          var idx = Number(del.getAttribute('data-iap-del'));
          if (idx > 0) state.draft.iap.products.splice(idx, 1);
          renderIapProducts();
          return;
        }
        if (e.target.closest('[data-iap-clear]') && !e.target.closest('[data-iap-clear]').disabled) {
          var app3 = rows.find(function (r) { return r.id === state.configAppId; });
          collectIapFromDom(app3 ? app3.platform : 'Android');
          state.draft.iap.products = [{ kind: 'consumable', productId: '', productName: '', dollarPrice: '' }];
          renderIapProducts();
        }
      });

      UI.$('tableBody').addEventListener('click', function (e) {
        var copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          UI.copyText(copyBtn.getAttribute('data-copy'));
          return;
        }
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        var action = btn.getAttribute('data-action');
        var row = rows.find(function (r) { return r.id === id; });
        if (!row) return;
        if (action === 'edit') openForm(row);
        else if (action === 'config') openConfig(row);
        else if (action === 'json') openJsonModal(row);
        else if (action === 'toggle') {
          row.status = row.status === '启用' ? '禁用' : '启用';
          UI.showToast(row.status === '启用' ? '已启用' : '已禁用');
          renderTable();
        }
      });

      UI.$('formModal').addEventListener('click', function (e) {
        if (e.target === UI.$('formModal')) e.stopPropagation();
      });
      UI.$('jsonModal').addEventListener('click', function (e) {
        if (e.target === UI.$('jsonModal')) e.stopPropagation();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (UI.$('formModal').classList.contains('is-open')) closeForm();
        else if (UI.$('jsonModal').classList.contains('is-open')) closeJsonModal();
        else if (UI.$('configDrawer').classList.contains('is-open')) closeConfig();
      });

      renderTable();
    })();
  </script>
</body>
</html>
