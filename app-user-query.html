<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APP用户查询 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar">
          <div class="filter-item">
            <input class="input" id="filterKeyword" type="text" placeholder="用户ID / 设备ID" autocomplete="off" />
          </div>
          <div class="filter-actions">
            <button class="btn btn--primary" type="button" id="searchBtn">查询</button>
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
          </div>
        </div>

        <div class="data-panel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="userTable">
                <colgroup>
                  <col data-col-width="160" />
                  <col data-col-width="180" />
                  <col data-col-width="160" />
                  <col data-col-width="120" />
                  <col data-col-width="160" />
                  <col data-col-width="160" />
                </colgroup>
                <thead>
                  <tr>
                    <th>用户ID</th>
                    <th>设备ID</th>
                    <th>产品</th>
                    <th>平台</th>
                    <th>注册时间</th>
                    <th>最近活跃</th>
                  </tr>
                </thead>
                <tbody id="userBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip">暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="product-common.js"></script>
  <script src="product-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script>
    (function () {
      'use strict';
      var UI = window.ProductUI;
      ProductShell.mount('app-user-query');

      var state = { keyword: '', page: 1, pageSize: 20 };

      function renderTable() {
        var body = UI.$('userBody');
        var tip = UI.$('emptyTip');
        body.innerHTML = '';
        if (tip) tip.hidden = false;
        UI.renderPagination({
          containerId: 'pagination',
          total: 0,
          page: state.page,
          pageSize: state.pageSize,
          onPageChange: function (p) {
            state.page = p;
            renderTable();
          },
          onPageSizeChange: function (size) {
            state.pageSize = size;
            state.page = 1;
            renderTable();
          }
        });
        if (window.ColResize) ColResize.refresh(UI.$('userTable'));
      }

      function doSearch() {
        state.keyword = (UI.$('filterKeyword').value || '').trim();
        state.page = 1;
        renderTable();
      }

      function doReset() {
        UI.$('filterKeyword').value = '';
        state.keyword = '';
        state.page = 1;
        renderTable();
      }

      UI.$('searchBtn').addEventListener('click', doSearch);
      UI.$('resetBtn').addEventListener('click', doReset);
      UI.$('filterKeyword').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doSearch();
      });

      renderTable();
    })();
  </script>
</body>
</html>
