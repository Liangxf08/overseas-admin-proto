<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="assets/logo.png" type="image/png" />

<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img class="logo" src="assets/logo.png" width="32" height="32" alt="海外中台" />

      <nav class="header-nav" aria-label="顶部导航">
        <a href="#" class="header-nav__item" data-menu-name="首页">首页</a>
        <a href="dashboard.html" class="header-nav__item" data-menu-name="看板">看板</a>
        <a href="tiktok-accounts.html" class="header-nav__item" data-menu-name="产品">产品</a>
        <a href="feedback-tickets.html" class="header-nav__item" data-menu-name="工具">工具</a>
        <a href="menu-management.html" class="header-nav__item is-active" data-menu-name="管理">管理</a>
      </nav>

      <div class="header-right">
        <button class="header-icon" type="button" title="下载" aria-label="下载">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/>
          </svg>
        </button>
        <button class="header-icon" type="button" title="消息" aria-label="消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <a class="header-icon" href="https://m0v1x0i131y.feishu.cn/wiki/P7WcwmPrdigKg6keQbycBtYgn3d" target="_blank" rel="noopener noreferrer" title="帮助中心" aria-label="帮助中心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>
          </svg>
        </a>
        <button class="user-chip" type="button" aria-label="用户菜单">
          <img class="user-avatar" src="assets/avatar.jpg" width="32" height="32" alt="" />
          <span class="user-name">小风</span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4.5L6 7.5L9 4.5"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="body">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" aria-label="侧边栏导航">
          <div class="menu-group" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
              <span class="menu-group__title-text">系统管理</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 4.5L6 7.5L9 4.5"/>
              </svg>
            </button>
            <ul class="menu-children">
              <li>
                <a href="#" class="menu-item is-active">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                  </svg>
                  <span class="menu-item__text">菜单管理</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="menu-group" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <span class="menu-group__title-text">权限管理</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 4.5L6 7.5L9 4.5"/>
              </svg>
            </button>
            <ul class="menu-children">
              <li>
                <a href="#" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                  <span class="menu-item__text">用户管理</span>
                </a>
              </li>
              <li>
                <a href="#" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                  <span class="menu-item__text">角色管理</span>
                </a>
              </li>
              <li>
                <a href="#" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
                  </svg>
                  <span class="menu-item__text">数据组管理</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <div class="sidebar-footer">
          <button class="sidebar-collapse-btn" id="sidebarToggle" type="button" title="折叠菜单" aria-label="折叠侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h16"/><path d="M15 9l-3 3 3 3"/>
            </svg>
          </button>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="content-card" id="contentCard">
          <div class="toolbar">
            <div class="toolbar-left">
              <button class="btn btn--success" type="button" id="addMenuBtn">添加</button>
              <button class="btn btn--primary" type="button" id="sortMenuBtn">排序</button>
              <button class="btn btn--default" type="button" id="collapseAllBtn">收起</button>
            </div>
            <div class="toolbar-right">
              <button class="icon-btn" type="button" id="refreshBtn" title="刷新" aria-label="刷新">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
              </button>
              <button class="icon-btn" type="button" id="fullscreenBtn" title="全屏" aria-label="全屏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="table-shell" id="tableShell">
          <div class="table-loading" id="tableLoading" aria-live="polite" aria-busy="false">
            <div class="table-loading__spinner" aria-hidden="true"></div>
            <span>加载中...</span>
          </div>
          <div class="table-wrap">
            <table class="tree-table" id="treeTable">
              <thead>
                <tr>
                  <th class="col-name">路由名称</th>
                  <th class="col-type">路由类型</th>
                  <th class="col-parent">关联父级</th>
                  <th class="col-path">路由地址</th>
                  <th class="col-perm">权限标识</th>
                  <th class="col-icon">菜单图标</th>
                  <th class="col-status">状态</th>
                  <th class="col-action">操作</th>
                </tr>
              </thead>
              <tbody id="treeBody">
                <!-- rows injected by JS -->
              </tbody>
            </table>
          </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 顶部提示：排序中 / 保存成功 -->
  <div class="page-msg" id="pageMsg" role="status" aria-live="polite" aria-hidden="true"></div>
  <div class="sort-ghost" id="sortGhost" aria-hidden="true"></div>

  <!-- 添加菜单弹窗 -->
  <div class="modal-mask" id="menuModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="menuModalTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="menuModalTitle">添加菜单</h2>
        <button class="modal__close" type="button" id="menuModalClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M2 2l8 8M10 2L2 10"/>
          </svg>
        </button>
      </div>
      <form class="modal__body" id="menuForm" autocomplete="off">
        <div class="form-item">
          <div class="form-item__label">路由类型</div>
          <div class="form-item__control">
            <div class="seg" id="menuTypeSeg" role="radiogroup" aria-label="路由类型">
              <button type="button" class="seg__item is-active" data-value="nav">导航</button>
              <button type="button" class="seg__item" data-value="dir">目录</button>
              <button type="button" class="seg__item" data-value="page">页面</button>
              <button type="button" class="seg__item" data-value="btn">按钮</button>
              <button type="button" class="seg__item" data-value="link">外链</button>
            </div>
            <input type="hidden" name="type" id="menuTypeInput" value="nav">
          </div>
        </div>
        <div class="form-item" data-field="name">
          <div class="form-item__label"><span class="req">*</span>路由名称</div>
          <div class="form-item__control">
            <div class="input-wrap has-count" data-clearable>
              <input class="input input--count" type="text" name="name" id="menuNameInput" placeholder="请输入" maxlength="12">
              <button type="button" class="input-clear" aria-label="清空" tabindex="-1">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <span class="input-count" id="menuNameCount">0/12</span>
            </div>
            <div class="form-item__error" id="menuNameError">请输入路由名称</div>
          </div>
        </div>
        <div class="form-item" data-field="path">
          <div class="form-item__label"><span class="req">*</span>路由地址</div>
          <div class="form-item__control">
            <div class="input-wrap" data-clearable>
              <input class="input" type="text" name="path" id="menuPathInput" placeholder="请输入">
              <button type="button" class="input-clear" aria-label="清空" tabindex="-1">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
            <div class="form-item__error" id="menuPathError">请输入路由地址</div>
          </div>
        </div>
        <div class="form-item" data-field="perm">
          <div class="form-item__label">权限标识</div>
          <div class="form-item__control">
            <div class="input-wrap" data-clearable>
              <input class="input" type="text" name="perm" id="menuPermInput" placeholder="请输入">
              <button type="button" class="input-clear" aria-label="清空" tabindex="-1">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
            <div class="form-item__error" id="menuPermError">权限标识已存在</div>
          </div>
        </div>
        <div class="form-item" id="parentFormItem">
          <div class="form-item__label">上级菜单</div>
          <div class="form-item__control">
            <div class="combo" id="parentCombo">
              <button type="button" class="combo__trigger" id="parentComboTrigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="combo__trigger-text is-placeholder" id="parentComboLabel">请选择</span>
                <svg class="combo__caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <input type="hidden" name="parent" id="menuParentSelect" value="">
              <div class="combo__panel" id="parentComboPanel">
                <div class="combo__search">
                  <svg class="combo__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input class="combo__search-input" type="text" id="parentComboSearch" placeholder="搜索" autocomplete="off">
                </div>
                <div class="combo__list" id="parentComboList" role="listbox"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="form-item" id="iconFormItem">
          <div class="form-item__label">图标</div>
          <div class="form-item__control">
            <div class="combo" id="iconCombo">
              <button type="button" class="combo__trigger" id="iconComboTrigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="combo__trigger-icon" id="iconComboPreview"></span>
                <span class="combo__trigger-text is-placeholder" id="iconComboLabel">请选择</span>
                <svg class="combo__caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button type="button" class="combo__clear" id="iconComboClear" aria-label="清空图标" tabindex="-1">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <input type="hidden" name="icon" id="menuIconSelect" value="">
              <div class="combo__panel combo__panel--icons" id="iconComboPanel">
                <div class="combo__search">
                  <svg class="combo__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input class="combo__search-input" type="text" id="iconComboSearch" placeholder="搜索" autocomplete="off">
                </div>
                <div class="icon-grid" id="iconComboGrid" role="listbox"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">状态</div>
          <div class="form-item__control">
            <div class="seg" id="menuStatusSeg" role="radiogroup" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
            <input type="hidden" name="status" id="menuStatusInput" value="启用">
          </div>
        </div>
      </form>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="menuModalCancel">取消</button>
        <button class="btn btn--primary" type="button" id="menuModalSave">提交</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-mask modal-mask--confirm" id="confirmModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <button class="confirm-modal__close" type="button" id="confirmModalClose" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M2 2l8 8M10 2L2 10"/>
        </svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon" aria-hidden="true">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M3 3l6 6M9 3L3 9"/>
          </svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="confirmModalTitle">删除确认</h2>
          <p class="confirm-modal__body" id="confirmModalBody">此操作不可撤销，确定删除吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" id="confirmModalCancel">取消</button>
        <button class="btn btn--primary" type="button" id="confirmModalOk">确认</button>
      </div>
    </div>
  </div>

  <script src="product-common.js"></script>

      function buildTree(flat) {
        const rank = { nav: 0, dir: 1, page: 2, link: 3, btn: 4 };
        const nodes = flat.map((row) => ({ ...row, children: [] }));
        const byName = new Map();
        nodes.forEach((n) => {
          const prev = byName.get(n.name);
          if (!prev || (rank[n.type] ?? 9) < (rank[prev.type] ?? 9)) byName.set(n.name, n);
        });
        const roots = [];
        nodes.forEach((n) => {
          if (!n.parent || n.parent === '-') {
            roots.push(n);
            return;
          }
          const parent = byName.get(n.parent);
          if (parent && parent.id !== n.id) parent.children.push(n);
          else roots.push(n);
        });
        return roots;
      }

      let menuTree = buildTree(menuFlat);

      /** Flatten tree → rows with depth / parentId / hasChildren */
      function flatten(nodes, depth = 0, parentId = null, acc = []) {
        nodes.forEach((node) => {
          const hasChildren = !!(node.children && node.children.length);
          acc.push({
            ...node,
            depth,
            parentId,
            hasChildren,
            expanded: true,
          });
          if (hasChildren) flatten(node.children, depth + 1, node.id, acc);
        });
        return acc;
      }

      let flatRows = flatten(menuTree);
      const expandedMap = {};
      flatRows.forEach((r) => { if (r.hasChildren) expandedMap[r.id] = true; });

      const treeBody = document.getElementById('treeBody');
      let sortMode = false;
      let sortDragId = null;
      let sortDrop = { id: null, position: null };
      let pageMsgTimer = null;

      function isVisible(row) {
        if (!row.parentId) return true;
        let pid = row.parentId;
        while (pid) {
          if (!expandedMap[pid]) return false;
          const parent = flatRows.find((r) => r.id === pid);
          pid = parent ? parent.parentId : null;
        }
        return true;
      }

      function renderTable() {
        const html = flatRows.map((row) => {
          const typeInfo = TYPE_MAP[row.type] || TYPE_MAP.page;
          const indent = row.depth * 20;
          const toggleClass = row.hasChildren
            ? (expandedMap[row.id] ? 'tree-toggle' : 'tree-toggle is-collapsed')
            : 'tree-toggle is-leaf';
          const hidden = isVisible(row) ? '' : ' is-hidden';
          const canShowIcon = row.type !== 'nav' && row.type !== 'btn';
          let iconSvg = '';
          if (canShowIcon) {
            if (row.icon && ICONS[row.icon]) iconSvg = ICONS[row.icon];
            else if (row.icon && String(row.icon).indexOf('Icon') === 0) {
              iconSvg = `<iconify-icon icon="${arcoToIconify(row.icon)}"></iconify-icon>`;
            }
          }
          const statusClass = row.status === '禁用' ? 'tag tag--disabled' : 'tag tag--enabled';
          const canAddChild = row.type === 'nav' || row.type === 'dir' || row.type === 'page';
          const addChildBtn = canAddChild
            ? `<button class="link" type="button" data-action="add-child" data-id="${row.id}">添加下级</button>`
            : `<button class="link is-disabled" type="button" disabled title="按钮/外链不支持添加下级">添加下级</button>`;
          const dragHandle = `<span class="drag-handle" title="拖拽排序" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <circle cx="5" cy="4" r="1.2"/><circle cx="11" cy="4" r="1.2"/>
              <circle cx="5" cy="8" r="1.2"/><circle cx="11" cy="8" r="1.2"/>
              <circle cx="5" cy="12" r="1.2"/><circle cx="11" cy="12" r="1.2"/>
            </svg>
          </span>`;

          return `
            <tr data-id="${row.id}" data-parent="${row.parentId || ''}" data-type="${row.type}"
              class="${hidden}${sortMode ? ' is-sortable' : ''}">
              <td>
                <div class="tree-cell">
                  ${dragHandle}
                  <span class="tree-indent" style="width:${indent}px"></span>
                  <button class="${toggleClass}" type="button" data-toggle="${row.id}" aria-label="展开/折叠">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                  </button>
                  <span class="tree-name" title="${row.name}">${row.name}</span>
                </div>
              </td>
              <td><span class="${typeInfo.className}">${typeInfo.label}</span></td>
              <td>${row.parent === '-' ? '' : row.parent}</td>
              <td><span class="mono" title="${row.path}">${row.path}</span></td>
              <td><span class="mono" title="${row.perm}">${row.perm || ''}</span></td>
              <td><span class="cell-icon">${iconSvg}</span></td>
              <td><span class="${statusClass}">${row.status}</span></td>
              <td class="col-action">
                <div class="actions">
                  ${addChildBtn}
                  <button class="link" type="button" data-action="edit" data-id="${row.id}">编辑</button>
                  <button class="link link--danger" type="button" data-action="delete" data-id="${row.id}">删除</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        treeBody.innerHTML = html;
      }

      treeBody.addEventListener('click', (e) => {
        if (sortMode && e.target.closest('[data-action]')) return;
        const actionBtn = e.target.closest('[data-action]');
        if (actionBtn) {
          if (actionBtn.disabled || actionBtn.classList.contains('is-disabled')) return;
          const action = actionBtn.getAttribute('data-action');
          const id = actionBtn.getAttribute('data-id') || '';
          if (action === 'add-child') {
            const parentRow = menuFlat.find((r) => r.id === String(id));
            openMenuModal({
              parentId: id,
              parentType: parentRow ? parentRow.type : '',

          } else if (action === 'edit') {
            openEditMenuModal(id);
          } else if (action === 'delete') {
            openDeleteConfirm(id);
          }
          return;
        }
        const btn = e.target.closest('[data-toggle]');
        if (!btn || btn.classList.contains('is-leaf')) return;
        const id = btn.getAttribute('data-toggle');
        expandedMap[id] = !expandedMap[id];
        renderTable();
      });

      function showPageMsg(type, text, persistent) {
        const el = document.getElementById('pageMsg');
        if (!el) return;
        if (pageMsgTimer) {
          clearTimeout(pageMsgTimer);

        }
        const icon = type === 'success'
          ? '<svg class="page-msg__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>'
          : '<svg class="page-msg__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>';
        el.className = `page-msg page-msg--${type} is-show`;
        el.innerHTML = `${icon}<span>${text}</span>`;
        el.setAttribute('aria-hidden', 'false');

          pageMsgTimer = setTimeout(() => hidePageMsg(), 2500);
        }
      }

      function hidePageMsg() {
        const el = document.getElementById('pageMsg');
        if (!el) return;
        if (pageMsgTimer) {
          clearTimeout(pageMsgTimer);
          pageMsgTimer = null;
        }
        el.classList.remove('is-show');
        el.setAttribute('aria-hidden', 'true');
      }

      function canBeParentOf(parentType, childType) {
        if (!parentType || parentType === '-') return childType === 'nav';
        const map = {
          nav: ['dir', 'page', 'link'],
          dir: ['dir', 'page', 'link'],
          page: ['btn'],
          btn: [],
          link: [],
        };
        return (map[parentType] || []).indexOf(childType) !== -1;
      }

      function serializeTreeToFlat(nodes, parentName, acc) {
        nodes.forEach((n) => {
          acc.push({
            id: n.id,
            name: n.name,
            type: n.type,
            parent: parentName,
            path: n.path,
            perm: n.perm || '',
            icon: n.icon || '',
            status: n.status || '启用',
          });
          if (n.children && n.children.length) {
            serializeTreeToFlat(n.children, n.name, acc);
          }
        });
        return acc;
      }

      function findInTree(nodes, id, parent = null) {
        for (let i = 0; i < nodes.length; i += 1) {
          if (String(nodes[i].id) === String(id)) {
            return { node: nodes[i], siblings: nodes, index: i, parent };
          }
          const kids = nodes[i].children;
          if (kids && kids.length) {
            const found = findInTree(kids, id, nodes[i]);
            if (found) return found;
          }
        }
        return null;
      }

      function removeFromTree(nodes, id) {
        for (let i = 0; i < nodes.length; i += 1) {
          if (String(nodes[i].id) === String(id)) return nodes.splice(i, 1)[0];
          const kids = nodes[i].children;
          if (kids && kids.length) {
            const got = removeFromTree(kids, id);
            if (got) return got;
          }
        }
        return null;
      }

      function moveMenuNode(dragId, targetId, position) {
        dragId = String(dragId);
        targetId = String(targetId);
        if (!dragId || !targetId || dragId === targetId) return false;
        if (getDescendantIds(dragId).has(targetId)) return false;

        const drag = menuFlat.find((r) => r.id === dragId);
        const target = menuFlat.find((r) => r.id === targetId);
        if (!drag || !target) return false;

        const targetFlat = flatRows.find((r) => r.id === targetId);
        if (position === 'inside') {
          if (!canBeParentOf(target.type, drag.type)) return false;
        } else {
          const parentId = targetFlat ? targetFlat.parentId : null;
          if (!parentId) {
            if (!canBeParentOf(null, drag.type)) return false;
          } else {
            const parent = menuFlat.find((r) => r.id === parentId);
            if (!parent || !canBeParentOf(parent.type, drag.type)) return false;
          }
        }

        const tree = buildTree(menuFlat);
        const moved = removeFromTree(tree, dragId);
        if (!moved) return false;

        if (position === 'inside') {
          const t = findInTree(tree, targetId);
          if (!t) return false;
          if (!t.node.children) t.node.children = [];
          t.node.children.push(moved);
          expandedMap[targetId] = true;
        } else {
          const t = findInTree(tree, targetId);
          if (!t) return false;
          const idx = position === 'before' ? t.index : t.index + 1;
          t.siblings.splice(idx, 0, moved);
        }

        const next = serializeTreeToFlat(tree, '-', []);
        menuFlat.length = 0;
        next.forEach((row) => menuFlat.push(row));
        return true;
      }

      function clearDropMarkers() {
        treeBody.querySelectorAll('tr.drop-before, tr.drop-after, tr.drop-inside').forEach((tr) => {
          tr.classList.remove('drop-before', 'drop-after', 'drop-inside');
        });
        sortDrop = { id: null, position: null };
      }

      function resolveDropPosition(tr, clientY) {
        const rect = tr.getBoundingClientRect();
        const y = clientY - rect.top;
        const ratio = rect.height ? y / rect.height : 0.5;
        const targetType = tr.getAttribute('data-type');
        const drag = menuFlat.find((r) => r.id === sortDragId);
        if (drag && canBeParentOf(targetType, drag.type)) {
          if (ratio > 0.3 && ratio < 0.7) return 'inside';
        }
        return ratio < 0.5 ? 'before' : 'after';
      }

      function isValidDrop(dragId, targetId, position) {
        const drag = menuFlat.find((r) => r.id === String(dragId));
        const target = menuFlat.find((r) => r.id === String(targetId));
        if (!drag || !target || String(dragId) === String(targetId)) return false;
        if (getDescendantIds(dragId).has(String(targetId))) return false;
        if (position === 'inside') return canBeParentOf(target.type, drag.type);
        const targetFlat = flatRows.find((r) => r.id === String(targetId));
        const parentId = targetFlat ? targetFlat.parentId : null;
        if (!parentId) return canBeParentOf(null, drag.type);
        const parent = menuFlat.find((r) => r.id === parentId);
        return !!(parent && canBeParentOf(parent.type, drag.type));
      }

      function hideDragSubtree(dragId) {
        const ids = getDescendantIds(dragId);
        treeBody.querySelectorAll('tr[data-id]').forEach((tr) => {
          const id = tr.getAttribute('data-id');
          if (id === String(dragId)) tr.classList.add('is-dragging');
          else if (ids.has(id)) tr.classList.add('is-drag-hidden');
        });
      }

      function showSortGhost(name, clientX, clientY) {
        const ghost = document.getElementById('sortGhost');
        if (!ghost) return;
        ghost.innerHTML = `<span class="sort-ghost__icon"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="4" r="1.2"/><circle cx="11" cy="4" r="1.2"/><circle cx="5" cy="8" r="1.2"/><circle cx="11" cy="8" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="11" cy="12" r="1.2"/></svg></span><span>${name}</span>`;
        ghost.classList.add('is-show');
        ghost.style.left = `${clientX + 12}px`;
        ghost.style.top = `${clientY - 18}px`;
      }

      function moveSortGhost(clientX, clientY) {
        const ghost = document.getElementById('sortGhost');
        if (!ghost) return;
        ghost.style.left = `${clientX + 12}px`;
        ghost.style.top = `${clientY - 18}px`;
      }

      function hideSortGhost() {
        const ghost = document.getElementById('sortGhost');
        if (!ghost) return;
        ghost.classList.remove('is-show');
        ghost.innerHTML = '';
      }

      function updateDropTarget(clientX, clientY) {
        const el = document.elementFromPoint(clientX, clientY);
        const tr = el && el.closest ? el.closest('#treeBody tr.is-sortable') : null;
        if (!tr || tr.classList.contains('is-dragging') || tr.classList.contains('is-drag-hidden') || tr.classList.contains('is-hidden')) {
          clearDropMarkers();
          return;
        }
        const targetId = tr.getAttribute('data-id');
        const position = resolveDropPosition(tr, clientY);
        if (!isValidDrop(sortDragId, targetId, position)) {
          clearDropMarkers();
          return;
        }
        if (sortDrop.id === targetId && sortDrop.position === position) return;
        clearDropMarkers();
        tr.classList.add(`drop-${position}`);
        sortDrop = { id: targetId, position };
      }

      function endSortDrag(commit) {
        const card = document.getElementById('contentCard');
        const dragId = sortDragId;
        const targetId = sortDrop.id;
        const position = sortDrop.position;
        document.removeEventListener('pointermove', onSortPointerMove);
        document.removeEventListener('pointerup', onSortPointerUp);
        document.removeEventListener('pointercancel', onSortPointerUp);
        if (card) card.classList.remove('is-drag-active');
        hideSortGhost();
        clearDropMarkers();
        treeBody.querySelectorAll('tr.is-dragging, tr.is-drag-hidden').forEach((tr) => {
          tr.classList.remove('is-dragging', 'is-drag-hidden');
        });
        sortDragId = null;
        sortPointer = null;
        if (commit && dragId && targetId && position && moveMenuNode(dragId, targetId, position)) {
          menuTree = buildTree(menuFlat);
          flatRows = flatten(menuTree);
          flatRows.forEach((r) => {
            if (r.hasChildren && expandedMap[r.id] === undefined) expandedMap[r.id] = true;
          });
          renderTable();
        }
      }

      let sortPointer = null;

      function onSortPointerMove(e) {
        if (!sortPointer || !sortDragId) return;
        const dx = e.clientX - sortPointer.x;
        const dy = e.clientY - sortPointer.y;
        if (!sortPointer.started) {
          if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
          sortPointer.started = true;
          document.getElementById('contentCard').classList.add('is-drag-active');
          hideDragSubtree(sortDragId);
          const row = menuFlat.find((r) => r.id === String(sortDragId));
          showSortGhost(row ? row.name : '', e.clientX, e.clientY);
        }
        e.preventDefault();
        moveSortGhost(e.clientX, e.clientY);
        updateDropTarget(e.clientX, e.clientY);
      }

      function onSortPointerUp() {
        const started = sortPointer && sortPointer.started;
        endSortDrag(!!started);
      }

      treeBody.addEventListener('pointerdown', (e) => {
        if (!sortMode || e.button !== 0) return;
        const handle = e.target.closest('.drag-handle');
        if (!handle) return;
        const tr = handle.closest('tr.is-sortable');
        if (!tr || tr.classList.contains('is-hidden')) return;
        e.preventDefault();
        sortDragId = tr.getAttribute('data-id');
        sortPointer = { x: e.clientX, y: e.clientY, started: false };
        clearDropMarkers();
        document.addEventListener('pointermove', onSortPointerMove, { passive: false });
        document.addEventListener('pointerup', onSortPointerUp);
        document.addEventListener('pointercancel', onSortPointerUp);
      });

      let sortSnapshot = null;

      function cloneMenuFlat(list) {
        return JSON.parse(JSON.stringify(list));
      }

      function applyMenuFlat(list) {
        menuFlat.length = 0;
        list.forEach((row) => menuFlat.push(row));
        menuTree = buildTree(menuFlat);
        flatRows = flatten(menuTree);
        flatRows.forEach((r) => {
          if (r.hasChildren && expandedMap[r.id] === undefined) expandedMap[r.id] = true;
        });
      }

      function enterSortMode() {
        sortMode = true;
        sortSnapshot = cloneMenuFlat(menuFlat);
        document.getElementById('contentCard').classList.add('is-sorting');
        document.getElementById('sortMenuBtn').textContent = '保存';
        showPageMsg('warning', '拖拽排序后，请注意保存！按 Esc 可取消', true);
        renderTable();
      }

      function exitSortMode(opts) {
        const restore = !!(opts && opts.restore);
        const silent = !!(opts && opts.silent);
        if (sortPointer || sortDragId) endSortDrag(false);
        if (restore && sortSnapshot) {
          applyMenuFlat(sortSnapshot);
        }
        sortSnapshot = null;
        sortMode = false;
        sortDragId = null;
        sortPointer = null;
        document.getElementById('contentCard').classList.remove('is-sorting', 'is-drag-active');
        document.getElementById('sortMenuBtn').textContent = '排序';
        hidePageMsg();
        hideSortGhost();
        clearDropMarkers();
        renderTable();
        if (!silent) syncNavigationUI();
      }

      function saveSortOrder() {
        // 拖拽结果已写入 menuFlat，点击保存后正式生效并同步导航
        sortSnapshot = null;
        exitSortMode({ silent: false });
        showPageMsg('success', '保存成功', false);
      }

      function cancelSortMode() {
        exitSortMode({ restore: true });
        showPageMsg('warning', '已取消排序', false);
      }

      document.getElementById('sortMenuBtn').addEventListener('click', () => {
        if (sortMode) saveSortOrder();
        else enterSortMode();
      });

      /* —— 添加菜单弹窗 —— */
      const menuModal = document.getElementById('menuModal');
      const menuForm = document.getElementById('menuForm');
      const menuNameInput = document.getElementById('menuNameInput');
      const menuNameCount = document.getElementById('menuNameCount');
      const menuParentSelect = document.getElementById('menuParentSelect');
      const menuIconSelect = document.getElementById('menuIconSelect');
      const menuPermInput = document.getElementById('menuPermInput');
      const menuPathInput = document.getElementById('menuPathInput');
      const menuTypeSeg = document.getElementById('menuTypeSeg');
      let editingId = null;
      let editingSnapshot = null;

      /** Arco IconXxx → IconPark（Arco 图标库同源） */
      function arcoToIconify(componentName) {
        const name = String(componentName || '');
        const isFill = /Fill$/.test(name);
        const isColor = /Color$/.test(name);
        const bare = name.replace(/^Icon/, '').replace(/Fill$/, '').replace(/Color$/, '');
        const kebab = bare
          .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
          .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
          .toLowerCase();
        if (isFill) return 'icon-park-solid:' + kebab;
        if (isColor) return 'icon-park:' + kebab;
        return 'icon-park-outline:' + kebab;
      }

      function shortIconLabel(componentName) {
        return String(componentName || '').replace(/^Icon/, '');
      }

      function bindSeg(segEl, hiddenInput, onChange) {
        segEl.addEventListener('click', (e) => {
          if (segEl.classList.contains('is-readonly')) return;
          const item = e.target.closest('.seg__item');
          if (!item || item.style.display === 'none') return;
          segEl.querySelectorAll('.seg__item').forEach((el) => el.classList.remove('is-active'));
          item.classList.add('is-active');
          hiddenInput.value = item.getAttribute('data-value');
          if (typeof onChange === 'function') onChange(hiddenInput.value);
        });
      }

      bindSeg(document.getElementById('menuTypeSeg'), document.getElementById('menuTypeInput'), (type) => {
        syncIconFieldByType(type);
        syncParentFieldByType(type);
      });
      bindSeg(document.getElementById('menuStatusSeg'), document.getElementById('menuStatusInput'));

      menuNameInput.addEventListener('input', () => {
        menuNameCount.textContent = `${menuNameInput.value.length}/12`;
      });

      /* 输入框非空时 hover / focus 显示清空 */
      function syncClearable(wrap) {
        const input = wrap.querySelector('.input');
        if (!input) return;
        wrap.classList.toggle('has-value', input.value.length > 0);
      }

      document.querySelectorAll('[data-clearable]').forEach((wrap) => {
        const input = wrap.querySelector('.input');
        const clearBtn = wrap.querySelector('.input-clear');
        if (!input || !clearBtn) return;
        const update = () => syncClearable(wrap);
        input.addEventListener('input', update);
        input.addEventListener('change', update);
        clearBtn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          input.value = '';
          input.dispatchEvent(new Event('input', { bubbles: true }));
          syncClearable(wrap);
          input.focus();
        });
        syncClearable(wrap);
      });

      /* 上级菜单：层级路径 + 搜索 */
      let parentOptions = [];

      function buildParentOptions() {
        const options = [];
        function walk(nodes, trail) {
          (nodes || []).forEach((node) => {
            if (node.type === 'btn') return;
            const next = trail.concat(node.name);
            options.push({
              id: node.id,
              name: node.name,
              label: next.join('/'),
            });
            if (node.children && node.children.length) walk(node.children, next);
          });
        }
        walk(menuTree, []);
        return options;
      }

      function renderParentList(keyword) {
        const list = document.getElementById('parentComboList');
        const kw = (keyword || '').trim().toLowerCase();
        const filtered = parentOptions.filter((opt) => {
          if (!kw) return true;
          return opt.label.toLowerCase().indexOf(kw) !== -1
            || opt.name.toLowerCase().indexOf(kw) !== -1;
        });
        if (!filtered.length) {
          list.innerHTML = '<div class="combo__empty">无匹配菜单</div>';
          return;
        }
        const selected = menuParentSelect.value;
        list.innerHTML = filtered.map((opt) => `
          <button type="button" class="combo__option${opt.id === selected ? ' is-active' : ''}"
            data-id="${opt.id}" data-label="${opt.label.replace(/"/g, '&quot;')}" role="option">
            ${opt.label}
          </button>
        `).join('');
      }

      function setParentValue(id, label) {
        menuParentSelect.value = id || '';
        const labelEl = document.getElementById('parentComboLabel');
        const combo = document.getElementById('parentCombo');
        if (id && label) {
          labelEl.textContent = label;
          labelEl.classList.remove('is-placeholder');
          if (combo) combo.classList.add('has-value');
        } else {
          labelEl.textContent = '请选择';
          labelEl.classList.add('is-placeholder');
          if (combo) combo.classList.remove('has-value');
        }
      }

      function parentAllowedForType(type) {
        return type !== 'nav';
      }

      function syncParentFieldByType(type) {
        const allowed = parentAllowedForType(type);
        const formItem = document.getElementById('parentFormItem');
        const combo = document.getElementById('parentCombo');
        if (formItem) formItem.style.display = allowed ? '' : 'none';
        if (combo) combo.classList.toggle('is-disabled', !allowed);
        if (!allowed) {
          setParentValue('', '');
          closeCombo(combo);
        }
      }

      function closeCombo(comboEl) {
        if (!comboEl) return;
        comboEl.classList.remove('is-open');
        const trigger = comboEl.querySelector('.combo__trigger');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
      }

      function openCombo(comboEl) {
        document.querySelectorAll('.combo.is-open').forEach((el) => {
          if (el !== comboEl) closeCombo(el);
        });
        comboEl.classList.add('is-open');
        comboEl.querySelector('.combo__trigger').setAttribute('aria-expanded', 'true');
      }

      function fillParentOptions(selectedId, excludeIds) {
        const blocked = excludeIds instanceof Set ? excludeIds : new Set(excludeIds || []);
        parentOptions = buildParentOptions().filter((opt) => !blocked.has(opt.id));
        let label = '';
        if (selectedId) {
          const hit = parentOptions.find((o) => o.id === selectedId)
            || buildParentOptions().find((o) => o.id === selectedId);
          if (hit) label = hit.label;
        }
        setParentValue(selectedId || '', label);
        document.getElementById('parentComboSearch').value = '';
        renderParentList('');
      }

      function getDescendantIds(rootId) {
        const ids = new Set([String(rootId)]);
        let growing = true;
        while (growing) {
          growing = false;
          flatRows.forEach((r) => {
            if (r.parentId && ids.has(String(r.parentId)) && !ids.has(String(r.id))) {
              ids.add(String(r.id));
              growing = true;
            }
          });
        }
        return ids;
      }

      /* —— 删除确认 —— */
      const confirmModal = document.getElementById('confirmModal');
      let pendingDeleteId = null;

      function openDeleteConfirm(id) {
        const row = flatRows.find((r) => r.id === String(id));
        if (!row) return;
        pendingDeleteId = String(id);
        const hasKids = !!row.hasChildren;
        document.getElementById('confirmModalBody').textContent = hasKids
          ? '此操作将删除菜单及其子菜单，确定删除吗？'
          : '此操作不可撤销，确定删除吗？';
        UI.openModal('confirmModal');
      }

      function closeDeleteConfirm() {
        UI.closeModal('confirmModal');
        pendingDeleteId = null;
      }

      function confirmDeleteMenu() {
        if (!pendingDeleteId) return;
        const removeIds = getDescendantIds(pendingDeleteId);
        for (let i = menuFlat.length - 1; i >= 0; i -= 1) {
          if (removeIds.has(String(menuFlat[i].id))) menuFlat.splice(i, 1);
        }
        Object.keys(expandedMap).forEach((key) => {
          if (removeIds.has(String(key))) delete expandedMap[key];
        });
        closeDeleteConfirm();
        rebuildTable();
      }

      document.getElementById('confirmModalCancel').addEventListener('click', closeDeleteConfirm);
      document.getElementById('confirmModalClose').addEventListener('click', closeDeleteConfirm);
      document.getElementById('confirmModalOk').addEventListener('click', confirmDeleteMenu);
      /* 设计规范：点击遮罩不关闭 */

      function setFormLockedFields(locked) {
        menuTypeSeg.classList.toggle('is-readonly', !!locked);
        menuPermInput.disabled = !!locked;
        const permWrap = menuPermInput.closest('[data-clearable]');
        if (permWrap) permWrap.classList.toggle('is-readonly', !!locked);
      }

      document.getElementById('parentComboTrigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const combo = document.getElementById('parentCombo');
        if (combo.classList.contains('is-disabled')) return;
        if (!parentAllowedForType(document.getElementById('menuTypeInput').value)) return;
        if (combo.classList.contains('is-open')) closeCombo(combo);
        else {
          openCombo(combo);
          setTimeout(() => document.getElementById('parentComboSearch').focus(), 0);
        }
      });

      document.getElementById('parentComboSearch').addEventListener('input', (e) => {
        renderParentList(e.target.value);
      });

      document.getElementById('parentComboSearch').addEventListener('click', (e) => e.stopPropagation());

      document.getElementById('parentComboList').addEventListener('click', (e) => {
        e.stopPropagation();
        const opt = e.target.closest('.combo__option');
        if (!opt) return;
        setParentValue(opt.getAttribute('data-id'), opt.getAttribute('data-label'));
        closeCombo(document.getElementById('parentCombo'));
      });

      /* 图标：Arco Design 图标库（icons.json + IconPark 渲染） */
      let arcoIconList = [];

      function flattenArcoIcons(data) {
        const list = [];
        const icons = (data && data.icons) || {};
        Object.keys(icons).forEach((cat) => {
          const group = icons[cat] || {};
          Object.keys(group).forEach((style) => {
            (group[style] || []).forEach((item) => {
              if (item && item.componentName) {
                list.push({
                  name: item.componentName,
                  category: cat,
                  style,
                  iconify: arcoToIconify(item.componentName),
                  label: shortIconLabel(item.componentName),
                });
              }
            });
          });
        });
        return list;
      }

      function renderIconGrid(keyword) {
        const grid = document.getElementById('iconComboGrid');
        const kw = (keyword || '').trim().toLowerCase().replace(/^icon/, '');
        const filtered = arcoIconList.filter((item) => {
          if (!kw) return true;
          return item.name.toLowerCase().indexOf(kw) !== -1
            || item.label.toLowerCase().indexOf(kw) !== -1;
        });
        if (!filtered.length) {
          grid.innerHTML = '<div class="combo__empty" style="grid-column:1/-1">无匹配图标</div>';
          return;
        }
        const selected = menuIconSelect.value;
        /* 默认展示前 120 个，搜索时展示全部匹配 */
        const shown = kw ? filtered : filtered.slice(0, 120);
        grid.innerHTML = shown.map((item) => `
          <button type="button" class="icon-grid__item${item.name === selected ? ' is-active' : ''}"
            data-name="${item.name}" title="${item.name}" role="option">
            <iconify-icon icon="${item.iconify}"></iconify-icon>
            <span class="icon-grid__name">${item.label}</span>
          </button>
        `).join('');
      }

      function setIconValue(name) {
        menuIconSelect.value = name || '';
        const combo = document.getElementById('iconCombo');
        const labelEl = document.getElementById('iconComboLabel');
        const preview = document.getElementById('iconComboPreview');
        if (name) {
          labelEl.textContent = shortIconLabel(name);
          labelEl.classList.remove('is-placeholder');
          preview.classList.add('is-show');
          preview.innerHTML = ICONS[name]
            ? ICONS[name]
            : `<iconify-icon icon="${arcoToIconify(name)}"></iconify-icon>`;
          combo.classList.add('has-value');
        } else {
          labelEl.textContent = '请选择';
          labelEl.classList.add('is-placeholder');
          preview.classList.remove('is-show');
          preview.innerHTML = '';
          combo.classList.remove('has-value');
        }
      }

      function iconAllowedForType(type) {
        return type !== 'nav' && type !== 'btn';
      }

      function syncIconFieldByType(type) {
        const allowed = iconAllowedForType(type);
        const formItem = document.getElementById('iconFormItem');
        const combo = document.getElementById('iconCombo');
        if (formItem) formItem.style.display = allowed ? '' : 'none';
        if (combo) combo.classList.toggle('is-disabled', !allowed);
        if (!allowed) {
          setIconValue('');
          closeCombo(combo);
        }
      }

      function renderMenuIconHtml(icon) {
        if (!icon) return '';
        let html = '';
        if (ICONS[icon]) html = ICONS[icon];
        else if (String(icon).indexOf('Icon') === 0) {
          html = `<iconify-icon icon="${arcoToIconify(icon)}"></iconify-icon>`;
        }
        if (!html) return '';
        return html
          .replace('<svg ', '<svg class="menu-icon" ')
          .replace('<iconify-icon ', '<iconify-icon class="menu-icon" ');
      }

      function syncNavigationUI() {
        const headerNav = document.querySelector('.header-nav');
        const NAV_HREF = {
          首页: '#',
          看板: 'dashboard.html',
          产品: 'tiktok-accounts.html',
          工具: 'feedback-tickets.html',
          管理: 'menu-management.html',
        };
        if (headerNav) {
          const activeEl = headerNav.querySelector('.header-nav__item.is-active');
          const activeName = (activeEl && (activeEl.getAttribute('data-menu-name') || activeEl.textContent.trim())) || '管理';
          const navItems = menuFlat.filter((r) => r.type === 'nav' && r.status !== '禁用');
          headerNav.innerHTML = navItems.map((r) => {
            const isActive = r.name === activeName;
            const href = NAV_HREF[r.name] || '#';
            return `<a href="${href}" class="header-nav__item${isActive ? ' is-active' : ''}" data-menu-name="${r.name}">${r.name}</a>`;
          }).join('');
        }

        const sidebarNav = document.querySelector('.sidebar-nav');
        if (!sidebarNav) return;
        const manager = menuFlat.find((r) => r.name === '管理' && r.type === 'nav' && r.status !== '禁用');
        if (!manager) {
          sidebarNav.innerHTML = '';
          return;
        }
        const groups = menuFlat.filter((r) => r.parent === manager.name && r.type === 'dir' && r.status !== '禁用');
        const activeTextEl = sidebarNav.querySelector('.menu-item.is-active .menu-item__text');
        const activeItem = (activeTextEl && activeTextEl.textContent) || '菜单管理';
        const collapsed = {};
        sidebarNav.querySelectorAll('[data-group]').forEach((g) => {
          const title = g.querySelector('.menu-group__title-text');
          if (title) collapsed[title.textContent] = g.classList.contains('is-collapsed');
        });

        sidebarNav.innerHTML = groups.map((group) => {
          const children = menuFlat.filter((r) => r.parent === group.name && r.type === 'page' && r.status !== '禁用');
          const groupIcon = renderMenuIconHtml(group.icon);
          const isCollapsed = collapsed[group.name] ? ' is-collapsed' : '';
          const kids = children.map((page) => {
            const pageIcon = renderMenuIconHtml(page.icon);
            const active = page.name === activeItem ? ' is-active' : '';
            return `<li>
              <a href="#" class="menu-item${active}" data-menu-name="${page.name}">
                ${pageIcon}
                <span class="menu-item__text">${page.name}</span>
              </a>
            </li>`;
          }).join('');
          return `<div class="menu-group${isCollapsed}" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              ${groupIcon}
              <span class="menu-group__title-text">${group.name}</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 4.5L6 7.5L9 4.5"/>
              </svg>
            </button>
            <ul class="menu-children">${kids}</ul>
          </div>`;
        }).join('');

        sidebarNav.querySelectorAll('[data-group-toggle]').forEach((btn) => {
          btn.addEventListener('click', () => {
            btn.closest('[data-group]').classList.toggle('is-collapsed');
          });
        });
      }

      document.getElementById('iconComboTrigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const combo = document.getElementById('iconCombo');
        if (combo.classList.contains('is-disabled')) return;
        if (combo.classList.contains('is-open')) closeCombo(combo);
        else {
          openCombo(combo);
          setTimeout(() => document.getElementById('iconComboSearch').focus(), 0);
        }
      });

      document.getElementById('iconComboClear').addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIconValue('');
      });

      document.getElementById('iconComboSearch').addEventListener('input', (e) => {
        renderIconGrid(e.target.value);
      });

      document.getElementById('iconComboSearch').addEventListener('click', (e) => e.stopPropagation());

      document.getElementById('iconComboGrid').addEventListener('click', (e) => {
        e.stopPropagation();
        const item = e.target.closest('.icon-grid__item');
        if (!item) return;
        setIconValue(item.getAttribute('data-name'));
        closeCombo(document.getElementById('iconCombo'));
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.combo.is-open').forEach((combo) => closeCombo(combo));
      });

      fetch('arco-icons.json')
        .then((r) => r.json())
        .then((data) => {
          arcoIconList = flattenArcoIcons(data);
          renderIconGrid('');
        })
        .catch(() => {
          arcoIconList = [
            'IconHome', 'IconApps', 'IconDashboard', 'IconSettings', 'IconUser', 'IconUserGroup',
            'IconFolder', 'IconFile', 'IconMenu', 'IconList', 'IconTool', 'IconSafe', 'IconLink',
            'IconNotification', 'IconCalendar', 'IconStorage', 'IconCommon', 'IconNav',
          ].map((name) => ({
            name,
            label: shortIconLabel(name),
            iconify: arcoToIconify(name),
          }));
          renderIconGrid('');
        });

      const ADD_CHILD_TYPE_RULES = {
        nav: { allowed: ['dir', 'page', 'link'], defaultType: 'dir' },
        dir: { allowed: ['dir', 'page', 'link'], defaultType: 'page' },
        page: { allowed: ['btn'], defaultType: 'btn' },
      };

      function refreshSegCorners(segEl) {
        const items = Array.from(segEl.querySelectorAll('.seg__item')).filter((el) => el.style.display !== 'none');
        segEl.querySelectorAll('.seg__item').forEach((el) => {
          el.style.borderRadius = '0';
          el.style.marginLeft = '-1px';
        });
        items.forEach((el, i) => {
          if (i === 0) {
            el.style.marginLeft = '0';
            el.style.borderRadius = items.length === 1 ? '4px' : '4px 0 0 4px';
          } else if (i === items.length - 1) {
            el.style.borderRadius = '0 4px 4px 0';
          }
        });
      }

      function applyTypeOptions(allowed, defaultType) {
        const allow = allowed && allowed.length
          ? allowed
          : ['nav', 'dir', 'page', 'btn', 'link'];
        const def = defaultType && allow.indexOf(defaultType) !== -1 ? defaultType : allow[0];
        menuTypeSeg.querySelectorAll('.seg__item').forEach((el) => {
          const v = el.getAttribute('data-value');
          const on = allow.indexOf(v) !== -1;
          el.style.display = on ? '' : 'none';
          el.classList.toggle('is-active', v === def);
        });
        document.getElementById('menuTypeInput').value = def;
        refreshSegCorners(menuTypeSeg);
      }

      function resetMenuForm(defaults) {
        const d = defaults || {};
        menuForm.reset();
        clearFieldErrors();

        let type = d.type || 'nav';
        if (d.editId) {
          /* 编辑不可改类型：只展示当前类型，与添加下级一致 */
          applyTypeOptions([type], type);
        } else if (d.parentType && ADD_CHILD_TYPE_RULES[d.parentType]) {
          const rule = ADD_CHILD_TYPE_RULES[d.parentType];
          applyTypeOptions(rule.allowed, rule.defaultType);
          type = rule.defaultType;
        } else {
          applyTypeOptions(['nav', 'dir', 'page', 'btn', 'link'], type);
        }

        const status = d.status || '启用';
        document.getElementById('menuTypeInput').value = type;
        document.getElementById('menuStatusInput').value = status;
        document.querySelectorAll('#menuTypeSeg .seg__item').forEach((el) => {
          if (el.style.display === 'none') return;
          el.classList.toggle('is-active', el.getAttribute('data-value') === type);
        });
        document.querySelectorAll('#menuStatusSeg .seg__item').forEach((el) => {
          el.classList.toggle('is-active', el.getAttribute('data-value') === status);
        });
        refreshSegCorners(document.getElementById('menuStatusSeg'));

        menuNameInput.value = d.name || '';
        menuNameCount.textContent = `${menuNameInput.value.length}/12`;
        menuPathInput.value = d.path || '';
        menuPermInput.value = d.perm || '';

        const excludeIds = d.editId ? getDescendantIds(d.editId) : null;
        fillParentOptions(d.parentId || '', excludeIds);
        setIconValue(d.icon || '');
        document.getElementById('iconComboSearch').value = '';
        renderIconGrid('');
        closeCombo(document.getElementById('parentCombo'));
        closeCombo(document.getElementById('iconCombo'));
        document.querySelectorAll('[data-clearable]').forEach(syncClearable);
        setFormLockedFields(!!d.editId);
        syncIconFieldByType(type);
        syncParentFieldByType(type);
      }

      function openMenuModal(defaults) {
        editingId = (defaults && defaults.editId) || null;
        editingSnapshot = editingId
          ? { path: (defaults && defaults.path) || '', perm: (defaults && defaults.perm) || '' }
          : null;
        document.getElementById('menuModalTitle').textContent = editingId ? '编辑菜单' : '添加菜单';
        resetMenuForm(defaults || {});
        UI.openModal('menuModal');
        setTimeout(() => menuNameInput.focus(), 50);
      }

      function openEditMenuModal(id) {
        const row = menuFlat.find((r) => r.id === String(id));
        if (!row) return;
        const flat = flatRows.find((r) => r.id === String(id));
        openMenuModal({
          editId: row.id,
          type: row.type,
          status: row.status || '启用',
          name: row.name,
          path: row.path,
          perm: row.perm || '',
          icon: row.icon || '',
          parentId: (flat && flat.parentId) || '',
        });
      }

      function closeMenuModal() {
        closeCombo(document.getElementById('parentCombo'));
        closeCombo(document.getElementById('iconCombo'));
        UI.closeModal('menuModal');
        editingId = null;
        editingSnapshot = null;
        setFormLockedFields(false);
      }

      function rebuildTable() {
        menuTree = buildTree(menuFlat);
        flatRows = flatten(menuTree);
        flatRows.forEach((r) => { if (r.hasChildren && expandedMap[r.id] === undefined) expandedMap[r.id] = true; });
        document.getElementById('collapseAllBtn').textContent = '收起';
        renderTable();
        syncNavigationUI();
      }

      document.getElementById('addMenuBtn').addEventListener('click', () => {
        if (sortMode) return;
        openMenuModal();
      });
      document.getElementById('menuModalClose').addEventListener('click', closeMenuModal);
      document.getElementById('menuModalCancel').addEventListener('click', closeMenuModal);
      /* 设计规范：点击遮罩不关闭 */
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (confirmModal.classList.contains('is-open')) closeDeleteConfirm();
          else if (menuModal.classList.contains('is-open')) closeMenuModal();
          else if (sortMode) cancelSortMode();
        }
      });

      function clearFieldErrors() {
        menuForm.querySelectorAll('.form-item.is-error').forEach((el) => el.classList.remove('is-error'));
      }

      function setFieldError(field, hasError, message) {
        const item = menuForm.querySelector(`.form-item[data-field="${field}"]`);
        if (!item) return;
        item.classList.toggle('is-error', !!hasError);
        if (hasError && message) {
          const err = item.querySelector('.form-item__error');
          if (err) err.textContent = message;
        }
      }

      function isPathDuplicate(path) {
        if (!path) return false;
        /* 编辑时未改动的原值，不视为与自身重复 */
        if (editingId && editingSnapshot && path === editingSnapshot.path) return false;
        return menuFlat.some((r) => String(r.path) === path && String(r.id) !== String(editingId));
      }

      function isPermDuplicate(perm) {
        if (!perm) return false;
        if (editingId && editingSnapshot && perm === editingSnapshot.perm) return false;
        return menuFlat.some((r) => r.perm && String(r.perm) === perm && String(r.id) !== String(editingId));
      }

      function validateMenuForm() {
        const name = menuNameInput.value.trim();
        const path = menuPathInput.value.trim();
        const perm = menuPermInput.value.trim();
        let firstInvalid = null;

        if (!name) {
          setFieldError('name', true, '请输入路由名称');
          firstInvalid = firstInvalid || menuNameInput;
        } else {
          setFieldError('name', false);
        }

        if (!path) {
          setFieldError('path', true, '请输入路由地址');
          firstInvalid = firstInvalid || menuPathInput;
        } else if (isPathDuplicate(path)) {
          setFieldError('path', true, '路由地址已存在');
          firstInvalid = firstInvalid || menuPathInput;
        } else {
          setFieldError('path', false);
        }

        if (!editingId && perm && isPermDuplicate(perm)) {
          setFieldError('perm', true, '权限标识已存在');
          firstInvalid = firstInvalid || menuPermInput;
        } else {
          setFieldError('perm', false);
        }

        if (firstInvalid) {
          firstInvalid.focus();
          return false;
        }
        return true;
      }

      menuNameInput.addEventListener('input', () => {
        if (menuNameInput.value.trim()) setFieldError('name', false);
      });
      menuPathInput.addEventListener('input', () => {
        const path = menuPathInput.value.trim();
        if (!path) {
          setFieldError('path', false);
          return;
        }
        if (isPathDuplicate(path)) setFieldError('path', true, '路由地址已存在');
        else setFieldError('path', false);
      });
      menuPermInput.addEventListener('input', () => {
        if (editingId) return;
        const perm = menuPermInput.value.trim();
        if (!perm) {
          setFieldError('perm', false);
          return;
        }
        if (isPermDuplicate(perm)) setFieldError('perm', true, '权限标识已存在');
        else setFieldError('perm', false);
      });

      document.getElementById('menuModalSave').addEventListener('click', () => {
        if (!validateMenuForm()) return;
        const name = menuNameInput.value.trim();
        const path = menuPathInput.value.trim();
        const parentId = menuParentSelect.value;
        const type = document.getElementById('menuTypeInput').value;
        const parentRow = type === 'nav' ? null : menuFlat.find((r) => r.id === parentId);
        const parentName = type === 'nav' ? '-' : (parentRow ? parentRow.name : '-');
        const status = document.getElementById('menuStatusInput').value;
        const icon = iconAllowedForType(type) ? menuIconSelect.value : '';

        if (editingId) {
          const row = menuFlat.find((r) => r.id === editingId);
          if (!row) return;
          const oldName = row.name;
          if (oldName !== name) {
            menuFlat.forEach((r) => {
              if (r.parent === oldName) r.parent = name;
            });
          }
          row.name = name;
          row.parent = parentName;
          row.path = path;
          row.icon = icon;
          row.status = status;
          /* 类型、权限标识编辑时不可改，保持原值 */
        } else {
          const nextId = String(menuFlat.reduce((max, r) => Math.max(max, Number(r.id) || 0), 0) + 1);
          menuFlat.push({
            id: nextId,
            name,
            type,
            parent: parentName,
            path,
            perm: menuPermInput.value.trim(),
            icon,
            status,
          });
        }
        closeMenuModal();
        rebuildTable();
      });

      menuForm.addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('menuModalSave').click();
      });

      /* Sidebar collapse */
      UI.bindSidebar();

      /* Collapse all tree rows */
      document.getElementById('collapseAllBtn').addEventListener('click', () => {
        const anyExpanded = Object.values(expandedMap).some(Boolean);
        flatRows.forEach((r) => {
          if (r.hasChildren) expandedMap[r.id] = !anyExpanded;
        });
        const btn = document.getElementById('collapseAllBtn');
        btn.textContent = anyExpanded ? '展开' : '收起';
        renderTable();
      });

      function setTableLoading(loading) {
        const shell = document.getElementById('tableShell');
        const el = document.getElementById('tableLoading');
        if (!shell || !el) return;
        shell.classList.toggle('is-loading', !!loading);
        el.setAttribute('aria-busy', loading ? 'true' : 'false');
      }

      function refreshTable() {
        if (document.getElementById('tableShell').classList.contains('is-loading')) return;
        setTableLoading(true);
        window.setTimeout(() => {
          rebuildTable();
          setTableLoading(false);
        }, 450);
      }

      /* Refresh */
      document.getElementById('refreshBtn').addEventListener('click', () => {
        refreshTable();
      });

      /* Fullscreen */
      document.getElementById('fullscreenBtn').addEventListener('click', () => {
        document.getElementById('contentCard').classList.toggle('is-fullscreen');
      });

      renderTable();
      syncNavigationUI();
    })();
  </script>
  <script src="col-resize.js"></script>
</body>
</html>
