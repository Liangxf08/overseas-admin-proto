  <script>
    (function () {
      const UI = window.ProductUI;
      const COPY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

      const PRODUCT_CATALOG = [
        { product: 'Tile Sort 3D (王牌分揀師)', platform: 'iOS' },
        { product: 'Tile Sort 3D (王牌分揀師)', platform: 'Android' },
        { product: 'Haggle Sleuth (砍價大偵探)', platform: 'Android' },
        { product: 'Pixel Bounce Jam (解壓彈球館)', platform: 'Android' },
        { product: 'Story Match: Associate Puzzle (腦洞故事會)', platform: 'Android' },
        { product: 'Hotpot Match 3D (做道拿手菜)', platform: 'Android' },
        { product: '文字の中に文字!', platform: 'iOS' },
        { product: '文字の中に文字!', platform: 'Android' },
        { product: 'Perfect Care: Cleaning ASMR (完美護理師)', platform: 'Android' },
        { product: 'Jigword:Word Search Games', platform: 'Android' },
        { product: '我要當學霸', platform: 'Android' }
      ];
      const VERSIONS = ['1.0.0', '1.1.2', '1.2.0', '1.3.5', '2.0.0', '2.1.1', '2.2.0'];
      const SDK_VERSIONS = ['3.2.1', '3.1.8', '3.0.5', '2.9.0', '2.8.3', '2.7.1'];
      const PLATFORMS = ['Android', 'iOS'];
      const PLATFORM_ICONS = {
        Android: 'assets/Android.png',
        iOS: 'assets/iOS.png'
      };
      const PRODUCT_OPTIONS = PRODUCT_CATALOG.map(function (item) {
        return item.product + '@@' + item.platform;
      });

      function parseProductOption(key) {
        const idx = String(key).lastIndexOf('@@');
        if (idx === -1) return { product: key, platform: '' };
        return { product: key.slice(0, idx), platform: key.slice(idx + 2) };
      }

      function productOptionIconHtml(key) {
        const platform = parseProductOption(key).platform;
        const src = PLATFORM_ICONS[platform];
        if (!src) return '';
        return '<span class="select-option-icon"><img src="' + src + '" alt="" /></span>';
      }

      function productOptionLabel(key) {
        return parseProductOption(key).product;
      }

      const STATUSES = ['待处理', '处理中', '已处理', '不处理'];
      const FEEDBACK_CONTENTS = [
        '一打开游戏就闪退，进不去主页，重装了还是一样。',
        '刚才充值成功了钱扣了但是钻石没到账，麻烦看一下。',
        '看广告的时候黑屏卡住，等了很久都没反应，只能强退。',
        '活动任务都做完了提示领取成功，但奖励根本没发到背包。',
        '想绑定邮箱一直失败，验证码怎么输都说不对。',
        '游戏里的音效关不掉，设置里关了还是一直响，好吵。',
        '玩到一半进度没了，重新登录关卡全回去了，气死。',
        '一直提示网络超时，WiFi和流量都试过了还是进不去。',
        '同样一条推送连续弹了好多遍，能不能修一下。',
        '点商店进去是白屏，什么都加载不出来，没法买东西。',
        '过关动画卡住不动，点屏幕也没用，只能退出重进。',
        '签到按钮点了没反应，今天的奖励领不了。'
      ];
      const SUMMARY_MAX_LEN = 40;

      function truncateSummary(text, maxLen) {
        const raw = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
        const limit = maxLen == null ? SUMMARY_MAX_LEN : maxLen;
        if (!raw) return '-';
        if (raw.length <= limit) return raw;
        return raw.slice(0, limit) + '...';
      }

      function pad(n) { return String(n).padStart(2, '0'); }

      function formatDate(d) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      }

      function formatDateTime(d) {
        return formatDate(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }

      function daysAgo(n) {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - n);
        return d;
      }

      function parseDate(str) {
        if (!str) return null;
        const d = new Date(str.replace(/-/g, '/'));
        return isNaN(d.getTime()) ? null : d;
      }

      function hashHex(seed, len) {
        let h = Math.abs(seed * 2654435761) >>> 0;
        let out = '';
        while (out.length < len) {
          h = Math.abs((h * 1664525 + 1013904223) >>> 0);
          out += h.toString(16).padStart(8, '0');
        }
        return out.slice(0, len);
      }

      function mockProductId(i) {
        return String(44760299 + i * 137);
      }

      function mockUuidHex(i) {
        return hashHex(i + 17, 32);
      }

      function mockUuidDashed(seed, upper) {
        const hex = hashHex(seed, 32);
        const dashed = hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20, 32);
        return upper ? dashed.toUpperCase() : dashed;
      }

      const IOS_MODELS = ['iPhone 8', 'iPhone 11', 'iPhone 12', 'iPhone 13', 'iPhone 14', 'iPhone SE'];
      const ANDROID_MODELS = ['Pixel 6', 'Samsung Galaxy S21', 'Xiaomi 12', 'OPPO Reno8', 'Huawei P40', 'OnePlus 9'];
      const IOS_OS_VERSIONS = ['iOS 11.2.2', 'iOS 14.8.1', 'iOS 15.7.0', 'iOS 16.4.1', 'iOS 17.0.3', 'iOS 17.2.1'];
      const ANDROID_OS_VERSIONS = ['Android 8.0.0', 'Android 10', 'Android 11', 'Android 12', 'Android 13', 'Android 14'];
      const TIMEZONES = ['UTC+0', 'UTC+8', 'UTC-5', 'UTC-8', 'UTC+1', 'UTC+9'];
      const REGIONS = [
        '美国 (US)',
        '中国 (CN)',
        '日本 (JP)',
        '英国 (GB)',
        '德国 (DE)',
        '巴西 (BR)',
        '印度 (IN)',
        '韩国 (KR)'
      ];

      function buildMockData() {
        const list = [];
        const now = Date.now();
        for (let i = 0; i < 48; i++) {
          const created = new Date(now - i * 5.5 * 3600 * 1000 - (i % 7) * 86400000);
          const updated = new Date(created.getTime() + (i % 5) * 3600 * 1000);
          const catalogItem = PRODUCT_CATALOG[i % PRODUCT_CATALOG.length];
          const platform = catalogItem.platform;
          const content = FEEDBACK_CONTENTS[i % FEEDBACK_CONTENTS.length];
          const isIos = platform === 'iOS';
          const installed = new Date(created.getTime() - ((i % 30) + 3) * 86400000 - (i % 24) * 3600 * 1000);
          list.push({
            id: 'FB' + String(10001 + i),
            productId: mockProductId(i),
            product: catalogItem.product,
            platform: platform,
            version: VERSIONS[i % VERSIONS.length],
            sdkVersion: SDK_VERSIONS[i % SDK_VERSIONS.length],
            content: content,
            email: 'user' + (i + 1) + '@mail.com',
            status: STATUSES[i % STATUSES.length],
            uuid: mockUuidHex(i),
            deviceId: mockUuidDashed(i + 91, true),
            visitorId: mockUuidDashed(i + 53, true),
            os: platform,
            deviceModel: (isIos ? IOS_MODELS : ANDROID_MODELS)[i % 6],
            osVersion: (isIos ? IOS_OS_VERSIONS : ANDROID_OS_VERSIONS)[i % 6],
            timezone: TIMEZONES[i % TIMEZONES.length],
            region: REGIONS[i % REGIONS.length],
            installedAt: formatDateTime(installed),
            levelId: ((i * 37) % 1000) + 1,
            createdAt: formatDateTime(created),
            updatedAt: formatDateTime(updated),
            createdTs: created.getTime(),
            updatedTs: updated.getTime()
          });
        }
        return list;
      }

      const allTickets = buildMockData();
      let filtered = allTickets.slice();
      let selectedIds = new Set();
      let selectedProducts = [];
      let selectedVersions = [];
      let selectedSdkVersions = [];
      let platformValue = '全部';
      let statusValue = '全部';
      let sortState = { specs: [], key: '', dir: '' };
      let currentPage = 1;
      let pageSize = 10;
      let drawerTicketId = null;
      let drawerStatus = null;
      let batchStatus = null;

      const ticketBody = document.getElementById('ticketBody');
      const emptyTip = document.getElementById('emptyTip');
      const checkAll = document.getElementById('checkAll');
      const batchBtn = document.getElementById('batchBtn');

      const escapeHtml = UI.escapeHtml;
      const showMsg = function (text, type) { UI.showToast(text, type); };
      const copyText = function (text) { UI.copyText(text); };

      const dateRange = UI.bindDateRange({
        wrapId: 'dateRangeWrap',
        triggerId: 'dateRangeTrigger',
        labelId: 'dateRangeLabel',
        panelId: 'datePanel',
        shortcutsId: 'dateShortcuts',
        calLeftId: 'dateCalLeft',
        calRightId: 'dateCalRight',
        prefix: '日期：',
        defaultShortcut: 'last7'
      });

      UI.bindMultiSelect({
        wrapId: 'productWrap',
        triggerId: 'productTrigger',
        panelId: 'productPanel',
        listId: 'productList',
        selectedId: 'productSelected',
        countId: 'productCount',
        labelId: 'productLabel',
        searchId: 'productSearch',
        selectAllId: 'productSelectAll',
        clearId: 'productClear',
        prefix: '产品：',
        options: PRODUCT_OPTIONS,
        getLabel: productOptionLabel,
        getIconHtml: productOptionIconHtml,
        getSelected: function () { return selectedProducts; },
        setSelected: function (v) { selectedProducts = v; }
      });

      UI.bindMultiSelect({
        wrapId: 'versionWrap',
        triggerId: 'versionTrigger',
        panelId: 'versionPanel',
        listId: 'versionList',
        selectedId: 'versionSelected',
        countId: 'versionCount',
        labelId: 'versionLabel',
        searchId: 'versionSearch',
        selectAllId: 'versionSelectAll',
        clearId: 'versionClear',
        prefix: 'APP版本：',
        options: VERSIONS,
        getSelected: function () { return selectedVersions; },
        setSelected: function (v) { selectedVersions = v; }
      });

      UI.bindMultiSelect({
        wrapId: 'sdkVersionWrap',
        triggerId: 'sdkVersionTrigger',
        panelId: 'sdkVersionPanel',
        listId: 'sdkVersionList',
        selectedId: 'sdkVersionSelected',
        countId: 'sdkVersionCount',
        labelId: 'sdkVersionLabel',
        searchId: 'sdkVersionSearch',
        selectAllId: 'sdkVersionSelectAll',
        clearId: 'sdkVersionClear',
        prefix: 'SDK版本：',
        options: SDK_VERSIONS,
        getSelected: function () { return selectedSdkVersions; },
        setSelected: function (v) { selectedSdkVersions = v; }
      });

      UI.bindSingleSelect({
        wrapId: 'platformWrap',
        triggerId: 'platformTrigger',
        panelId: 'platformPanel',
        labelId: 'platformLabel',
        prefix: '平台：',
        getValue: function () { return platformValue; },
        onChange: function (v) { platformValue = v || '全部'; }
      });

      UI.bindSingleSelect({
        wrapId: 'statusWrap',
        triggerId: 'statusTrigger',
        panelId: 'statusPanel',
        labelId: 'statusLabel',
        prefix: '状态：',
        getValue: function () { return statusValue; },
        onChange: function (v) { statusValue = v || '全部'; }
      });

      UI.bindPagination({
        containerId: 'pagination',
        getTotal: function () { return filtered.length; },
        getPage: function () { return currentPage; },
        getPageSize: function () { return pageSize; },
        onPageChange: function (p) { currentPage = p; renderTable(); },
        onPageSizeChange: function (s) { pageSize = s; currentPage = 1; renderTable(); }
      });

      const thSort = UI.bindThSort({
        root: '#ticketTable',
        getState: function () { return sortState; },
        setState: function (next) { sortState = next; },
        onChange: function () {
          filtered = applySort(filtered);
          renderTable();
        }
      });

      UI.bindSidebar();

      function applyFilter() {
        const start = dateRange.getStart();
        const end = dateRange.getEnd();
        let endTs = end ? end.getTime() + 86400000 - 1 : null;
        const contentKw = (document.getElementById('contentKeyword').value || '').trim().toLowerCase();
        const uuidKw = (document.getElementById('uuidKeyword').value || '').trim().toLowerCase();
        const deviceKw = (document.getElementById('deviceKeyword').value || '').trim().toLowerCase();

        filtered = allTickets.filter(function (row) {
          if (start && row.createdTs < start.getTime()) return false;
          if (endTs && row.createdTs > endTs) return false;
          if (platformValue !== '全部' && row.platform !== platformValue) return false;
          if (selectedProducts.length) {
            const matched = selectedProducts.some(function (key) {
              const opt = parseProductOption(key);
              return row.product === opt.product && row.platform === opt.platform;
            });
            if (!matched) return false;
          }
          if (selectedVersions.length && selectedVersions.indexOf(row.version) === -1) return false;
          if (selectedSdkVersions.length && selectedSdkVersions.indexOf(row.sdkVersion) === -1) return false;
          if (statusValue !== '全部' && row.status !== statusValue) return false;
          if (contentKw && row.content.toLowerCase().indexOf(contentKw) === -1) return false;
          if (uuidKw && row.uuid.toLowerCase().indexOf(uuidKw) === -1) return false;
          if (deviceKw && row.deviceId.toLowerCase().indexOf(deviceKw) === -1) return false;
          return true;
        });

        filtered = applySort(filtered);
        currentPage = 1;
        selectedIds.clear();
        renderTable();
      }

      function applySort(rows) {
        const specs = UI.resolveSortSpecs(sortState);
        if (!specs.length) {
          return rows.slice().sort(function (a, b) {
            return (b.createdTs || 0) - (a.createdTs || 0);
          });
        }
        return UI.sortRowsBySpecs(rows, specs, function (a, b, key) {
          const av = a[key] || 0;
          const bv = b[key] || 0;
          if (av === bv) return 0;
          return av > bv ? 1 : -1;
        });
      }

      function updateBatchBtn() {
        batchBtn.disabled = selectedIds.size === 0;
      }

      function renderTable() {
        const total = filtered.length;
        const pages = Math.max(1, Math.ceil(total / pageSize));
        if (currentPage > pages) currentPage = pages;
        const start = (currentPage - 1) * pageSize;
        const pageRows = filtered.slice(start, start + pageSize);

        emptyTip.hidden = pageRows.length > 0;
        ticketBody.innerHTML = pageRows.map(function (row) {
          const checked = selectedIds.has(row.id);
          return '<tr data-id="' + escapeHtml(row.id) + '">' +
            '<td class="col-check"><span class="cell-check"><input type="checkbox" data-check="' + escapeHtml(row.id) + '"' + (checked ? ' checked' : '') + ' aria-label="选择" /></span></td>' +
            '<td title="' + escapeHtml(row.product) + '">' + escapeHtml(row.product) + '</td>' +
            '<td>' + escapeHtml(row.platform) + '</td>' +
            '<td>' + escapeHtml(row.version) + '</td>' +
            '<td title="' + escapeHtml(row.content) + '">' + escapeHtml(truncateSummary(row.content)) + '</td>' +
            '<td>' + UI.taskStatusDot(row.status) + '</td>' +
            '<td><span class="cell-id"><button class="copy-btn" type="button" data-copy="' + escapeHtml(row.uuid) + '" aria-label="复制UUID">' + COPY_ICON + '</button><span class="cell-id__text" title="' + escapeHtml(row.uuid) + '">' + escapeHtml(row.uuid) + '</span></span></td>' +
            '<td><span class="cell-id"><button class="copy-btn" type="button" data-copy="' + escapeHtml(row.deviceId) + '" aria-label="复制设备ID">' + COPY_ICON + '</button><span class="cell-id__text" title="' + escapeHtml(row.deviceId) + '">' + escapeHtml(row.deviceId) + '</span></span></td>' +
            '<td title="' + escapeHtml(row.createdAt) + '">' + escapeHtml(row.createdAt) + '</td>' +
            '<td title="' + escapeHtml(row.updatedAt) + '">' + escapeHtml(row.updatedAt) + '</td>' +
            '<td class="col-action"><button class="link" type="button" data-detail="' + escapeHtml(row.id) + '">查看详情</button></td>' +
            '</tr>';
        }).join('');

        const pageChecked = pageRows.length && pageRows.every(function (r) { return selectedIds.has(r.id); });
        checkAll.checked = pageChecked;
        checkAll.indeterminate = !pageChecked && pageRows.some(function (r) { return selectedIds.has(r.id); });

        UI.renderPagination({
          containerId: 'pagination',
          total: total,
          page: currentPage,
          pageSize: pageSize
        });
        updateBatchBtn();
        if (thSort) thSort.sync();
      }

      function findTicket(id) {
        return allTickets.find(function (r) { return r.id === id; });
      }

      function openTicketDrawer(id) {
        const row = findTicket(id);
        if (!row) return;
        drawerTicketId = id;
        drawerStatus = row.status;
        const body = document.getElementById('drawerBody');
        function field(label, valueHtml) {
          return '<div class="detail-field"><div class="detail-field__label">' + label + '</div><div class="detail-field__value">' + valueHtml + '</div></div>';
        }
        function copyField(value, ariaLabel) {
          const v = value == null ? '' : String(value);
          return '<span class="cell-id"><span class="cell-id__text">' + escapeHtml(v || '-') + '</span><button class="copy-btn" type="button" data-copy="' + escapeHtml(v) + '" aria-label="' + escapeHtml(ariaLabel) + '">' + COPY_ICON + '</button></span>';
        }
        body.innerHTML =
          '<div class="detail-block detail-block--info">' +
            '<div class="detail-grid">' +
              field('工单ID', escapeHtml(row.id)) +
              field('产品ID', copyField(row.productId, '复制产品ID')) +
              field('产品名称', escapeHtml(row.product)) +
              field('平台', escapeHtml(row.platform)) +
              field('APP版本', escapeHtml(row.version)) +
              field('SDK版本', escapeHtml(row.sdkVersion || '-')) +
              field('UUID', copyField(row.uuid, '复制UUID')) +
              field('设备ID', copyField(row.deviceId, '复制设备ID')) +
              field('数数访客ID', copyField(row.visitorId, '复制数数访客ID')) +
              field('设备型号', escapeHtml(row.deviceModel || '-')) +
              field('系统版本', escapeHtml(row.osVersion || '-')) +
              field('国家地区', escapeHtml(row.region || '-')) +
              field('安装时间', escapeHtml(row.installedAt || '-')) +
              field('关卡ID', escapeHtml(row.levelId != null ? String(row.levelId) : '-')) +
              field('用户邮箱', copyField(row.email, '复制用户邮箱')) +
              field('当前状态', UI.taskStatusTag(row.status)) +
            '</div>' +
          '</div>' +
          '<div class="detail-block">' +
            '<div class="detail-block__title">问题描述</div>' +
            '<div class="detail-desc">' + escapeHtml(row.content) + '</div>' +
          '</div>' +
          '<div class="detail-block">' +
            '<div class="detail-block__title">状态更新</div>' +
            '<div class="status-quick" id="drawerStatusQuick">' +
              STATUSES.map(function (s) {
                return '<button class="status-quick__btn' + (s === drawerStatus ? ' is-active' : '') + '" type="button" data-status="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
              }).join('') +
            '</div>' +
          '</div>';

        UI.openDrawer('detailDrawer');
      }

      function closeTicketDrawer() {
        UI.closeDrawer('detailDrawer');
        drawerTicketId = null;
        drawerStatus = null;
      }

      function saveDrawerStatus() {
        if (!drawerTicketId || !drawerStatus) return;
        const row = findTicket(drawerTicketId);
        if (!row) return;
        if (row.status === drawerStatus) {
          showMsg('状态未变更');
          return;
        }
        row.status = drawerStatus;
        row.updatedAt = formatDateTime(new Date());
        row.updatedTs = Date.now();
        showMsg('状态已更新为「' + drawerStatus + '」');
        closeTicketDrawer();
        applyFilterKeepPage();
      }

      function applyFilterKeepPage() {
        const page = currentPage;
        applyFilter();
        currentPage = page;
        renderTable();
      }

      function openBatchModal() {
        if (!selectedIds.size) {
          showMsg('请先勾选工单', 'error');
          return;
        }
        batchStatus = null;
        document.getElementById('batchHint').textContent = '已选 ' + selectedIds.size + ' 条工单，请选择目标状态';
        document.querySelectorAll('#batchStatusQuick .status-quick__btn').forEach(function (btn) {
          btn.classList.remove('is-active');
        });
        UI.openModal('batchModal');
      }

      function closeBatchModal() {
        UI.closeModal('batchModal');
        batchStatus = null;
      }

      function confirmBatch() {
        if (!batchStatus) {
          showMsg('请选择目标状态', 'error');
          return;
        }
        let count = 0;
        selectedIds.forEach(function (id) {
          const row = findTicket(id);
          if (row) {
            row.status = batchStatus;
            row.updatedAt = formatDateTime(new Date());
            row.updatedTs = Date.now();
            count += 1;
          }
        });
        closeBatchModal();
        selectedIds.clear();
        showMsg('已批量更新 ' + count + ' 条为「' + batchStatus + '」');
        applyFilterKeepPage();
      }

      function exportCsv() {
        if (!filtered.length) {
          showMsg('暂无数据可导出', 'error');
          return;
        }
        const header = [
          '工单ID', '产品ID', '产品名称', '平台', 'APP版本', 'SDK版本', '问题详情',
          'UUID', '设备ID', '数数访客ID', '设备型号', '系统版本', '国家地区',
          '安装时间', '关卡ID', '用户邮箱', '状态', '创建时间', '更新时间'
        ];
        const lines = [header.join(',')].concat(filtered.map(function (r) {
          return [
            r.id, r.productId || '', r.product, r.platform, r.version, r.sdkVersion || '', r.content || '',
            r.uuid, r.deviceId, r.visitorId || '', r.deviceModel || '', r.osVersion || '', r.region || '',
            r.installedAt || '', r.levelId != null ? r.levelId : '', r.email || '', r.status, r.createdAt, r.updatedAt
          ].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; })
            .join(',');
        }));
        const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '用户反馈_' + formatDate(new Date()) + '.csv';
        a.click();
        URL.revokeObjectURL(url);
        showMsg('导出成功');
      }

      /* Events */
      document.getElementById('searchBtn').addEventListener('click', applyFilter);
      document.getElementById('exportBtn').addEventListener('click', exportCsv);
      document.getElementById('batchBtn').addEventListener('click', openBatchModal);

      ticketBody.addEventListener('click', function (e) {
        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          copyText(copyBtn.getAttribute('data-copy'));
          return;
        }
        const detailBtn = e.target.closest('[data-detail]');
        if (detailBtn) {
          openTicketDrawer(detailBtn.getAttribute('data-detail'));
          return;
        }
      });

      ticketBody.addEventListener('change', function (e) {
        const input = e.target.closest('[data-check]');
        if (!input) return;
        const id = input.getAttribute('data-check');
        if (input.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        renderTable();
      });

      checkAll.addEventListener('change', function () {
        const start = (currentPage - 1) * pageSize;
        const pageRows = filtered.slice(start, start + pageSize);
        pageRows.forEach(function (row) {
          if (checkAll.checked) selectedIds.add(row.id);
          else selectedIds.delete(row.id);
        });
        renderTable();
      });

      document.getElementById('drawerClose').addEventListener('click', closeTicketDrawer);
      document.getElementById('drawerCancel').addEventListener('click', closeTicketDrawer);
      document.getElementById('drawerSave').addEventListener('click', saveDrawerStatus);
      document.getElementById('detailDrawer').addEventListener('click', function (e) {
        if (e.target === this) closeTicketDrawer();
        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) copyText(copyBtn.getAttribute('data-copy'));
        const statusBtn = e.target.closest('#drawerStatusQuick [data-status]');
        if (statusBtn) {
          drawerStatus = statusBtn.getAttribute('data-status');
          document.querySelectorAll('#drawerStatusQuick .status-quick__btn').forEach(function (btn) {
            btn.classList.toggle('is-active', btn === statusBtn);
          });
        }
      });

      document.getElementById('batchClose').addEventListener('click', closeBatchModal);
      document.getElementById('batchCancel').addEventListener('click', closeBatchModal);
      document.getElementById('batchConfirm').addEventListener('click', confirmBatch);
      /* 点击遮罩不关闭 */
      document.getElementById('batchStatusQuick').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-status]');
        if (!btn) return;
        batchStatus = btn.getAttribute('data-status');
        document.querySelectorAll('#batchStatusQuick .status-quick__btn').forEach(function (el) {
          el.classList.toggle('is-active', el === btn);
        });
      });

      applyFilter();
    })();
  </script>
  <script src="col-resize.js"></script>
</body>
</html>
