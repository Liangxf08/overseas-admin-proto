<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聚合应用 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="ad-strategy.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar" id="filterBar">
          <div class="filter-item" id="filterNameWrap">
            <input class="input input-clearable" id="filterName" type="text" placeholder="产品名称" autocomplete="off" />
            <button class="select-clear" type="button" id="filterNameClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
          </div>
          <div class="filter-item" id="platformWrap">
            <button class="select-trigger" type="button" id="platformTrigger">
              <span class="select-trigger__text" id="platformLabel">平台：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="platformClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="platformPanel">
              <button class="single-option" type="button" data-value="">全部</button>
              <button class="single-option" type="button" data-value="Android">Android</button>
              <button class="single-option" type="button" data-value="iOS">iOS</button>
            </div>
          </div>
          <div class="filter-item" id="statusWrap">
            <button class="select-trigger" type="button" id="statusTrigger">
              <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="statusClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="statusPanel">
              <button class="single-option" type="button" data-value="">全部</button>
              <button class="single-option" type="button" data-value="启用">启用</button>
              <button class="single-option" type="button" data-value="禁用">禁用</button>
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
            <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
            <button class="btn btn--success" type="button" id="addBtn">添加</button>
          </div>
        </div>

        <div class="data-panel" id="dataPanel">
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="dataTable">
                <colgroup>
                  <col data-col-width="220" />
                  <col data-col-width="90" />
                  <col data-col-width="180" />
                  <col data-col-width="280" />
                  <col data-col-width="80" />
                  <col data-col-width="180" />
                  <col data-col-width="160" />
                </colgroup>
                <thead>
                  <tr>
                    <th>产品名称</th>
                    <th>平台</th>
                    <th>产品ID</th>
                    <th>关联场景</th>
                    <th>状态</th>
                    <th>更新时间</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-mask modal-mask--dropdown" id="editModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="editModalTitle">添加聚合应用</div>
        <button class="modal__close" type="button" data-close="editModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item" id="editProductItem">
          <label class="form-item__label is-required">产品</label>
          <div class="form-item__control" id="editProductWrap">
            <button class="select-trigger" type="button" id="editProductTrigger">
              <span class="select-trigger__text" id="editProductLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <div class="single-panel" id="editProductPanel"></div>
            <div class="form-item__error">请选择产品</div>
          </div>
        </div>
        <div class="form-item" id="editSceneItem">
          <label class="form-item__label is-required">关联场景</label>
          <div class="form-item__control" id="editSceneWrap">
            <button class="select-trigger" type="button" id="editSceneTrigger">
              <span class="select-trigger__text" id="editSceneLabel"><span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="editSceneClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel" id="editScenePanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input type="text" id="editSceneSearch" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="editSceneSelectAll">全选</button>
                </div>
                <div class="multi-panel__list" id="editSceneList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="editSceneCount">已选择 0 项</span>
                  <button class="multi-panel__link" type="button" id="editScenePanelClear">清空</button>
                </div>
                <div class="multi-panel__list" id="editSceneSelected"></div>
              </div>
            </div>
            <div class="form-item__error">请选择关联场景</div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">状态</label>
          <div class="form-item__control">
            <div class="seg" id="editStatusSeg" role="group" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="editModal">取消</button>
        <button class="btn btn--primary" type="button" id="editSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="sceneModal" aria-hidden="true">
    <div class="modal scene-modal" role="dialog" aria-modal="true" aria-labelledby="sceneModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="sceneModalTitle">关联场景</div>
        <button class="modal__close" type="button" data-close="sceneModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body scene-modal__body">
        <div class="transfer" id="sceneTransfer">
          <div class="transfer__panel">
            <div class="transfer__head">
              <label class="transfer__head-label">
                <input type="checkbox" id="availCheckAll" />
                <span>可选</span>
              </label>
              <span class="transfer__count" id="availCount">0 / 0</span>
            </div>
            <div class="transfer__search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              <input type="text" id="availSearch" placeholder="搜索" autocomplete="off" />
            </div>
            <div class="transfer__list" id="availList"></div>
          </div>
          <div class="transfer__ops">
            <button class="transfer__btn" type="button" id="moveToSelected" aria-label="加入已选" disabled>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2l4 4-4 4"/></svg>
            </button>
            <button class="transfer__btn" type="button" id="moveToAvail" aria-label="移出已选" disabled>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2L4 6l4 4"/></svg>
            </button>
          </div>
          <div class="transfer__panel">
            <div class="transfer__head">
              <label class="transfer__head-label">
                <input type="checkbox" id="selectedCheckAll" />
                <span>已选</span>
              </label>
              <span class="transfer__count" id="selectedCount">0 / 0</span>
            </div>
            <div class="transfer__search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              <input type="text" id="selectedSearch" placeholder="搜索" autocomplete="off" />
            </div>
            <div class="transfer__list" id="selectedList"></div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="sceneModal">取消</button>
        <button class="btn btn--primary" type="button" id="sceneSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-mask modal-mask--confirm" id="deleteModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <button class="confirm-modal__close" type="button" data-close="deleteModal" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon confirm-modal__icon--danger" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Zm4.955-27.771-4.95 4.95-4.95-4.95a1 1 0 0 0-1.414 0l-1.414 1.414a1 1 0 0 0 0 1.414l4.95 4.95-4.95 4.95a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l4.95-4.95 4.95 4.95a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-4.95-4.95 4.95-4.95a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0Z"/></svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="deleteTitle">删除确认</h2>
          <p class="confirm-modal__body">此操作不可撤销，确认删除吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" data-close="deleteModal">取消</button>
        <button class="btn btn--primary" type="button" id="deleteOk">确认</button>
      </div>
    </div>
  </div>

  <script src="product-common.js"></script>
  <script src="menu.js"></script>
  <script src="product-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script src="ad-strategy-data.js"></script>
  <script>ProductShell.mount('ad-agg-app');</script>
  <script src="ad-agg-app.js"></script>
</body>
</html>
