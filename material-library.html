<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>素材库 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="material-library.css" />
</head>
<body>
  <div class="app" id="appShell">
    <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar" id="filterBar">
          <div class="filter-item filter-item--date" id="dateRangeWrap">
            <button class="date-range-trigger" type="button" id="dateRangeTrigger">
              <span class="date-range-trigger__text" id="dateRangeLabel">更新时间：-</span>
            </button>
            <div class="date-panel" id="datePanel">
              <div class="date-panel__shortcuts" id="dateShortcuts">
                <button class="date-shortcut" type="button" data-shortcut="today">今天</button>
                <button class="date-shortcut" type="button" data-shortcut="yesterday">昨天</button>
                <button class="date-shortcut is-active" type="button" data-shortcut="last7">近7天</button>
                <button class="date-shortcut" type="button" data-shortcut="last30">近30天</button>
                <button class="date-shortcut" type="button" data-shortcut="thisWeek">本周</button>
                <button class="date-shortcut" type="button" data-shortcut="lastWeek">上周</button>
                <button class="date-shortcut" type="button" data-shortcut="thisMonth">本月</button>
                <button class="date-shortcut" type="button" data-shortcut="lastMonth">上月</button>
              </div>
              <div class="date-panel__calendars">
                <div class="date-cal" id="dateCalLeft"></div>
                <div class="date-cal" id="dateCalRight"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="folderWrap">
            <button class="select-trigger" type="button" id="folderTrigger">
              <span class="select-trigger__text" id="folderLabel">文件夹：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="folderClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="search-select-panel" id="folderPanel">
              <div class="search-select-panel__search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                <input type="text" id="folderSearch" placeholder="搜索" autocomplete="off" />
              </div>
              <div class="search-select-panel__list" id="folderList"></div>
            </div>
          </div>

          <div class="filter-item" id="uploaderWrap">
            <button class="select-trigger" type="button" id="uploaderTrigger">
              <span class="select-trigger__text" id="uploaderLabel">上传人：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="uploaderClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="search-select-panel" id="uploaderPanel">
              <div class="search-select-panel__search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                <input type="text" id="uploaderSearch" placeholder="搜索" autocomplete="off" />
              </div>
              <div class="search-select-panel__list" id="uploaderList"></div>
            </div>
          </div>

          <div class="filter-item">
            <input class="input" id="filterName" type="text" placeholder="素材名称" autocomplete="off" />
          </div>

          <div class="filter-actions">
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
            <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
          </div>
        </div>

        <div class="data-panel" id="dataPanel">
          <div class="data-toolbar">
            <button class="btn btn--default" type="button" id="refreshBtn" title="刷新">刷新</button>
            <button class="btn btn--primary" type="button" id="uploadBtn">上传</button>
          </div>
          <div class="table-shell">
            <div class="table-wrap">
              <table class="data-table" id="libraryTable">
                <colgroup>
                  <col data-col-width="80" />
                  <col data-col-width="220" />
                  <col data-col-width="220" />
                  <col data-col-width="112" />
                  <col data-col-width="112" />
                  <col data-col-width="88" />
                  <col data-col-width="180" />
                  <col data-col-width="120" />
                </colgroup>
                <thead>
                  <tr>
                    <th>缩略图</th>
                    <th>素材名称</th>
                    <th>文件夹</th>
                    <th>上传人</th>
                    <th>尺寸</th>
                    <th>时长</th>
                    <th>更新时间</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="preview-pop" id="previewPop" aria-hidden="true">
    <div class="preview-pop__media">视频预览</div>
    <div class="preview-pop__name" id="previewName"></div>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="material-sidebar.js"></script>
  <script src="col-resize.js"></script>
  <script>MaterialShell.mount('material-library');</script>
  <script src="material-library.js"></script>
</body>
</html>
