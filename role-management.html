<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色管理 - 海外中台</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="role-management.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <img class="logo" src="assets/logo.png" width="32" height="32" alt="海外中台" onerror="this.style.background='var(--color-fill-4)';this.removeAttribute('src')" />
        <span class="brand-name">海外中台</span>
      </div>
      <nav class="header-nav" aria-label="顶部导航">
        <a href="#" class="header-nav__item" data-menu-name="首页">首页</a>
        <a href="dashboard.html" class="header-nav__item" data-menu-name="看板">看板</a>
        <a href="tiktok-accounts.html" class="header-nav__item" data-menu-name="产品">产品</a>
        <a href="collection-tasks.html" class="header-nav__item" data-menu-name="素材">素材</a>
        <a href="download-tasks.html" class="header-nav__item" data-menu-name="工具">工具</a>
        <a href="menu-management.html" class="header-nav__item is-active" data-menu-name="管理">管理</a>
      </nav>
      <div class="header-right">
        <button class="header-icon" type="button" title="下载" aria-label="下载">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="header-icon" type="button" title="消息" aria-label="消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <a class="header-icon" href="https://m0v1x0i131y.feishu.cn/wiki/P7WcwmPrdigKg6keQbycBtYgn3d" target="_blank" rel="noopener noreferrer" title="帮助中心" aria-label="帮助中心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </a>
        <button class="user-chip" type="button" aria-label="用户菜单">
          <img class="user-avatar" src="assets/avatar.jpg" width="32" height="32" alt="" onerror="this.style.background='var(--color-fill-4)';this.removeAttribute('src')" />
          <span class="user-name">小风</span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" aria-label="侧边栏导航">
          <div class="menu-group" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
              <span class="menu-group__title-text">系统管理</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <ul class="menu-children">
              <li>
                <a href="menu-management.html" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                  </svg>
                  <span class="menu-item__text">菜单管理</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="menu-group" data-group>
            <button class="menu-group__title" type="button" data-group-toggle>
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <span class="menu-group__title-text">权限管理</span>
              <svg class="menu-group__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <ul class="menu-children">
              <li>
                <a href="user-management.html" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                  <span class="menu-item__text">用户管理</span>
                </a>
              </li>
              <li>
                <a href="role-management.html" class="menu-item is-active">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                  <span class="menu-item__text">角色管理</span>
                </a>
              </li>
              <li>
                <a href="datagroup-management.html" class="menu-item">
                  <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
                  </svg>
                  <span class="menu-item__text">数据组管理</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>
        <div class="sidebar-footer">
          <button class="sidebar-collapse-btn" id="sidebarToggle" type="button" title="折叠菜单" aria-label="折叠侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h16"/><path d="M15 9l-3 3 3 3"/>
            </svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <div class="content-card">
          <div class="filter-bar" id="filterBar">
            <div class="filter-item">
              <input class="input" id="filterName" type="text" placeholder="角色名称" autocomplete="off" />
            </div>
            <div class="filter-item">
              <input class="input" id="filterCode" type="text" placeholder="角色编码" autocomplete="off" />
            </div>
            <div class="filter-item" id="statusWrap">
              <button class="select-trigger" type="button" id="statusTrigger">
                <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="statusClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="single-panel" id="statusPanel">
                <button class="single-option" type="button" data-value="">全部</button>
                <button class="single-option" type="button" data-value="启用">启用</button>
                <button class="single-option" type="button" data-value="禁用">禁用</button>
              </div>
            </div>
            <div class="filter-actions">
              <button class="btn btn--default" type="button" id="resetBtn">重置</button>
              <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
              <button class="btn btn--success" type="button" id="addBtn">添加</button>
            </div>
          </div>

          <div class="data-panel" id="dataPanel">
            <div class="table-shell">
              <div class="table-wrap">
                <table class="data-table" id="roleTable">
                  <colgroup>
                    <col data-col-width="140" />
                    <col data-col-width="120" />
                    <col data-col-width="160" />
                    <col data-col-width="100" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                    <col data-col-width="200" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>角色名称</th>
                      <th>角色编码</th>
                      <th>备注</th>
                      <th>关联用户</th>
                      <th>状态</th>
                      <th>更新时间</th>
                      <th class="col-action">操作</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 添加 / 编辑角色 -->
  <div class="modal-mask" id="editModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="editModalTitle">编辑角色</div>
        <button class="modal__close" type="button" data-close="editModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item" id="editNameItem">
          <label class="form-item__label is-required">角色名称</label>
          <div class="form-item__control">
            <input class="input" id="editName" type="text" placeholder="请输入" autocomplete="off" />
            <div class="form-item__error">请输入角色名称</div>
          </div>
        </div>
        <div class="form-item" id="editCodeItem" hidden>
          <label class="form-item__label">角色编码</label>
          <div class="form-item__control">
            <input class="input" id="editCode" type="text" readonly disabled autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">备注</label>
          <div class="form-item__control">
            <input class="input" id="editRemark" type="text" placeholder="请输入" autocomplete="off" />
          </div>
        </div>
        <div class="form-item">
          <label class="form-item__label">状态</label>
          <div class="form-item__control">
            <div class="seg" id="editStatusSeg" role="group" aria-label="状态">
              <button type="button" class="seg__item is-active" data-value="启用">启用</button>
              <button type="button" class="seg__item" data-value="禁用">禁用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="editModal">取消</button>
        <button class="btn btn--primary" type="button" id="editSubmit">提交</button>
      </div>
    </div>
  </div>

  <!-- 角色权限 -->
  <div class="modal-mask" id="permModal" aria-hidden="true">
    <div class="modal modal--form perm-modal" role="dialog" aria-modal="true" aria-labelledby="permModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="permModalTitle">角色权限</div>
        <button class="modal__close" type="button" data-close="permModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body perm-modal__body">
        <div class="perm-search">
          <input class="input" id="permSearch" type="text" placeholder="请输入关键词搜索" autocomplete="off" />
          <button class="btn btn--primary" type="button" id="permSearchBtn">查询</button>
        </div>
        <div class="perm-tree" id="permTree" role="tree"></div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="permModal">取消</button>
        <button class="btn btn--primary" type="button" id="permSubmit">提交</button>
      </div>
    </div>
  </div>

  <!-- 关联用户 -->
  <div class="modal-mask" id="userModal" aria-hidden="true">
    <div class="modal user-modal" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="userModalTitle">关联用户</div>
        <button class="modal__close" type="button" data-close="userModal" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body user-modal__body">
        <div class="transfer" id="userTransfer">
          <div class="transfer__panel">
            <div class="transfer__head">
              <label class="transfer__head-label">
                <input type="checkbox" id="availCheckAll" />
                <span>可选</span>
              </label>
              <span class="transfer__count" id="availCount">0 / 0</span>
            </div>
            <div class="transfer__search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              <input type="text" id="availSearch" placeholder="搜索" autocomplete="off" />
            </div>
            <div class="transfer__list" id="availList"></div>
          </div>
          <div class="transfer__ops">
            <button class="transfer__btn" type="button" id="moveToSelected" aria-label="加入已选" disabled>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2l4 4-4 4"/></svg>
            </button>
            <button class="transfer__btn" type="button" id="moveToAvail" aria-label="移出已选" disabled>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2L4 6l4 4"/></svg>
            </button>
          </div>
          <div class="transfer__panel">
            <div class="transfer__head">
              <label class="transfer__head-label">
                <input type="checkbox" id="selectedCheckAll" />
                <span>已选</span>
              </label>
              <span class="transfer__count" id="selectedCount">0 / 0</span>
            </div>
            <div class="transfer__search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              <input type="text" id="selectedSearch" placeholder="搜索" autocomplete="off" />
            </div>
            <div class="transfer__list" id="selectedList"></div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" data-close="userModal">取消</button>
        <button class="btn btn--primary" type="button" id="userSubmit">提交</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-mask modal-mask--confirm" id="deleteModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <button class="confirm-modal__close" type="button" data-close="deleteModal" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon confirm-modal__icon--danger" id="deleteIcon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Zm4.955-27.771-4.95 4.95-4.95-4.95a1 1 0 0 0-1.414 0l-1.414 1.414a1 1 0 0 0 0 1.414l4.95 4.95-4.95 4.95a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l4.95-4.95 4.95 4.95a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-4.95-4.95 4.95-4.95a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0Z"/></svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="deleteTitle">删除确认</h2>
          <p class="confirm-modal__body" id="deleteBody">此操作不可撤销，确认删除吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" data-close="deleteModal">取消</button>
        <button class="btn btn--primary" type="button" id="deleteOk">确认</button>
      </div>
    </div>
  </div>

  <div class="page-msg" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="col-resize.js"></script>
  <script src="role-management.js"></script>
</body>
</html>
